name: Sujas Current Affairs Bot V2

on:
  workflow_run:
    workflows:
      - "Rajasthan Sujas Auto Upload"
    types: [completed]
  schedule:
    - cron: '0 5,10,15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Process the latest Sujas even if already processed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sujas-current-affairs-bot
  cancel-in-progress: false

jobs:
  process:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest Sujas PDF
        id: find_pdf
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import requests
          from datetime import datetime
          from pathlib import Path

          API_URL = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"
          FORCE = os.environ.get("FORCE", "false").lower() == "true"
          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {"AdvanceSearchModel": {}, "PageSize": 50, "IsPostBack": False, "OrderByAsc": 0, "Search": None, "OrderBy": None},
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          def get_items(data):
              if isinstance(data, list):
                  return data
              if isinstance(data, dict):
                  for key in ["Data", "data", "Result", "result", "Items", "items", "Records", "records"]:
                      value = data.get(key)
                      if isinstance(value, list):
                          return value
                      if isinstance(value, dict):
                          nested = get_items(value)
                          if nested:
                              return nested
              return []

          def find_pdf(obj):
              if isinstance(obj, dict):
                  for value in obj.values():
                      if isinstance(value, str) and ".pdf" in value.lower() and value.strip().lower().startswith(("http://", "https://")):
                          return value.strip()
                      found = find_pdf(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_pdf(value)
                      if found:
                          return found
              return None

          def title_of(record):
              return str(record.get("Title") or record.get("title") or "") if isinstance(record, dict) else ""

          def id_of(record):
              if not isinstance(record, dict):
                  return ""
              for key in ["Id", "ID", "id", "OrderId", "OrderID", "orderId"]:
                  value = record.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return ""

          def date_score(record):
              text = " ".join(str(v) for v in record.values() if isinstance(v, (str, int, float)))
              dates = []
              for pattern in [r"(\d{1,2})[-/](\d{1,2})[-/](\d{4})", r"(\d{4})[-/](\d{1,2})[-/](\d{1,2})"]:
                  for m in re.finditer(pattern, text):
                      try:
                          if len(m.group(1)) == 4:
                              dates.append(datetime(int(m.group(1)), int(m.group(2)), int(m.group(3))))
                          else:
                              dates.append(datetime(int(m.group(3)), int(m.group(2)), int(m.group(1))))
                      except ValueError:
                          pass
              return max(dates) if dates else datetime.min

          response = None
          for attempt in range(1, 7):
              print(f"DIPR API attempt {attempt}/6")
              try:
                  response = requests.post(API_URL, json=payload, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json"}, timeout=(45, 150))
                  print("DIPR HTTP:", response.status_code)
                  if response.status_code == 200:
                      break
                  if response.status_code in [408, 425, 429, 500, 502, 503, 504] and attempt < 6:
                      time.sleep(min(15 * attempt, 60))
                      continue
                  response.raise_for_status()
              except requests.RequestException as exc:
                  if attempt == 6:
                      raise SystemExit(f"DIPR request failed: {exc}")
                  time.sleep(min(15 * attempt, 60))

          records = get_items(response.json())
          if not records:
              raise SystemExit("DIPR में records नहीं मिले")

          candidates = []
          for record in records:
              if not isinstance(record, dict):
                  continue
              title = title_of(record)
              pdf_url = find_pdf(record)
              if pdf_url and ("sujas" in title.lower() or "सुजस" in title):
                  order_id = id_of(record)
                  candidates.append((date_score(record), int(order_id) if order_id.isdigit() else -1, title, order_id, pdf_url))

          if not candidates:
              raise SystemExit("Sujas PDF नहीं मिली")

          candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
          _, _, title, order_id, pdf_url = candidates[0]
          current_key = f"{order_id}|{pdf_url}"
          print("Sujas candidates:", len(candidates))
          print("LATEST TITLE:", title)
          print("LATEST ORDER ID:", order_id)
          print("LATEST PDF:", pdf_url)

          state_file = Path("current_affairs_sujas_state.txt")
          old_state = state_file.read_text(encoding="utf-8").strip() if state_file.exists() else ""
          old_id = old_state.split("|", 1)[0].strip() if old_state else ""
          same = bool(order_id and old_id and old_id == order_id)
          if same and "|" in old_state:
              same = old_state == current_key

          if same and not FORCE:
              print("SAME SUJAS — ALREADY PROCESSED")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("new_sujas=false\n")
                  out.write(f"current_key={current_key}\n")
              raise SystemExit(0)

          pdf_response = None
          for attempt in range(1, 5):
              print(f"PDF download attempt {attempt}/4")
              try:
                  pdf_response = requests.get(pdf_url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/pdf,*/*"}, timeout=(45, 180))
                  print("PDF HTTP:", pdf_response.status_code)
                  if pdf_response.status_code == 200:
                      break
                  if pdf_response.status_code in [408, 425, 429, 500, 502, 503, 504] and attempt < 4:
                      time.sleep(10 * attempt)
                      continue
                  pdf_response.raise_for_status()
              except requests.RequestException as exc:
                  if attempt == 4:
                      raise SystemExit(f"PDF download failed: {exc}")
                  time.sleep(10 * attempt)

          pdf_bytes = pdf_response.content
          if not pdf_bytes.startswith(b"%PDF"):
              raise SystemExit("Downloaded file PDF format में नहीं है")
          Path("sujas_current.pdf").write_bytes(pdf_bytes)
          print("PDF size:", len(pdf_bytes), "bytes")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("new_sujas=true\n")
              out.write("pdf_path=sujas_current.pdf\n")
              out.write(f"pdf_url={pdf_url}\n")
              out.write(f"order_id={order_id}\n")
              out.write(f"title={title}\n")
              out.write(f"current_key={current_key}\n")
          PY

      - name: Generate MCQs and send Telegram
        if: steps.find_pdf.outputs.new_sujas == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURRENT_AFFAIRS_BOT_TOKEN: ${{ secrets.CURRENT_AFFAIRS_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@yourbuddyravindrachoudhary"
          PDF_PATH: ${{ steps.find_pdf.outputs.pdf_path }}
          CURRENT_KEY: ${{ steps.find_pdf.outputs.current_key }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import random
          import time
          import requests
          from pathlib import Path

          API_KEY = os.environ["GEMINI_API_KEY"]
          BOT_TOKEN = os.environ["CURRENT_AFFAIRS_BOT_TOKEN"]
          CHANNEL = os.environ["TELEGRAM_CHANNEL"]
          PDF_PATH = Path(os.environ["PDF_PATH"])
          CURRENT_KEY = os.environ.get("CURRENT_KEY", "")

          pdf_base64 = base64.b64encode(PDF_PATH.read_bytes()).decode("utf-8")

          prompt = r"""
          तुम Rajasthan competitive examinations के लिए Current Affairs expert हो।
          संलग्न PDF ही एकमात्र source है। PDF के बाहर का कोई fact, अनुमान या सामान्य ज्ञान मत जोड़ो।
          PDF से कम से कम 10 अलग और valid MCQs बनाओ, लेकिन केवल तभी जब PDF में कम से कम 10 exam-relevant facts उपलब्ध हों।
          राजस्थान से संबंधित तथ्य प्राथमिकता में रखो। Duplicate या लगभग समान प्रश्न मत बनाओ।
          हर प्रश्न के ठीक 4 विकल्प हों और केवल एक सही उत्तर हो। answer केवल A, B, C या D हो।
          explanation केवल PDF के तथ्य पर आधारित हो। page उपलब्ध हो तो page number दो, नहीं हो तो N/A दो। source हमेशा Sujas रखो।
          भाषा साफ और शुद्ध हिंदी हो।
          केवल JSON दो:
          {"items":[{"category":"...","question":"...","option_a":"...","option_b":"...","option_c":"...","option_d":"...","answer":"A","explanation":"...","page":"...","source":"Sujas"}]}
          """

          schema = {
              "type": "object",
              "properties": {"items": {"type": "array", "items": {"type": "object", "properties": {
                  "category": {"type": "string"}, "question": {"type": "string"},
                  "option_a": {"type": "string"}, "option_b": {"type": "string"},
                  "option_c": {"type": "string"}, "option_d": {"type": "string"},
                  "answer": {"type": "string"}, "explanation": {"type": "string"},
                  "page": {"type": "string"}, "source": {"type": "string"}
              }, "required": ["category","question","option_a","option_b","option_c","option_d","answer","explanation","page","source"]}}},
              "required": ["items"]
          }

          # Stable production models. If one model is temporarily overloaded (503),
          # automatically move to the next model instead of failing the whole bot.
          # Discover models available to THIS API key; never retry unavailable 404 models.
          catalog = requests.get(
              "https://generativelanguage.googleapis.com/v1beta/models",
              headers={"x-goog-api-key": API_KEY}, timeout=45
          )
          catalog.raise_for_status()
          available = [
              m["name"].split("/", 1)[-1]
              for m in catalog.json().get("models", [])
              if "generateContent" in m.get("supportedGenerationMethods", [])
              and "gemini" in m.get("name", "").lower()
              and "embedding" not in m.get("name", "").lower()
          ]
          preferred = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite",
                       "gemini-3-flash-preview", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
          models = [m for m in preferred if m in available]
          models += [m for m in available if m not in models and "flash" in m.lower()]
          print("Available Gemini models:", available)
          print("Fallback models:", models)
          if not models:
              raise SystemExit("No compatible Gemini generateContent models available for this API key.")
          final_items = None
          last_error = None

          def valid_items(result):
              items = result.get("items", []) if isinstance(result, dict) else []
              if not isinstance(items, list):
                  return []
              valid = []
              seen = set()
              fields = ["category","question","option_a","option_b","option_c","option_d","answer","explanation","page","source"]
              for item in items:
                  if not isinstance(item, dict) or not all(str(item.get(f, "")).strip() for f in fields):
                      continue
                  if str(item.get("source", "")).strip().lower() != "sujas":
                      continue
                  if str(item.get("answer", "")).strip().upper() not in {"A","B","C","D"}:
                      continue
                  q = str(item["question"]).strip()
                  if q in seen:
                      continue
                  seen.add(q)
                  valid.append(item)
              return valid

          for model in models:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              payload = {
                  "contents": [{"parts": [{"text": prompt}, {"inline_data": {"mime_type": "application/pdf", "data": pdf_base64}}]}],
                  "generationConfig": {"responseMimeType": "application/json", "responseSchema": schema, "temperature": 0.1}
              }

              print(f"\n===== Gemini model: {model} =====")
              model_success = False
              for attempt in range(1, 4):
                  print(f"Gemini {model} attempt {attempt}/3")
                  try:
                      r = requests.post(url, headers={"x-goog-api-key": API_KEY, "Content-Type": "application/json"}, json=payload, timeout=300)
                      print("Gemini HTTP:", r.status_code)
                      if r.status_code == 404:\n                          print(f"Model {model} unavailable (404); trying next model.")\n                          last_error = r.text[:500]\n                          break\n                      if r.status_code in [429, 500, 502, 503, 504]:
                          last_error = r.text[:1000]
                          if attempt < 3:
                              delay = min(8 * (2 ** (attempt - 1)) + random.uniform(0, 3), 45)
                              print(f"Temporary Gemini error. Waiting {delay:.1f}s before retry...")
                              time.sleep(delay)
                              continue
                          print(f"Model {model} exhausted; switching to next model.")
                          break
                      r.raise_for_status()
                      data = r.json()
                      parts = data.get("candidates", [{}])[0].get("content", {}).get("parts", [])
                      text = "".join(p.get("text", "") for p in parts if isinstance(p, dict)).strip()
                      result = json.loads(text)
                      valid = valid_items(result)
                      print("Valid MCQs:", len(valid))
                      if len(valid) >= 10:
                          final_items = valid
                          model_success = True
                          break
                      last_error = f"Only {len(valid)} valid MCQs returned by {model}"
                      if attempt < 3:
                          time.sleep(5 * attempt)
                  except (requests.RequestException, ValueError, json.JSONDecodeError, KeyError, IndexError) as exc:
                      last_error = str(exc)
                      print("Gemini/validation error:", last_error)
                      if attempt < 3:
                          time.sleep(5 * attempt)
                  if model_success:
                      break
              if final_items is not None:
                  break

          if final_items is None:
              raise SystemExit(f"Valid MCQs नहीं बने. Last error: {last_error}")

          Path("current_affairs.json").write_text(json.dumps({"items": final_items}, ensure_ascii=False, indent=2), encoding="utf-8")

          telegram_url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
          sent = 0
          for index, item in enumerate(final_items, 1):
              message = (
                  "📰 <b>राजस्थान करेंट अफेयर्स</b>\n"
                  "━━━━━━━━━━━━━━━━━━\n\n"
                  f"🏷️ <b>Category:</b> {item['category']}\n\n"
                  f"<b>प्रश्न {index}.</b> {item['question']}\n\n"
                  f"(A) {item['option_a']}\n(B) {item['option_b']}\n(C) {item['option_c']}\n(D) {item['option_d']}\n\n"
                  f"✅ <b>उत्तर:</b> {item['answer']}\n\n"
                  f"💡 <b>व्याख्या:</b> {item['explanation']}\n\n"
                  f"📄 <b>Page:</b> {item['page']}\n\n"
                  "━━━━━━━━━━━━━━━━━━\n📚 Source: <b>Sujas</b>\n📢 <b>@yourbuddyravindrachoudhary</b>"
              )
              if len(message) > 4000:
                  message = message[:3950] + "\n\n…"
              response = requests.post(telegram_url, json={"chat_id": CHANNEL, "text": message, "parse_mode": "HTML", "disable_web_page_preview": True}, timeout=30)
              response.raise_for_status()
              if not response.json().get("ok"):
                  raise SystemExit(f"Telegram error: {response.text[:1000]}")
              sent += 1
              print(f"Telegram message {index} sent")
              time.sleep(0.5)

          Path("current_affairs_sujas_state.txt").write_text(CURRENT_KEY, encoding="utf-8")
          print("COMPLETE — MCQs:", len(final_items), "TELEGRAM SENT:", sent)
          PY

      - name: Save current affairs data
        if: steps.find_pdf.outputs.new_sujas == 'true'
        run: |
          git add current_affairs.json current_affairs_sujas_state.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate Sujas current affairs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
