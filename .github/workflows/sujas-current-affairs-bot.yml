name: Sujas Current Affairs Bot

on:
  workflow_run:
    workflows:
      - "Rajasthan Sujas Auto Upload"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sujas-current-affairs-bot
  cancel-in-progress: false

jobs:

  process:

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. FIND LATEST SUJAS PDF
      # ==========================================

      - name: Find latest Sujas PDF
        id: find_pdf

        run: |

          python - <<'PY'

          import os
          import requests
          from pathlib import Path


          API_URL = (
              "https://dipr.rajasthan.gov.in/"
              "webapi/api/OrderPortal/GetAll"
          )


          payload = {

              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,

              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },

              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }


          print("========================================")
          print("DIPR API REQUEST")
          print("========================================")


          response = requests.post(
              API_URL,
              json=payload,
              timeout=60
          )


          print("HTTP STATUS:", response.status_code)


          response.raise_for_status()


          data = response.json()


          # ==========================================
          # ROBUST API RESPONSE PARSING
          # ==========================================

          items = None


          if isinstance(data, list):

              items = data


          elif isinstance(data, dict):

              # Direct list keys

              for key in [
                  "Data",
                  "data",
                  "Result",
                  "result",
                  "Items",
                  "items",
                  "Records",
                  "records"
              ]:

                  value = data.get(key)

                  if isinstance(value, list):

                      items = value
                      break


              # Nested dictionary

              if items is None:

                  for key in [
                      "Data",
                      "data",
                      "Result",
                      "result"
                  ]:

                      value = data.get(key)

                      if isinstance(value, dict):

                          for nested_key in [
                              "Data",
                              "data",
                              "Result",
                              "result",
                              "Items",
                              "items",
                              "Records",
                              "records"
                          ]:

                              nested_value = value.get(
                                  nested_key
                              )

                              if isinstance(
                                  nested_value,
                                  list
                              ):

                                  items = nested_value
                                  break


                          if items is not None:
                              break


          if not isinstance(items, list):

              print("")
              print("❌ UNKNOWN DIPR RESPONSE")
              print("========================================")
              print(str(data)[:5000])
              print("========================================")

              raise SystemExit(
                  "❌ DIPR API response समझ नहीं आया"
              )


          if not items:

              raise SystemExit(
                  "❌ Sujas data नहीं मिला"
              )


          print(
              "DIPR records found:",
              len(items)
          )


          # ==========================================
          # FIND PDF URL RECURSIVELY
          # ==========================================

          def find_pdf(obj):

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      if isinstance(value, str):

                          v = value.strip().lower()

                          if (
                              ".pdf" in v
                              and (
                                  v.startswith(
                                      "http://"
                                  )
                                  or
                                  v.startswith(
                                      "https://"
                                  )
                              )
                          ):

                              return value


                      found = find_pdf(value)

                      if found:

                          return found


              elif isinstance(obj, list):

                  for item in obj:

                      found = find_pdf(item)

                      if found:

                          return found


              return None


          selected = None
          pdf_url = None


          for record in items:

              found = find_pdf(record)

              if found:

                  selected = record
                  pdf_url = found

                  break


          if not pdf_url:

              print("")
              print("❌ कोई PDF URL नहीं मिला")
              print("========================================")
              print(
                  "FIRST RECORD PREVIEW:"
              )
              print(
                  str(items[0])[:5000]
              )
              print("========================================")

              raise SystemExit(
                  "❌ Sujas PDF URL नहीं मिला"
              )


          # ==========================================
          # FIND ORDER ID
          # ==========================================

          order_id = ""


          if isinstance(selected, dict):

              for key in [
                  "Id",
                  "ID",
                  "id",
                  "OrderId",
                  "OrderID",
                  "orderId"
              ]:

                  if key in selected:

                      value = selected[key]

                      if value is not None:

                          order_id = str(value)

                      break


          # ==========================================
          # FIND TITLE
          # ==========================================

          title = "Latest Sujas"


          if isinstance(selected, dict):

              title = (
                  selected.get("Title")
                  or selected.get("title")
                  or title
              )


          print("")
          print("========================================")
          print("SUJAS PDF FOUND")
          print("========================================")
          print("TITLE:", title)
          print("ORDER ID:", order_id)
          print("PDF:", pdf_url)
          print("========================================")


          # ==========================================
          # DOWNLOAD PDF
          # ==========================================

          print("")
          print("Downloading PDF...")


          pdf_response = requests.get(
              pdf_url,
              timeout=180
          )


          pdf_response.raise_for_status()


          pdf_path = Path(
              "sujas_current.pdf"
          )


          pdf_path.write_bytes(
              pdf_response.content
          )


          pdf_size = pdf_path.stat().st_size


          print(
              "PDF size:",
              pdf_size,
              "bytes"
          )


          if pdf_size == 0:

              raise SystemExit(
                  "❌ Downloaded PDF खाली है"
              )


          print(
              "✅ PDF successfully downloaded"
          )


          # ==========================================
          # GITHUB OUTPUTS
          # ==========================================

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  f"pdf_path={pdf_path}\n"
              )

              output.write(
                  f"pdf_url={pdf_url}\n"
              )

              output.write(
                  f"order_id={order_id}\n"
              )

              output.write(
                  f"title={title}\n"
              )


          PY


      # ==========================================
      # 3. DUPLICATE CHECK
      # ==========================================

      - name: Check processed Sujas
        id: duplicate

        run: |

          CURRENT_ID="${{ steps.find_pdf.outputs.order_id }}"

          STATE_FILE="current_affairs_sujas_state.txt"


          if [ -f "$STATE_FILE" ]; then

            OLD_ID=$(cat "$STATE_FILE")

          else

            OLD_ID=""

          fi


          echo "========================================"
          echo "SUJAS DUPLICATE CHECK"
          echo "========================================"

          echo "OLD SUJAS ID: ${OLD_ID:-NONE}"

          echo "CURRENT SUJAS ID: ${CURRENT_ID:-NONE}"


          if [ -n "$CURRENT_ID" ] &&
             [ "$OLD_ID" = "$CURRENT_ID" ]; then

            echo ""
            echo "⏭️ SAME SUJAS — ALREADY PROCESSED"

            echo "new_sujas=false" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "🆕 NEW SUJAS"

            echo "new_sujas=true" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================
      # 4. GEMINI + TELEGRAM
      # ==========================================

      - name: Generate and send current affairs

        if: steps.duplicate.outputs.new_sujas == 'true'

        env:

          GEMINI_API_KEY:
            ${{ secrets.GEMINI_API_KEY }}

          CURRENT_AFFAIRS_BOT_TOKEN:
            ${{ secrets.CURRENT_AFFAIRS_BOT_TOKEN }}

          TELEGRAM_CHANNEL:
            "@yourbuddyravindrachoudhary"

          PDF_PATH:
            ${{ steps.find_pdf.outputs.pdf_path }}

          PDF_URL:
            ${{ steps.find_pdf.outputs.pdf_url }}

          ORDER_ID:
            ${{ steps.find_pdf.outputs.order_id }}

        run: |

          python - <<'PY'

          import base64
          import json
          import os
          import time
          import requests
          from pathlib import Path


          API_KEY = os.environ[
              "GEMINI_API_KEY"
          ]


          BOT_TOKEN = os.environ[
              "CURRENT_AFFAIRS_BOT_TOKEN"
          ]


          CHANNEL = os.environ[
              "TELEGRAM_CHANNEL"
          ]


          PDF_PATH = Path(
              os.environ["PDF_PATH"]
          )


          PDF_URL = os.environ[
              "PDF_URL"
          ]


          ORDER_ID = os.environ.get(
              "ORDER_ID",
              ""
          )


          # ==========================================
          # CHECK CONFIGURATION
          # ==========================================

          if not API_KEY:

              raise SystemExit(
                  "❌ GEMINI_API_KEY secret नहीं मिला"
              )


          if not BOT_TOKEN:

              raise SystemExit(
                  "❌ CURRENT_AFFAIRS_BOT_TOKEN secret नहीं मिला"
              )


          # ==========================================
          # CHECK PDF
          # ==========================================

          if not PDF_PATH.exists():

              raise SystemExit(
                  "❌ PDF नहीं मिला"
              )


          pdf_bytes = PDF_PATH.read_bytes()


          if not pdf_bytes:

              raise SystemExit(
                  "❌ PDF खाली है"
              )


          print("========================================")
          print("GEMINI PROCESSING")
          print("========================================")
          print(
              "PDF size:",
              len(pdf_bytes),
              "bytes"
          )


          # ==========================================
          # PROMPT
          # ==========================================

          prompt = r"""

तुम Rajasthan competitive examinations के लिए
Current Affairs expert हो।

यह PDF Rajasthan Government के Sujas e-Bulletin
का source document है।

केवल इसी PDF में मौजूद information का उपयोग करो।

IMPORTANT:

- कोई fact अपनी तरफ से मत बनाना।
- PDF के बाहर की current affairs मत जोड़ना।
- यदि कोई information स्पष्ट नहीं है तो उसे छोड़ना।
- केवल exam-relevant information लेना।
- Rajasthan-related facts को प्राथमिकता देना।
- नियुक्तियाँ, योजनाएँ, नीतियाँ, कार्यक्रम,
  पुरस्कार, खेल, व्यक्ति, स्थान, अर्थव्यवस्था,
  कृषि, शिक्षा, स्वास्थ्य, पर्यावरण, उद्योग,
  निवेश, infrastructure, reports, science &
  technology, AI और digital developments जैसी
  जानकारी शामिल की जा सकती है।
- Generic national news को छोड़ना जब तक उसका
  Rajasthan से सीधा संबंध न हो।
- Duplicate facts नहीं बनाने।
- प्रश्न RPSC/RSSB परीक्षा के स्तर के हों।
- भाषा साफ एवं शुद्ध हिंदी हो।
- प्रत्येक प्रश्न के 4 विकल्प हों।
- केवल एक सही उत्तर हो।
- उत्तर PDF की information से ही होना चाहिए।
- यदि page number उपलब्ध हो तो page field में दो।
- source हमेशा "Sujas" रखो।
- प्रश्नों में केवल वही तथ्य इस्तेमाल करो जो
  PDF में स्पष्ट रूप से मौजूद हैं।
- एक ही fact पर कई लगभग समान प्रश्न मत बनाओ।
- प्रश्नों की quality quantity से अधिक महत्वपूर्ण है।

केवल valid JSON output दो।

"""


          # ==========================================
          # JSON SCHEMA
          # ==========================================

          schema = {

              "type": "object",

              "properties": {

                  "items": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "category": {
                                  "type": "string"
                              },

                              "question": {
                                  "type": "string"
                              },

                              "option_a": {
                                  "type": "string"
                              },

                              "option_b": {
                                  "type": "string"
                              },

                              "option_c": {
                                  "type": "string"
                              },

                              "option_d": {
                                  "type": "string"
                              },

                              "answer": {
                                  "type": "string"
                              },

                              "explanation": {
                                  "type": "string"
                              },

                              "page": {
                                  "type": "string"
                              },

                              "source": {
                                  "type": "string"
                              }

                          },

                          "required": [

                              "category",
                              "question",
                              "option_a",
                              "option_b",
                              "option_c",
                              "option_d",
                              "answer",
                              "explanation",
                              "page",
                              "source"

                          ]

                      }

                  }

              },

              "required": [
                  "items"
              ]

          }


          # ==========================================
          # GEMINI API
          # ==========================================

          MODEL = "gemini-3.7-flash"


          API_URL = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{MODEL}:generateContent"
          )


          pdf_base64 = base64.b64encode(
              pdf_bytes
          ).decode("utf-8")


          payload = {

              "contents": [

                  {

                      "parts": [

                          {
                              "text": prompt
                          },

                          {

                              "inline_data": {

                                  "mime_type":
                                      "application/pdf",

                                  "data":
                                      pdf_base64

                              }

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "responseMimeType":
                      "application/json",

                  "responseSchema":
                      schema,

                  "temperature":
                      0.1

              }

          }


          # ==========================================
          # GEMINI RETRY
          # ==========================================

          MAX_ATTEMPTS = 5

          gemini_data = None


          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print(
                  f"Gemini attempt "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )


              try:

                  response = requests.post(

                      API_URL,

                      headers={

                          "x-goog-api-key":
                              API_KEY,

                          "Content-Type":
                              "application/json"

                      },

                      json=payload,

                      timeout=300

                  )


                  if response.status_code == 200:

                      gemini_data = (
                          response.json()
                      )

                      print(
                          "✅ Gemini response received"
                      )

                      break


                  print(
                      "⚠️ Gemini HTTP:",
                      response.status_code
                  )


                  print(
                      response.text[:1500]
                  )


                  if response.status_code in [

                      429,
                      500,
                      502,
                      503,
                      504

                  ]:

                      wait_time = (
                          10 * attempt
                      )

                      print(
                          f"⏳ Waiting "
                          f"{wait_time}s..."
                      )

                      time.sleep(
                          wait_time
                      )

                      continue


                  response.raise_for_status()


              except requests.RequestException as exc:

                  print(
                      "⚠️ Gemini request error:",
                      str(exc)
                  )


                  if attempt == MAX_ATTEMPTS:

                      raise


                  time.sleep(
                      10 * attempt
                  )


          if gemini_data is None:

              raise SystemExit(
                  "❌ Gemini failed after retries"
              )


          # ==========================================
          # EXTRACT GEMINI RESPONSE
          # ==========================================

          candidates = gemini_data.get(
              "candidates",
              []
          )


          if not candidates:

              print(
                  json.dumps(
                      gemini_data,
                      ensure_ascii=False,
                      indent=2
                  )[:5000]
              )

              raise SystemExit(
                  "❌ Gemini candidate नहीं मिला"
              )


          parts = (

              candidates[0]
              .get("content", {})
              .get("parts", [])

          )


          text = ""


          for part in parts:

              if "text" in part:

                  text += part["text"]


          if not text:

              raise SystemExit(
                  "❌ Gemini response खाली है"
              )


          # ==========================================
          # JSON PARSE
          # ==========================================

          try:

              result = json.loads(
                  text
              )

          except json.JSONDecodeError:

              print(
                  "Gemini raw response:"
              )

              print(
                  text[:5000]
              )

              raise


          items = result.get(
              "items",
              []
          )


          print(
              "Generated MCQs:",
              len(items)
          )


          if not items:

              raise SystemExit(
                  "❌ कोई MCQ generate नहीं हुआ"
              )


          # ==========================================
          # SAVE JSON
          # ==========================================

          Path(
              "current_affairs.json"
          ).write_text(

              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"

          )


          print(
              "✅ current_affairs.json saved"
          )


          # ==========================================
          # TELEGRAM
          # ==========================================

          telegram_url = (

              "https://api.telegram.org/"
              f"bot{BOT_TOKEN}/sendMessage"

          )


          sent = 0


          for index, item in enumerate(
              items,
              start=1
          ):


              category = item.get(
                  "category",
                  ""
              )


              message = (

                  "📰 <b>राजस्थान करेंट अफेयर्स</b>\n"

                  "━━━━━━━━━━━━━━━━━━\n\n"

              )


              if category:

                  message += (

                      f"🏷️ <b>Category:</b> "
                      f"{category}\n\n"

                  )


              message += (

                  f"<b>प्रश्न {index}.</b> "
                  f"{item.get('question', '')}\n\n"

                  f"(A) {item.get('option_a', '')}\n"

                  f"(B) {item.get('option_b', '')}\n"

                  f"(C) {item.get('option_c', '')}\n"

                  f"(D) {item.get('option_d', '')}\n\n"

                  f"✅ <b>उत्तर:</b> "
                  f"{item.get('answer', '')}\n\n"

                  f"💡 <b>व्याख्या:</b> "
                  f"{item.get('explanation', '')}"

              )


              page = item.get(
                  "page",
                  ""
              )


              if page:

                  message += (

                      f"\n\n📄 <b>Page:</b> "
                      f"{page}"

                  )


              message += (

                  "\n\n━━━━━━━━━━━━━━━━━━\n"

                  "📚 Source: <b>Sujas</b>\n"

                  "🤖 YourBuddy Current Affairs"

              )


              # ==========================================
              # TELEGRAM MESSAGE LENGTH
              # ==========================================

              if len(message) > 4000:

                  message = (

                      message[:3950]

                      + "\n\n…"

                  )


              telegram_response = requests.post(

                  telegram_url,

                  json={

                      "chat_id":
                          CHANNEL,

                      "text":
                          message,

                      "parse_mode":
                          "HTML",

                      "disable_web_page_preview":
                          True

                  },

                  timeout=30

              )


              telegram_response.raise_for_status()


              telegram_result = (

                  telegram_response.json()

              )


              if not telegram_result.get(
                  "ok"
              ):

                  raise SystemExit(

                      "❌ Telegram error: "

                      + str(
                          telegram_result
                      )

                  )


              sent += 1


              print(
                  f"✅ Telegram message "
                  f"{index} sent"
              )


              time.sleep(0.5)


          # ==========================================
          # SAVE STATE
          # ==========================================

          Path(
              "current_affairs_sujas_state.txt"
          ).write_text(

              ORDER_ID,

              encoding="utf-8"

          )


          print("")
          print("========================================")
          print("✅ SUJAS CURRENT AFFAIRS COMPLETE")
          print("========================================")
          print(
              "✅ MCQs:",
              len(items)
          )
          print(
              "✅ TELEGRAM SENT:",
              sent
          )
          print("========================================")


          PY


      # ==========================================
      # 5. SAVE RESULTS
      # ==========================================

      - name: Save current affairs data

        if: steps.duplicate.outputs.new_sujas == 'true'

        run: |

          git add \
            current_affairs.json \
            current_affairs_sujas_state.txt


          if git diff --cached --quiet; then

            echo "⏭️ Nothing to commit."

          else

            git config user.name \
              "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"


            git commit \
              -m "Generate Sujas current affairs"


            git push


            echo "✅ Current affairs saved."

          fi
