name: Meridian YouTube Test

on:
  workflow_dispatch:

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get latest Meridian Academy videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["YOUTUBE_API_KEY"]

          # Meridian Academy channel handle
          url = "https://www.googleapis.com/youtube/v3/channels"
          params = {
              "part": "contentDetails,snippet",
              "forHandle": "meridian.academy",
              "key": key
          }

          r = requests.get(url, params=params, timeout=20)
          r.raise_for_status()
          data = r.json()

          if not data.get("items"):
              raise SystemExit("Meridian Academy channel नहीं मिला")

          channel = data["items"][0]
          channel_id = channel["id"]
          uploads_playlist = channel["contentDetails"]["relatedPlaylists"]["uploads"]

          print("CHANNEL:", channel["snippet"]["title"])
          print("CHANNEL ID:", channel_id)
          print("UPLOADS PLAYLIST:", uploads_playlist)
          print("\nLATEST VIDEOS:\n")

          url = "https://www.googleapis.com/youtube/v3/playlistItems"
          params = {
              "part": "snippet,contentDetails",
              "playlistId": uploads_playlist,
              "maxResults": 10,
              "key": key
          }

          r = requests.get(url, params=params, timeout=20)
          r.raise_for_status()
          data = r.json()

          for i, item in enumerate(data.get("items", []), 1):
              snippet = item["snippet"]
              video_id = item["contentDetails"]["videoId"]

              print(f"{i}. {snippet['title']}")
              print(f"   Published: {snippet['publishedAt']}")
              print(f"   URL: https://www.youtube.com/watch?v={video_id}")
              print()

          PY
