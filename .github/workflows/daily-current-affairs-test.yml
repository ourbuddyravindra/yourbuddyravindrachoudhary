name: DIPR PDF AI Test

on:
  workflow_dispatch:

jobs:
  dipr-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. INSTALL TOOLS
      # =========================================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

          pip install requests

          echo "===== TESSERACT ====="
          tesseract --version

          echo "===== LANGUAGES ====="
          tesseract --list-langs


      # =========================================================
      # 2. DOWNLOAD LATEST SUJAS
      # =========================================================
      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(API, json=payload, timeout=30)
          r.raise_for_status()

          data = r.json()

          def find_records(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in [
                      "Data", "data",
                      "Result", "result",
                      "Items", "items"
                  ]:
                      if key in obj and isinstance(obj[key], list):
                          return obj[key]

                  for value in obj.values():
                      found = find_records(value)
                      if found:
                          return found

              return []

          records = find_records(data)

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:
              title = str(item.get("Title", ""))

              if "सुजस" in title and "बुलेटिन" in title:
                  selected = item
                  break

          if not selected:
              raise SystemExit("Sujas bulletin नहीं मिला")

          print("SELECTED:", selected.get("Title"))
          print("ORDER ID:", selected.get("Id"))
          print("DATE:", selected.get("HindiDate"))

          pdf_url = None

          for attachment in selected.get("AttachmentList", []):
              path = attachment.get("Path", "")

              if ".pdf" in path.lower():
                  pdf_url = path
                  break

          if not pdf_url:
              raise SystemExit("PDF URL नहीं मिला")

          pdf = requests.get(pdf_url, timeout=90)
          pdf.raise_for_status()

          Path("sujas_today.pdf").write_bytes(pdf.content)

          print("PDF SIZE:", len(pdf.content))
          print("DOWNLOAD SUCCESS")
          PY


      # =========================================================
      # 3. PDF -> IMAGES
      # =========================================================
      - name: Convert PDF to images
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "===== PAGES ====="
          ls -lh pages/

          echo "TOTAL PAGES:"
          find pages -type f | wc -l


      # =========================================================
      # 4. HINDI + ENGLISH OCR
      # =========================================================
      - name: Hindi OCR
        run: |
          rm -f sujas_ocr.txt

          for image in pages/page-*.jpg
          do
            PAGE=$(basename "$image" .jpg | sed 's/page-//')

            echo ""
            echo "======================================"
            echo "OCR PAGE: $PAGE"
            echo "======================================"

            echo "===== PAGE $PAGE =====" >> sujas_ocr.txt

            tesseract "$image" stdout \
              -l hin+eng \
              --psm 3 \
              2>/dev/null >> sujas_ocr.txt

            echo "" >> sujas_ocr.txt
            echo "" >> sujas_ocr.txt
          done

          echo ""
          echo "======================================"
          echo "OCR COMPLETE"
          echo "======================================"

          echo "OCR CHARACTERS:"
          wc -m sujas_ocr.txt

          echo ""
          echo "========== OCR PREVIEW =========="
          head -c 15000 sujas_ocr.txt
          echo ""
          echo "================================="


      # =========================================================
      # 5. SOURCE-STRICT GEMINI
      # =========================================================
      - name: Source Strict Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import requests
          from pathlib import Path

          API_KEY = os.environ["GEMINI_API_KEY"]

          text = Path("sujas_ocr.txt").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("OCR TEXT LENGTH:", len(text))

          if len(text.strip()) < 1000:
              raise SystemExit(
                  "OCR text बहुत कम है."
              )

          # पूरा OCR भेज रहे हैं
          source = text[:30000]

          # =====================================================
          # STRICT SCHEMA
          # =====================================================

          schema = {
              "type": "object",
              "properties": {
                  "items": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "title": {
                                  "type": "string"
                              },
                              "fact": {
                                  "type": "string"
                              },
                              "question": {
                                  "type": "string"
                              },
                              "option_a": {
                                  "type": "string"
                              },
                              "option_b": {
                                  "type": "string"
                              },
                              "option_c": {
                                  "type": "string"
                              },
                              "option_d": {
                                  "type": "string"
                              },
                              "answer": {
                                  "type": "string",
                                  "enum": [
                                      "A",
                                      "B",
                                      "C",
                                      "D"
                                  ]
                              },
                              "page": {
                                  "type": "integer"
                              }
                          },
                          "required": [
                              "title",
                              "fact",
                              "question",
                              "option_a",
                              "option_b",
                              "option_c",
                              "option_d",
                              "answer",
                              "page"
                          ]
                      }
                  }
              },
              "required": [
                  "items"
              ]
          }


          # =====================================================
          # PROMPT
          # =====================================================

          prompt = f"""
          तुम RPSC और RSSB के लिए राजस्थान Current Affairs
          question editor हो।

          तुम्हें केवल नीचे दिए गए SUJAS OCR SOURCE से
          प्रश्न बनाने हैं।

          ================================
          सबसे महत्वपूर्ण नियम
          ================================

          1. SOURCE के बाहर की कोई जानकारी मत जोड़ो।

          2. अपनी सामान्य knowledge का इस्तेमाल मत करो।

          3. किसी व्यक्ति का पद, नाम, संख्या, तारीख,
             योजना, स्थान या तथ्य SOURCE में स्पष्ट नहीं है
             तो उसे मत लिखो।

          4. यदि OCR में कोई शब्द अस्पष्ट है तो उस fact को
             छोड़ दो।

          5. अनुमान लगाकर खाली जानकारी मत भरो।

          6. एक ही fact को अलग-अलग तरीके से बार-बार
             question मत बनाओ।

          7. केवल exam-worthy information चुनो।

          8. राजस्थान की महत्वपूर्ण घटनाओं को प्राथमिकता दो।

          9. निम्न categories पर ध्यान दो:
             - नियुक्तियां
             - योजनाएं
             - सरकारी कार्यक्रम
             - नीतियां
             - बजट/अर्थव्यवस्था
             - कृषि
             - शिक्षा
             - स्वास्थ्य
             - खेल
             - पुरस्कार
             - महत्वपूर्ण व्यक्ति
             - स्थान
             - infrastructure
             - investment
             - environment
             - elections
             - science & technology
             - AI/digital
             - अन्य महत्वपूर्ण exam facts

          10. हर item के साथ सही PAGE NUMBER देना जरूरी है।

          11. PAGE NUMBER केवल SOURCE में दिए गए
              "===== PAGE X =====" marker से निर्धारित करो।

          12. अगर किसी fact का page स्पष्ट रूप से निर्धारित
              नहीं हो सकता तो उस fact को छोड़ दो।

          13. गलत distractor भी मत बनाओ।
              Options ऐसे होने चाहिए कि सही answer
              SOURCE में स्पष्ट रूप से मौजूद हो।

          14. कम लेकिन बिल्कुल सही questions देना
              ज्यादा questions देने से बेहतर है।

          15. लगभग 10-15 सबसे महत्वपूर्ण questions दो।

          ================================
          OUTPUT
          ================================

          केवल JSON format में output दो।
          कोई explanation, markdown या अतिरिक्त text नहीं।

          ================================
          SUJAS SOURCE
          ================================

          {source}
          """


          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          success = False

          for model in models:

              print("")
              print("================================")
              print("MODEL:", model)
              print("================================")

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{model}:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0,
                      "responseMimeType": "application/json",
                      "responseSchema": schema
                  }
              }

              for attempt in range(3):

                  print(
                      f"ATTEMPT {attempt + 1}/3"
                  )

                  try:

                      response = requests.post(
                          url,
                          params={
                              "key": API_KEY
                          },
                          json=payload,
                          timeout=120
                      )

                      print(
                          "HTTP STATUS:",
                          response.status_code
                      )

                      if response.status_code == 200:

                          data = response.json()

                          output = (
                              data["candidates"][0]
                              ["content"]["parts"][0]["text"]
                          )

                          # JSON validate
                          result = json.loads(output)

                          items = result.get(
                              "items",
                              []
                          )

                          print("")
                          print(
                              "TOTAL QUESTIONS:",
                              len(items)
                          )

                          print("")
                          print(
                              "========== SOURCE-STRICT RESULT =========="
                          )

                          for i, item in enumerate(
                              items,
                              start=1
                          ):

                              print("")
                              print(
                                  f"Q{i}. "
                                  f"{item['question']}"
                              )

                              print(
                                  f"A) {item['option_a']}"
                              )

                              print(
                                  f"B) {item['option_b']}"
                              )

                              print(
                                  f"C) {item['option_c']}"
                              )

                              print(
                                  f"D) {item['option_d']}"
                              )

                              print(
                                  f"ANSWER: "
                                  f"{item['answer']}"
                              )

                              print(
                                  f"PAGE: "
                                  f"{item['page']}"
                              )

                              print(
                                  f"FACT: "
                                  f"{item['fact']}"
                              )

                          print("")
                          print(
                              "=========================================="
                          )

                          Path(
                              "current_affairs.json"
                          ).write_text(
                              json.dumps(
                                  result,
                                  ensure_ascii=False,
                                  indent=2
                              ),
                              encoding="utf-8"
                          )

                          success = True
                          break

                      print(
                          response.text[:2000]
                      )

                      if response.status_code in [
                          429,
                          500,
                          502,
                          503,
                          504
                      ]:

                          wait = 10 * (
                              attempt + 1
                          )

                          print(
                              f"Waiting {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      break

                  except Exception as e:

                      print(
                          "ERROR:",
                          repr(e)
                      )

                      if attempt < 2:
                          time.sleep(10)

              if success:
                  print("")
                  print(
                      "SUCCESS MODEL:",
                      model
                  )
                  break

          if not success:
              raise SystemExit(
                  "Gemini failed."
              )

          PY
