name: Meridian Rajasthan Video Detector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-rajasthan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect and save latest Rajasthan video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          KEY = os.environ["YOUTUBE_API_KEY"]
          STATE_FILE = Path("meridian_latest_video.txt")

          # 1. Get Meridian Academy channel
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          channel = r.json()["items"][0]
          uploads = channel["contentDetails"]["relatedPlaylists"]["uploads"]

          # 2. Get latest uploads
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "snippet,contentDetails",
                  "playlistId": uploads,
                  "maxResults": 10,
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          items = r.json().get("items", [])

          # 3. Find latest Rajasthan Current Affairs / SUJAS video
          selected = None

          for item in items:
              title = item["snippet"]["title"]
              t = title.lower()

              if (
                  "rajasthan current affairs" in t
                  or ("rajasthan" in t and "sujas" in t)
              ):
                  selected = item
                  break

          if selected is None:
              raise SystemExit(
                  "❌ Rajasthan Current Affairs video नहीं मिला"
              )

          video_id = selected["contentDetails"]["videoId"]
          title = selected["snippet"]["title"]
          published = selected["contentDetails"].get(
              "videoPublishedAt",
              selected["snippet"]["publishedAt"]
          )

          # 4. Read previously processed video
          old_id = ""

          if STATE_FILE.exists():
              old_id = STATE_FILE.read_text(
                  encoding="utf-8"
              ).strip()

          print("OLD VIDEO ID:", old_id or "NONE")
          print("NEW VIDEO ID:", video_id)
          print("TITLE:", title)
          print("PUBLISHED:", published)

          # 5. Duplicate check
          if old_id == video_id:
              print()
              print("⏭️ SAME VIDEO — ALREADY PROCESSED")
              print("No new processing required.")
          else:
              print()
              print("🆕 NEW RAJASTHAN VIDEO FOUND")
              print("Saving video ID...")

              STATE_FILE.write_text(
                  video_id,
                  encoding="utf-8"
              )

              print("✅ Video ID saved")

          print()
          print("URL:")
          print(f"https://www.youtube.com/watch?v={video_id}")
          PY

      - name: Commit updated video state
        run: |
          if git diff --quiet -- meridian_latest_video.txt; then
            echo "No state change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add meridian_latest_video.txt
            git commit -m "Update Meridian latest video"
            git push

            echo "✅ State file committed."
          fi
