name: Official Sources Test

on:
  workflow_dispatch:

jobs:
  source-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Extract Official News
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date()

          print("=" * 70)
          print("OFFICIAL CURRENT AFFAIRS SOURCE EXTRACTION")
          print("Today:", today)
          print("=" * 70)

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          # =========================================================
          # 1. RAJASTHAN DST
          # =========================================================

          print("\n🏜️ RAJASTHAN SCIENCE & TECHNOLOGY — DST")
          print("-" * 70)

          dst_url = "https://dst.rajasthan.gov.in/news.aspx"

          r = requests.get(
              dst_url,
              headers=headers,
              timeout=30
          )

          print("DST Status:", r.status_code)

          soup = BeautifulSoup(r.text, "html.parser")

          count = 0

          for row in soup.find_all("tr"):

              cells = row.find_all(["td", "th"])

              if len(cells) < 3:
                  continue

              values = [
                  c.get_text(" ", strip=True)
                  for c in cells
              ]

              text = " | ".join(values)

              # Look for dates like 03/09/2026
              match = re.search(
                  r"\b(\d{2}/\d{2}/\d{4})\b",
                  text
              )

              if not match:
                  continue

              date_text = match.group(1)

              try:
                  item_date = datetime.strptime(
                      date_text,
                      "%d/%m/%Y"
                  ).date()
              except:
                  continue

              # Only recent items
              days_old = (today - item_date).days

              if days_old < 0 or days_old > 7:
                  continue

              title = values[1] if len(values) >= 2 else values[0]

              # Ignore navigation/empty rows
              if len(title) < 10:
                  continue

              print("\n📌 Title:", title)
              print("📅 Date:", date_text)
              print("🔗 Source:", dst_url)

              count += 1

              if count >= 10:
                  break

          print("\nDST useful entries:", count)

          # =========================================================
          # 2. PIB — SCIENCE & TECHNOLOGY
          # =========================================================

          print("\n💻 PIB — SCIENCE & TECHNOLOGY")
          print("-" * 70)

          pib_url = (
              "https://www.pib.gov.in/"
              "AllRelease.aspx?MenuId=22&PMO=1&lang=1&reg=1"
          )

          r = requests.get(
              pib_url,
              headers=headers,
              timeout=30
          )

          print("PIB Status:", r.status_code)

          soup = BeautifulSoup(r.text, "html.parser")

          keywords = [
              "ISRO",
              "space",
              "technology",
              "science",
              "artificial intelligence",
              "AI",
              "cyber",
              "digital",
              "quantum",
              "semiconductor",
              "satellite"
          ]

          count = 0

          for row in soup.find_all("tr"):

              cells = row.find_all(["td", "th"])

              if len(cells) < 2:
                  continue

              values = [
                  c.get_text(" ", strip=True)
                  for c in cells
              ]

              text = " ".join(values)

              # Need a recent date
              match = re.search(
                  r"\b(\d{1,2})[/-](\d{1,2})[/-](\d{4})\b",
                  text
              )

              if not match:
                  continue

              try:
                  day = int(match.group(1))
                  month = int(match.group(2))
                  year = int(match.group(3))

                  item_date = datetime(
                      year,
                      month,
                      day
                  ).date()

              except:
                  continue

              days_old = (today - item_date).days

              if days_old < 0 or days_old > 3:
                  continue

              if not any(
                  k.lower() in text.lower()
                  for k in keywords
              ):
                  continue

              title = values[-1]

              if len(title) < 15:
                  continue

              print("\n📌 Title:", title)
              print("📅 Date:", item_date.strftime("%d-%m-%Y"))
              print("🔗 Source:", pib_url)

              count += 1

              if count >= 10:
                  break

          print("\nPIB useful entries:", count)

          print("\n" + "=" * 70)
          print("EXTRACTION TEST FINISHED")
          print("=" * 70)
          PY
