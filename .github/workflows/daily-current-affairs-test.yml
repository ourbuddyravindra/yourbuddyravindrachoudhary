name: DIPR PDF AI Test

on:
  workflow_dispatch:

jobs:
  dipr-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. INSTALL OCR TOOLS
      # =========================================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

          python -m pip install --upgrade pip
          pip install requests

          echo "Tesseract:"
          tesseract --version

          echo "Languages:"
          tesseract --list-langs

      # =========================================================
      # 2. DOWNLOAD LATEST SUJAS PDF
      # =========================================================
      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(API, json=payload, timeout=30)
          r.raise_for_status()

          data = r.json()

          def find_records(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in [
                      "Data", "data",
                      "Result", "result",
                      "Items", "items"
                  ]:
                      if key in obj and isinstance(obj[key], list):
                          return obj[key]

                  for value in obj.values():
                      found = find_records(value)
                      if found:
                          return found

              return []

          records = find_records(data)

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:
              title = str(item.get("Title", ""))

              if "सुजस" in title and "बुलेटिन" in title:
                  selected = item
                  break

          if not selected:
              raise SystemExit("Sujas bulletin नहीं मिला")

          print("SELECTED:", selected.get("Title"))
          print("ORDER ID:", selected.get("Id"))
          print("DATE:", selected.get("HindiDate"))

          pdf_url = None

          for attachment in selected.get("AttachmentList", []):
              path = attachment.get("Path", "")

              if ".pdf" in path.lower():
                  pdf_url = path
                  break

          if not pdf_url:
              raise SystemExit("PDF URL नहीं मिला")

          pdf = requests.get(pdf_url, timeout=90)
          pdf.raise_for_status()

          Path("sujas_today.pdf").write_bytes(pdf.content)

          print("PDF SIZE:", len(pdf.content))
          print("DOWNLOAD SUCCESS")

          PY

      # =========================================================
      # 3. PDF -> HIGH QUALITY IMAGES
      # =========================================================
      - name: Convert PDF to images
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "Generated pages:"
          ls -lh pages/

          echo "TOTAL IMAGES:"
          find pages -type f | wc -l

      # =========================================================
      # 4. HINDI OCR
      # =========================================================
      - name: Hindi OCR
        run: |
          rm -f sujas_ocr.txt

          for image in pages/page-*.jpg
          do
            echo ""
            echo "======================================"
            echo "OCR:"
            echo "$image"
            echo "======================================"

            tesseract "$image" stdout \
              -l hin+eng \
              --psm 3 \
              2>/dev/null >> sujas_ocr.txt

            echo "" >> sujas_ocr.txt
            echo "--- PAGE END ---" >> sujas_ocr.txt
            echo "" >> sujas_ocr.txt
          done

          echo ""
          echo "======================================"
          echo "OCR COMPLETE"
          echo "======================================"

          echo "TEXT CHARACTERS:"
          wc -m sujas_ocr.txt

          echo ""
          echo "========== OCR PREVIEW =========="
          head -c 15000 sujas_ocr.txt
          echo ""
          echo "================================="

      # =========================================================
      # 5. GEMINI
      # =========================================================
      - name: Process OCR with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          from pathlib import Path

          key = os.environ["GEMINI_API_KEY"]

          text = Path("sujas_ocr.txt").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("OCR TEXT LENGTH:", len(text))

          if len(text.strip()) < 1000:
              raise SystemExit(
                  "OCR text बहुत कम है — OCR quality check करनी होगी."
              )

          # अभी test के लिए 30000 characters
          source = text[:30000]

          prompt = f"""
          तुम RPSC और RSSB के लिए Current Affairs editor हो।

          नीचे राजस्थान सरकार के DIPR द्वारा प्रकाशित
          SUJAS e-Bulletin का OCR किया हुआ वास्तविक text है।

          केवल इसी source से महत्वपूर्ण current affairs निकालो।

          IMPORTANT:
          - कोई fact invent मत करो।
          - अगर OCR में कोई नाम/संख्या स्पष्ट नहीं है तो उसे मत लो।
          - पुराने/general facts मत बनाओ।
          - केवल source में मौजूद वर्तमान घटनाओं को लो।
          - राजस्थान से संबंधित सभी महत्वपूर्ण exam-worthy घटनाओं
            को प्राथमिकता दो।
          - योजनाएं, नियुक्तियां, पुरस्कार, व्यक्ति, खेल,
            अर्थव्यवस्था, कृषि, शिक्षा, स्वास्थ्य, पर्यावरण,
            उद्योग, निवेश, infrastructure, reports, science-tech,
            AI/digital आदि शामिल करो।
          - महत्वपूर्ण national/science-tech information भी लो
            अगर source में स्पष्ट रूप से मौजूद हो।

          प्रत्येक item इस format में दो:

          शीर्षक:
          तथ्य:
          प्रश्न:
          (A)
          (B)
          (C)
          (D)
          सही उत्तर:

          कम से कम 10 अच्छे और वास्तविक items निकालने की कोशिश करो।
          बेकार information को शामिल मत करो।

          SOURCE:
          {source}
          """

          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          success = False

          for model in models:

              print("")
              print("================================")
              print("MODEL:", model)
              print("================================")

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{model}:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.1
                  }
              }

              for attempt in range(3):

                  print(
                      f"ATTEMPT {attempt + 1}/3"
                  )

                  try:

                      response = requests.post(
                          url,
                          params={"key": key},
                          json=payload,
                          timeout=90
                      )

                      print(
                          "HTTP STATUS:",
                          response.status_code
                      )

                      if response.status_code == 200:

                          data = response.json()

                          output = (
                              data["candidates"][0]
                              ["content"]["parts"][0]["text"]
                          )

                          print("")
                          print("========== FINAL GEMINI RESULT ==========")
                          print(output)
                          print("==========================================")

                          success = True
                          break

                      print(
                          response.text[:1500]
                      )

                      if response.status_code in [
                          429, 500, 502, 503, 504
                      ]:
                          wait = 10 * (attempt + 1)

                          print(
                              "Temporary error."
                              f" Waiting {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      break

                  except Exception as e:

                      print(
                          "REQUEST ERROR:",
                          repr(e)
                      )

                      if attempt < 2:
                          time.sleep(10)

              if success:
                  print("")
                  print("SUCCESS MODEL:", model)
                  break

          if not success:
              raise SystemExit(
                  "Gemini failed with all available models."
              )

          PY
