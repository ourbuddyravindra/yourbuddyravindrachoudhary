name: Current Affairs - Fact Extraction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-facts:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------
      # 3. Install system packages
      # --------------------------------
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

      # --------------------------------
      # 4. Install Python packages
      # --------------------------------
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            requests \
            pillow

      # --------------------------------
      # 5. Download latest Sujas PDF
      # --------------------------------
      - name: Download latest Sujas
        env:
          DIPR_API: https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll
        run: |

          python - <<'PY'
          import requests
          import json
          import sys

          api = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(
              api,
              json=payload,
              timeout=60
          )

          r.raise_for_status()

          data = r.json()

          print("API response received")

          # Save raw response for debugging
          with open(
              "dipr_response.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Find records recursively
          def find_records(obj):

              if isinstance(obj, list):
                  for x in obj:
                      if isinstance(x, dict):
                          keys = {k.lower() for k in x.keys()}

                          if (
                              any("orderid" in k for k in keys)
                              or any("attachment" in k for k in keys)
                              or any("pdf" in k for k in keys)
                          ):
                              yield x

                          yield from find_records(x)

              elif isinstance(obj, dict):
                  for value in obj.values():
                      yield from find_records(value)

          records = list(find_records(data))

          print("Candidate records:", len(records))

          def get_value(record, keywords):

              for k, v in record.items():
                  kl = k.lower()

                  for keyword in keywords:
                      if keyword in kl and v:
                          return v

              return None

          selected = None

          for record in records:

              title = get_value(
                  record,
                  ["title", "subject", "name"]
              )

              pdf = get_value(
                  record,
                  ["pdf", "attachment", "fileurl", "url", "path"]
              )

              order_id = get_value(
                  record,
                  ["orderid", "order_id", "id"]
              )

              date = get_value(
                  record,
                  ["date", "orderdate", "entrydate"]
              )

              text = str(title or "")

              if "सुजस" in text.lower():

                  if pdf:
                      selected = {
                          "title": title,
                          "pdf": pdf,
                          "order_id": order_id,
                          "date": date
                      }
                      break

          if not selected:

              print("Could not automatically identify Sujas PDF.")

              # Print useful debugging information
              for record in records[:10]:
                  print(record)

              sys.exit(1)

          print("Selected:")
          print(json.dumps(
              selected,
              ensure_ascii=False,
              indent=2
          ))

          pdf_url = selected["pdf"]

          if isinstance(pdf_url, dict):
              pdf_url = (
                  pdf_url.get("url")
                  or pdf_url.get("fileUrl")
                  or pdf_url.get("path")
              )

          if not str(pdf_url).startswith("http"):

              if str(pdf_url).startswith("/"):
                  pdf_url = (
                      "https://jankalyanfile.rajasthan.gov.in"
                      + str(pdf_url)
                  )
              else:
                  pdf_url = (
                      "https://jankalyanfile.rajasthan.gov.in/"
                      + str(pdf_url)
                  )

          print("PDF URL:", pdf_url)

          pdf = requests.get(
              pdf_url,
              timeout=120
          )

          pdf.raise_for_status()

          content = pdf.content

          if not content.startswith(b"%PDF"):
              print(
                  "Downloaded file does not look like a PDF."
              )
              sys.exit(1)

          with open(
              "sujas_today.pdf",
              "wb"
          ) as f:
              f.write(content)

          with open(
              "sujas_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "title": selected["title"],
                      "pdf_url": pdf_url,
                      "order_id": selected["order_id"],
                      "date": selected["date"]
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Downloaded PDF:",
              len(content),
              "bytes"
          )
          PY

      # --------------------------------
      # 6. Convert PDF pages to images
      # --------------------------------
      - name: Convert PDF to images
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          ls -lh pages/

      # --------------------------------
      # 7. OCR every page
      # --------------------------------
      - name: OCR pages
        run: |

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          pages = sorted(
              Path("pages").glob("page-*.jpg")
          )

          output = []

          for image in pages:

              name = image.stem

              try:
                  page_number = int(
                      name.split("-")[-1]
                  )
              except:
                  continue

              print(
                  f"OCR page {page_number}..."
              )

              result = subprocess.run(
                  [
                      "tesseract",
                      str(image),
                      "stdout",
                      "-l",
                      "hin+eng",
                      "--psm",
                      "3"
                  ],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace"
              )

              text = result.stdout.strip()

              print(
                  f"Page {page_number}: "
                  f"{len(text)} characters"
              )

              output.append({
                  "page": page_number,
                  "text": text
              })

          with open(
              "ocr_pages.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Created ocr_pages.json"
          )
          print(
              "Pages:",
              len(output)
          )
          PY

      # --------------------------------
      # 8. Extract verified facts
      # --------------------------------
      - name: Extract verified facts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python extract_facts.py

      # --------------------------------
      # 9. Show result
      # --------------------------------
      - name: Show extracted facts
        run: |

          echo "=============================="
          echo "VERIFIED FACTS"
          echo "=============================="

          python - <<'PY'
          import json

          with open(
              "verified_facts.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Total facts:",
              data.get("facts_count")
          )

          print()

          for i, fact in enumerate(
              data.get("facts", []),
              1
          ):
              print(
                  f"{i}. {fact['fact']}"
              )
              print(
                  f"   Category: {fact['category']}"
              )
              print(
                  f"   Page: {fact['page']}"
              )
              print(
                  f"   Evidence: {fact['evidence']}"
              )
              print()
          PY

      # --------------------------------
      # 10. Upload debugging artifacts
      # --------------------------------
      - name: Upload extraction results
        uses: actions/upload-artifact@v4
        with:
          name: sujas-fact-extraction
          path: |
            sujas_today.pdf
            sujas_metadata.json
            ocr_pages.json
            verified_facts.json
            dipr_response.json
