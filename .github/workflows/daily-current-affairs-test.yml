name: Rajasthan Sources Test

on:
  workflow_dispatch:

concurrency:
  group: rajasthan-current-affairs-test
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Collect Official Rajasthan Sources
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urljoin

          print("=" * 70)
          print("RAJASTHAN CURRENT AFFAIRS COLLECTOR v2")
          print("Today:", datetime.now(ZoneInfo("Asia/Kolkata")).date())
          print("=" * 70)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def fetch(url, method="get", **kwargs):
              try:
                  kwargs.setdefault("timeout", (5, 10))

                  if method == "post":
                      r = session.post(url, **kwargs)
                  else:
                      r = session.get(url, **kwargs)

                  print(f"Status: {r.status_code} | {url}")
                  return r

              except Exception as e:
                  print("ERROR:", url)
                  print("      ", e)
                  return None

          # ============================================================
          # DIPR
          # ============================================================

          print("\n📰 DIPR — RAJASTHAN")
          print("-" * 70)

          dipr_url = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 50,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = fetch(
              dipr_url,
              method="post",
              json=payload,
              headers={"Content-Type": "application/json"}
          )

          if r:
              try:
                  data = r.json()

                  def find_records(obj):
                      if isinstance(obj, list):
                          for item in obj:
                              yield from find_records(item)

                      elif isinstance(obj, dict):
                          keys = {str(k).lower() for k in obj}

                          if (
                              ("title" in keys or "name" in keys)
                              and ("id" in keys or "orderid" in keys)
                          ):
                              yield obj

                          for value in obj.values():
                              yield from find_records(value)

                  records = list(find_records(data))

                  seen = set()
                  clean = []

                  for item in records:
                      title = str(
                          item.get("Title")
                          or item.get("title")
                          or item.get("Name")
                          or item.get("name")
                          or ""
                      ).strip()

                      rid = str(
                          item.get("Id")
                          or item.get("ID")
                          or item.get("id")
                          or item.get("OrderId")
                          or item.get("orderId")
                          or ""
                      ).strip()

                      date = str(
                          item.get("Date")
                          or item.get("date")
                          or item.get("EntryDate")
                          or ""
                      ).strip()

                      if not title:
                          continue

                      key = (title, rid, date)

                      if key not in seen:
                          seen.add(key)
                          clean.append((title, date, rid))

                  print("DIPR records found:", len(clean))

                  for title, date, rid in clean[:20]:
                      print(f"\n📌 {title}")
                      print(f"📅 {date}")
                      print(f"📦 ID: {rid}")

              except Exception as e:
                  print("DIPR ERROR:", e)

          # ============================================================
          # FINANCE — LATEST NEWS ONLY
          # ============================================================

          print("\n💰 FINANCE DEPARTMENT")
          print("-" * 70)

          finance_url = "https://finance.rajasthan.gov.in/"

          r = fetch(finance_url)

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              results = []
              seen = set()

              # Look specifically for news-like containers
              for element in soup.find_all(
                  ["div", "section", "table", "ul", "ol"]
              ):

                  text = " ".join(
                      element.get_text(" ", strip=True).split()
                  )

                  if not text:
                      continue

                  low = text.lower()

                  if not any(k in low for k in [
                      "latest news",
                      "latestnews",
                      "news",
                      "amendment",
                      "cag report"
                  ]):
                      continue

                  for a in element.find_all("a", href=True):

                      title = " ".join(
                          a.get_text(" ", strip=True).split()
                      )

                      href = urljoin(
                          finance_url,
                          a["href"]
                      )

                      if not title:
                          continue

                      if href.lower().startswith("javascript:"):
                          continue

                      bad = [
                          "budget manual",
                          "rsr rules",
                          "treasury rules",
                          "hra rules",
                          "provident fund",
                          "excise act",
                          "transparency in public procurement",
                          "pay scales"
                      ]

                      if any(x in title.lower() for x in bad):
                          continue

                      key = (title, href)

                      if key not in seen:
                          seen.add(key)
                          results.append((title, href))

              print("Finance latest candidates:", len(results))

              for title, href in results[:15]:
                  print(f"\n📌 {title}")
                  print("🔗", href)

          # ============================================================
          # RSSC — SPORTS EVENTS
          # ============================================================

          print("\n🏆 SPORTS — RSSC")
          print("-" * 70)

          rssc_url = (
              "https://rssc.rajasthan.gov.in/content/raj/"
              "sports/rajasthan-state-sports-council/en/home.html"
          )

          r = fetch(rssc_url)

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              sports = []
              seen = set()

              # Find heading/element containing Sports Events
              anchors = soup.find_all("a", href=True)

              for a in anchors:

                  title = " ".join(
                      a.get_text(" ", strip=True).split()
                  )

                  if not title:
                      continue

                  low = title.lower()

                  if any(k in low for k in [
                      "championship",
                      "league",
                      "tournament",
                      "sports event",
                      "ranking",
                      "hockey",
                      "football",
                      "cricket",
                      "badminton",
                      "athletics",
                      "probables",
                      "seminar"
                  ]):

                      href = urljoin(
                          rssc_url,
                          a["href"]
                      )

                      key = (title, href)

                      if key not in seen:
                          seen.add(key)
                          sports.append((title, href))

              print("Sports event candidates:", len(sports))

              for title, href in sports[:25]:
                  print(f"\n📌 {title}")
                  print("🔗", href)

          # ============================================================
          # RECRUITMENT — CURRENT JOB OPENINGS
          # ============================================================

          print("\n👥 RECRUITMENT — RAJASTHAN")
          print("-" * 70)

          recruitment_url = "https://recruitment.rajasthan.gov.in/"

          r = fetch(recruitment_url)

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              jobs = []
              seen = set()

              # Target the section containing Job Openings & Vacancies
              target = None

              for element in soup.find_all(
                  ["div", "section", "h1", "h2", "h3", "h4"]
              ):

                  text = " ".join(
                      element.get_text(" ", strip=True).split()
                  ).lower()

                  if "job openings & vacancies" in text:
                      target = element
                      break

              # If exact section isn't isolated, scan links but use
              # strict recruitment-title filtering.
              links = (
                  target.find_all("a", href=True)
                  if target
                  else soup.find_all("a", href=True)
              )

              for a in links:

                  title = " ".join(
                      a.get_text(" ", strip=True).split()
                  )

                  if not title:
                      continue

                  low = title.lower()

                  bad = [
                      "faq",
                      "frequently asked",
                      "help",
                      "login",
                      "register",
                      "home",
                      "contact",
                      "click here",
                      "one time registration",
                      "notice board"
                  ]

                  if any(x in low for x in bad):
                      continue

                  good = [
                      "recruitment",
                      "jen",
                      "safai karamchari",
                      "teacher",
                      "lecturer",
                      "scientific officer",
                      "medical teacher",
                      "set",
                      "vacancy",
                      "job"
                  ]

                  if not any(x in low for x in good):
                      continue

                  href = urljoin(
                      recruitment_url,
                      a["href"]
                  )

                  if href.lower().startswith("javascript:"):
                      continue

                  key = (title, href)

                  if key not in seen:
                      seen.add(key)
                      jobs.append((title, href))

              print("Recruitment candidates:", len(jobs))

              for title, href in jobs[:20]:
                  print(f"\n📌 {title}")
                  print("🔗", href)

          # ============================================================
          # FINISHED
          # ============================================================

          print("\n" + "=" * 70)
          print("SOURCE COLLECTION FINISHED")
          print("=" * 70)
