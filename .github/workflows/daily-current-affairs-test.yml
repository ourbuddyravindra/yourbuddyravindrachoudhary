name: DIPR PDF AI Test

on:
  workflow_dispatch:

jobs:
  dipr-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Install tools
        run: |
          python -m pip install requests pypdf

      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          import json
          from pathlib import Path

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(API, json=payload, timeout=30)
          r.raise_for_status()

          data = r.json()

          def find_records(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in ["Data","data","Result","result","Items","items"]:
                      if key in obj and isinstance(obj[key], list):
                          return obj[key]

                  for value in obj.values():
                      result = find_records(value)
                      if result:
                          return result

              return []

          records = find_records(data)

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:
              title = str(item.get("Title", ""))

              if "सुजस" in title and "बुलेटिन" in title:
                  selected = item
                  break

          if not selected:
              raise SystemExit("Sujas bulletin नहीं मिला")

          print("SELECTED:", selected.get("Title"))
          print("ORDER ID:", selected.get("Id"))
          print("DATE:", selected.get("HindiDate"))

          pdf_url = None

          for attachment in selected.get("AttachmentList", []):
              path = attachment.get("Path", "")

              if ".pdf" in path.lower():
                  pdf_url = path
                  break

          if not pdf_url:
              raise SystemExit("PDF URL नहीं मिला")

          print("PDF URL:", pdf_url)

          pdf = requests.get(pdf_url, timeout=90)
          pdf.raise_for_status()

          Path("sujas_today.pdf").write_bytes(pdf.content)

          print("PDF SIZE:", len(pdf.content))

          if len(pdf.content) < 100000:
              raise SystemExit("PDF बहुत छोटी है")

          print("DOWNLOAD SUCCESS")
          PY

      - name: Extract PDF text
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path

          print("Opening PDF...")

          reader = PdfReader("sujas_today.pdf")

          print("PAGES:", len(reader.pages))

          parts = []

          for number, page in enumerate(reader.pages, 1):

              print("Reading page:", number)

              try:
                  text = page.extract_text() or ""
              except Exception as e:
                  print("PAGE ERROR:", number, str(e))
                  text = ""

              parts.append(
                  f"\n--- PAGE {number} ---\n{text}"
              )

          final_text = "\n".join(parts)

          Path("sujas_text.txt").write_text(
              final_text,
              encoding="utf-8"
          )

          print("TEXT CHARACTERS:", len(final_text))

          if len(final_text.strip()) < 500:
              print("WARNING: PDF शायद scanned/image based है")

          print("\n========== TEXT PREVIEW ==========\n")
          print(final_text[:8000])
          print("\n===================================\n")
          PY

      - name: Gemini test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          from pathlib import Path

          key = os.environ["GEMINI_API_KEY"]

          text = Path("sujas_text.txt").read_text(
              encoding="utf-8"
          )

          print("SOURCE TEXT LENGTH:", len(text))

          # अभी सिर्फ छोटा sample Gemini को भेजेंगे
          sample = text[:12000]

          prompt = f"""
          नीचे SUJAS e-Bulletin से निकाला गया वास्तविक text है।

          इसमें से केवल 5 महत्वपूर्ण current affairs निकालो।

          कोई जानकारी अपनी तरफ से मत बनाओ।

          प्रत्येक में:
          1. शीर्षक
          2. तथ्य
          3. एक MCQ
          4. चार विकल्प
          5. सही उत्तर

          भाषा सरल हिंदी हो।

          SOURCE:

          {sample}
          """

          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          success = False

          for model in models:

              print("\nMODEL:", model)

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model +
                  ":generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.1
                  }
              }

              for attempt in range(3):

                  print(
                      "ATTEMPT:",
                      attempt + 1
                  )

                  try:

                      response = requests.post(
                          url,
                          params={"key": key},
                          json=payload,
                          timeout=60
                      )

                      print(
                          "STATUS:",
                          response.status_code
                      )

                      if response.status_code == 200:

                          data = response.json()

                          output = (
                              data["candidates"][0]
                              ["content"]["parts"][0]["text"]
                          )

                          print(
                              "\n========== GEMINI ==========\n"
                          )

                          print(output)

                          print(
                              "\n=============================\n"
                          )

                          success = True
                          break

                      print(response.text[:2000])

                      if response.status_code in [
                          429, 500, 502, 503, 504
                      ]:
                          wait = 10 * (attempt + 1)

                          print(
                              "Waiting",
                              wait,
                              "seconds..."
                          )

                          time.sleep(wait)
                          continue

                      break

                  except Exception as e:

                      print(
                          "REQUEST ERROR:",
                          repr(e)
                      )

                      if attempt < 2:
                          time.sleep(10)

              if success:
                  print(
                      "SUCCESS MODEL:",
                      model
                  )
                  break

          if not success:
              raise SystemExit(
                  "Gemini सभी attempts में failed"
              )

          PY
