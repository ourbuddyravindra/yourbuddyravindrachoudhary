name: Current Affairs - Fact Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-facts:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Python
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ============================================
      # 3. OCR tools
      # ============================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

      # ============================================
      # 4. Python packages
      # ============================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      # ============================================
      # 5. Download latest Sujas
      # ============================================
      - name: Download latest Sujas
        run: |
          python - <<'PY'
          import requests
          import json
          import sys
          import re
          from datetime import datetime

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          print("Calling DIPR API...")

          response = requests.post(
              API,
              json=payload,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          print("API response received")

          # --------------------------------------------
          # Recursively inspect API response
          # --------------------------------------------
          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          sujas = []

          for item in walk(data):

              if not isinstance(item, dict):
                  continue

              title = str(
                  item.get("Title") or ""
              ).strip()

              if "सुजस" not in title:
                  continue

              attachments = item.get(
                  "AttachmentList"
              )

              if not isinstance(
                  attachments,
                  list
              ):
                  continue

              for attachment in attachments:

                  if not isinstance(
                      attachment,
                      dict
                  ):
                      continue

                  path = (
                      attachment.get("Path")
                      or attachment.get("path")
                  )

                  if not path:
                      continue

                  sujas.append({
                      "id": item.get("Id"),
                      "title": title,
                      "date": item.get("Date"),
                      "path": path,
                      "attachment_name":
                          attachment.get(
                              "AttachmentsName"
                          )
                  })

          print(
              "Sujas candidates:",
              len(sujas)
          )

          if not sujas:
              print("ERROR: Sujas PDF not found")
              sys.exit(1)

          # --------------------------------------------
          # Newest Sujas
          # --------------------------------------------
          def sort_key(item):

              date_value = str(
                  item.get("date") or ""
              )

              try:
                  parsed = datetime.fromisoformat(
                      date_value.replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  timestamp = parsed.timestamp()

              except Exception:
                  timestamp = 0

              try:
                  item_id = int(
                      item.get("id") or 0
                  )
              except Exception:
                  item_id = 0

              return (
                  timestamp,
                  item_id
              )

          sujas.sort(
              key=sort_key,
              reverse=True
          )

          selected = sujas[0]

          pdf_url = str(
              selected["path"]
          ).strip()

          # --------------------------------------------
          # Extract URL from Markdown if required
          # --------------------------------------------
          match = re.search(
              r"\]\((https?://[^)]+)\)",
              pdf_url
          )

          if match:
              pdf_url = match.group(1)

          if not pdf_url.startswith(
              "http://"
          ) and not pdf_url.startswith(
              "https://"
          ):
              print(
                  "ERROR: Invalid PDF URL:"
              )
              print(pdf_url)
              sys.exit(1)

          selected["pdf_url"] = pdf_url

          print()
          print("========================================")
          print("SELECTED SUJAS")
          print("========================================")

          print(
              json.dumps(
                  selected,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # --------------------------------------------
          # Download PDF
          # --------------------------------------------
          print()
          print("Downloading PDF...")

          pdf_response = requests.get(
              pdf_url,
              timeout=180,
              headers={
                  "User-Agent":
                      "Mozilla/5.0"
              }
          )

          pdf_response.raise_for_status()

          content = pdf_response.content

          print(
              "Downloaded bytes:",
              len(content)
          )

          if not content.startswith(
              b"%PDF"
          ):
              print(
                  "ERROR: Downloaded file "
                  "is not a PDF"
              )
              sys.exit(1)

          with open(
              "sujas_today.pdf",
              "wb"
          ) as f:
              f.write(content)

          with open(
              "sujas_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "SUCCESS: Sujas PDF downloaded"
          )
          PY

      # ============================================
      # 6. PDF → JPG pages
      # ============================================
      - name: Convert PDF to images
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "Pages generated:"
          ls -lh pages/

      # ============================================
      # 7. OCR
      # ============================================
      - name: OCR pages
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          images = sorted(
              Path("pages").glob("page-*.jpg")
          )

          if not images:
              raise RuntimeError(
                  "No page images found"
              )

          results = []

          for image in images:

              try:
                  page_number = int(
                      image.stem.split("-")[-1]
                  )
              except Exception:
                  continue

              print(
                  f"OCR page {page_number}..."
              )

              result = subprocess.run(
                  [
                      "tesseract",
                      str(image),
                      "stdout",
                      "-l",
                      "hin+eng",
                      "--psm",
                      "3"
                  ],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace"
              )

              text = result.stdout.strip()

              results.append({
                  "page": page_number,
                  "text": text
              })

              print(
                  f"Page {page_number}: "
                  f"{len(text)} characters"
              )

          with open(
              "ocr_pages.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "OCR completed."
          )

          print(
              "Total pages:",
              len(results)
          )
          PY

      # ============================================
      # 8. Gemini FACT EXTRACTION
      # ============================================
      - name: Extract verified facts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python - <<'PY'
          import os
          import json
          import time
          from google import genai
          from google.genai import types

          API_KEY = os.environ["GEMINI_API_KEY"]

          MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.5-flash-lite"
          )

          client = genai.Client(
              api_key=API_KEY
          )

          # ------------------------------------------
          # JSON schema
          # ------------------------------------------
          schema = {
              "type": "object",
              "properties": {
                  "facts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "fact": {
                                  "type": "string"
                              },
                              "category": {
                                  "type": "string"
                              },
                              "page": {
                                  "type": "integer"
                              },
                              "evidence": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "fact",
                              "category",
                              "page",
                              "evidence"
                          ]
                      }
                  }
              },
              "required": [
                  "facts"
              ]
          }

          with open(
              "ocr_pages.json",
              "r",
              encoding="utf-8"
          ) as f:
              pages = json.load(f)

          all_facts = []

          for page_data in pages:

              page_number = int(
                  page_data["page"]
              )

              text = str(
                  page_data.get(
                      "text",
                      ""
                  )
              ).strip()

              if not text:
                  print(
                      f"Page {page_number}: "
                      "empty OCR"
                  )
                  continue

              print()
              print(
                  f"Processing page {page_number}..."
              )

              prompt = f"""
तुम राजस्थान प्रतियोगी परीक्षाओं के लिए
CURRENT AFFAIRS FACT EXTRACTOR हो।

यह राजस्थान सरकार के DIPR द्वारा जारी
Sujas e-Bulletin का Page {page_number} है।

तुम्हें केवल इसी page से महत्वपूर्ण
exam-oriented FACTS निकालने हैं।

बहुत महत्वपूर्ण नियम:

1. केवल दिए गए OCR text पर आधारित रहो।
2. अपनी तरफ से कोई तथ्य मत जोड़ो।
3. इंटरनेट या अपनी सामान्य जानकारी का उपयोग मत करो।
4. यदि OCR में कोई नाम/संख्या/शब्द अस्पष्ट है,
   तो अनुमान मत लगाओ।
5. हर fact का page {page_number} ही होना चाहिए।
6. हर fact के साथ source evidence देना अनिवार्य है।
7. Evidence उसी page के OCR text से होना चाहिए।
8. सामान्य समाचार वाक्य छोड़ दो।
9. Exam-oriented महत्वपूर्ण बातें प्राथमिकता से निकालो।
10. एक ही तथ्य को दो बार मत निकालो।
11. MCQ मत बनाओ।
12. Options मत बनाओ।
13. Answer मत बनाओ।

विशेष रूप से इन प्रकार के facts खोजो:

- नियुक्तियाँ
- महत्वपूर्ण व्यक्ति
- योजनाएँ
- कार्यक्रम
- नीतियाँ
- प्रशासनिक निर्णय
- चुनाव
- शिक्षा
- स्वास्थ्य
- कृषि
- खेल
- पुरस्कार
- अर्थव्यवस्था
- बजट
- पर्यावरण
- विज्ञान एवं तकनीक
- आधारभूत संरचना
- जिले से संबंधित महत्वपूर्ण तथ्य
- स्थान
- संस्थाएँ
- महत्वपूर्ण आँकड़े
- महत्वपूर्ण तिथियाँ

हर fact में:
fact = साफ exam-oriented तथ्य
category = उपयुक्त category
page = {page_number}
evidence = source में मौजूद छोटा supporting text

PAGE {page_number} OCR:

{text}
"""

              success = False

              for attempt in range(4):

                  try:

                      response = client.models.generate_content(
                          model=MODEL,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema=schema,
                              temperature=0.1
                          )
                      )

                      raw = response.text

                      data = json.loads(raw)

                      facts = data.get(
                          "facts",
                          []
                      )

                      valid = []

                      for item in facts:

                          if not isinstance(
                              item,
                              dict
                          ):
                              continue

                          fact = str(
                              item.get(
                                  "fact",
                                  ""
                              )
                          ).strip()

                          category = str(
                              item.get(
                                  "category",
                                  ""
                              )
                          ).strip()

                          evidence = str(
                              item.get(
                                  "evidence",
                                  ""
                              )
                          ).strip()

                          try:
                              page = int(
                                  item.get(
                                      "page",
                                      page_number
                                  )
                              )
                          except Exception:
                              page = page_number

                          # --------------------------------
                          # Basic validation
                          # --------------------------------
                          if not fact:
                              continue

                          if not evidence:
                              continue

                          if page != page_number:
                              continue

                          valid.append({
                              "fact": fact,
                              "category": category,
                              "page": page,
                              "evidence": evidence
                          })

                      print(
                          f"Page {page_number}: "
                          f"{len(valid)} facts"
                      )

                      all_facts.extend(
                          valid
                      )

                      success = True
                      break

                  except Exception as e:

                      print(
                          f"Attempt {attempt + 1} "
                          f"failed on page "
                          f"{page_number}: {e}"
                      )

                      if attempt < 3:
                          time.sleep(
                              2 ** attempt
                          )

              if not success:

                  print(
                      f"Page {page_number}: "
                      "Gemini failed after retries"
                  )

          # ------------------------------------------
          # Remove duplicate facts
          # ------------------------------------------
          unique = []
          seen = set()

          for item in all_facts:

              key = (
                  item["fact"]
                  .strip()
                  .lower()
              )

              if key in seen:
                  continue

              seen.add(key)
              unique.append(item)

          output = {
              "source": "Rajasthan Sujas",
              "facts_count": len(unique),
              "facts": unique
          }

          with open(
              "verified_facts.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("=" * 70)
          print(
              "TOTAL VERIFIED FACTS:",
              len(unique)
          )
          print("=" * 70)

          for i, item in enumerate(
              unique,
              1
          ):

              print()
              print(
                  f"{i}. {item['fact']}"
              )

              print(
                  f"   Category: "
                  f"{item['category']}"
              )

              print(
                  f"   Page: "
                  f"{item['page']}"
              )

              print(
                  f"   Evidence: "
                  f"{item['evidence']}"
              )
          PY

      # ============================================
      # 9. Upload result
      # ============================================
      - name: Upload extraction results
        uses: actions/upload-artifact@v4
        with:
          name: sujas-fact-extraction
          path: |
            sujas_today.pdf
            sujas_metadata.json
            ocr_pages.json
            verified_facts.json
