name: Daily Current Affairs Search Test

on:
  workflow_dispatch:

jobs:
  current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install -U google-genai

      - name: Google Search Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai
          from google.genai import types
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d-%m-%Y")

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          grounding_tool = types.Tool(
              google_search=types.GoogleSearch()
          )

          config = types.GenerateContentConfig(
              tools=[grounding_tool]
          )

          prompt = f"""
          आज की तारीख {today} है।

          Google Search का उपयोग करके केवल आज या
          पिछले 24 घंटे की महत्वपूर्ण खबरें खोजो।

          केवल:
          1. राजस्थान से संबंधित महत्वपूर्ण खबरें
          2. विज्ञान एवं प्रौद्योगिकी की महत्वपूर्ण खबरें

          सामान्य India politics/news मत दो।
          पुरानी खबर को current affair मत बनाओ।

          हर खबर के साथ:
          - शीर्षक
          - मुख्य तथ्य
          - स्रोत
          - स्रोत तारीख

          केवल verified information दो।
          """

          response = client.models.generate_content(
              model="gemini-3.5-flash",
              contents=prompt,
              config=config
          )

          print("==============================")
          print(f"📅 {today}")
          print("==============================")
          print(response.text)
          PY
