name: Official Sources Test

on:
  workflow_dispatch:

jobs:
  source-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install requests

      - name: Fetch Official Sources
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d-%m-%Y")

          print("=" * 60)
          print(f"OFFICIAL SOURCE TEST — {today}")
          print("=" * 60)

          # ---------------------------------
          # 1. Rajasthan DIPR
          # ---------------------------------

          print("\n🏜️ RAJASTHAN — DIPR")

          url = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          try:
              r = requests.post(
                  url,
                  json=payload,
                  timeout=30
              )

              print("DIPR Status:", r.status_code)

              data = r.json()

              print("DIPR response received successfully.")

              # Show first few records
              records = []

              if isinstance(data, dict):
                  for key in ["Data", "data", "Result", "result", "Items", "items"]:
                      if isinstance(data.get(key), list):
                          records = data[key]
                          break

              if not records and isinstance(data, list):
                  records = data

              print("Records found:", len(records))

              for item in records[:5]:
                  print("\n---")
                  print("Title:", item.get("Title") or item.get("title"))
                  print("Date:", item.get("Date") or item.get("date"))
                  print("ID:", item.get("Id") or item.get("id"))

          except Exception as e:
              print("DIPR ERROR:", type(e).__name__, e)

          # ---------------------------------
          # 2. Rajasthan Science & Technology
          # ---------------------------------

          print("\n💻 RAJASTHAN SCIENCE & TECHNOLOGY")

          dst_url = "https://dst.rajasthan.gov.in/"

          try:
              r = requests.get(
                  dst_url,
                  timeout=30
              )

              print("DST Status:", r.status_code)
              print("DST Page downloaded:", len(r.text), "characters")

              text = r.text.replace("<", "\n<")

              keywords = [
                  "science",
                  "technology",
                  "space",
                  "AI",
                  "artificial",
                  "innovation"
              ]

              found = []

              for line in text.splitlines():
                  low = line.lower()

                  if any(k.lower() in low for k in keywords):
                      clean = line.strip()

                      if clean and len(clean) > 20:
                          found.append(clean[:300])

              print("Technology-related lines found:", len(found))

              for line in found[:10]:
                  print("-", line)

          except Exception as e:
              print("DST ERROR:", type(e).__name__, e)

          # ---------------------------------
          # 3. PIB
          # ---------------------------------

          print("\n🇮🇳 PIB — TECHNOLOGY SOURCE")

          pib_url = "https://www.pib.gov.in/AllRelease.aspx?MenuId=22&PMO=1&lang=1&reg=1"

          try:
              r = requests.get(
                  pib_url,
                  timeout=30,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              print("PIB Status:", r.status_code)
              print("PIB Page downloaded:", len(r.text), "characters")

              text = r.text.replace("<", "\n<")

              keywords = [
                  "ISRO",
                  "space",
                  "technology",
                  "science",
                  "AI",
                  "cyber",
                  "digital"
              ]

              found = []

              for line in text.splitlines():
                  clean = line.strip()

                  if len(clean) > 20 and any(
                      k.lower() in clean.lower()
                      for k in keywords
                  ):
                      found.append(clean[:300])

              print("Technology-related PIB lines:", len(found))

              for line in found[:15]:
                  print("-", line)

          except Exception as e:
              print("PIB ERROR:", type(e).__name__, e)

          print("\n" + "=" * 60)
          print("SOURCE TEST FINISHED")
          print("=" * 60)
          PY
