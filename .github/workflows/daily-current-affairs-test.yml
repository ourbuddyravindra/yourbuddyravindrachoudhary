name: Official Sources Test

on:
  workflow_dispatch:

jobs:
  source-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Extract Official News
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          # =========================================================
          # DATE
          # =========================================================

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date()

          print("=" * 70)
          print("OFFICIAL CURRENT AFFAIRS SOURCE EXTRACTION")
          print("Today:", today)
          print("=" * 70)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          # =========================================================
          # 1. RAJASTHAN DST
          # =========================================================

          print("\n🏜️ RAJASTHAN SCIENCE & TECHNOLOGY — DST")
          print("-" * 70)

          dst_url = "https://dst.rajasthan.gov.in/news.aspx"

          try:
              r = requests.get(
                  dst_url,
                  headers=headers,
                  timeout=30
              )

              print("DST Status:", r.status_code)

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              dst_count = 0

              for row in soup.find_all("tr"):

                  cells = row.find_all(
                      ["td", "th"]
                  )

                  if len(cells) < 2:
                      continue

                  values = [
                      c.get_text(
                          " ",
                          strip=True
                      )
                      for c in cells
                  ]

                  text = " | ".join(values)

                  # Date: 03/09/2026
                  match = re.search(
                      r"\b(\d{2}/\d{2}/\d{4})\b",
                      text
                  )

                  if not match:
                      continue

                  date_text = match.group(1)

                  try:
                      item_date = datetime.strptime(
                          date_text,
                          "%d/%m/%Y"
                      ).date()
                  except:
                      continue

                  days_old = (
                      today - item_date
                  ).days

                  # Last 7 days
                  if days_old < 0 or days_old > 7:
                      continue

                  # Find useful title
                  title = ""

                  for value in values:
                      if len(value) >= 20:
                          if (
                              "03/" not in value
                              and "04/" not in value
                              and "05/" not in value
                          ):
                              title = value
                              break

                  if not title:
                      continue

                  # Find actual link
                  link = dst_url

                  a = row.find("a")

                  if a and a.get("href"):
                      href = a.get("href")

                      if href.startswith("http"):
                          link = href
                      elif href.startswith("/"):
                          link = (
                              "https://dst.rajasthan.gov.in"
                              + href
                          )

                  print("\n📌 Title:", title)
                  print("📅 Date:", date_text)
                  print("🔗 Source:", link)

                  dst_count += 1

                  if dst_count >= 10:
                      break

              print(
                  "\nDST useful entries:",
                  dst_count
              )

          except Exception as e:

              print(
                  "DST ERROR:",
                  str(e)
              )

          # =========================================================
          # 2. PIB — SCIENCE & TECHNOLOGY
          # =========================================================

          print("\n💻 PIB — SCIENCE & TECHNOLOGY")
          print("-" * 70)

          pib_url = (
              "https://www.pib.gov.in/"
              "AllRelease.aspx?"
              "MenuId=30&lang=1&reg=3"
          )

          try:

              r = requests.get(
                  pib_url,
                  headers=headers,
                  timeout=30
              )

              print(
                  "PIB Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              # Technology/science keywords
              keywords = [
                  "ISRO",
                  "space",
                  "satellite",
                  "rocket",
                  "GSLV",
                  "PSLV",
                  "EOS",
                  "artificial intelligence",
                  "AI",
                  "technology",
                  "science",
                  "quantum",
                  "semiconductor",
                  "cyber",
                  "digital",
                  "biotechnology",
                  "research",
                  "innovation",
                  "astronomy",
                  "nuclear",
                  "robotics"
              ]

              seen = set()
              pib_count = 0

              # =====================================================
              # PIB page में सभी links देखो
              # =====================================================

              for a in soup.find_all("a"):

                  title = a.get_text(
                      " ",
                      strip=True
                  )

                  if not title:
                      continue

                  if len(title) < 25:
                      continue

                  title_lower = title.lower()

                  # Technology/science filter
                  if not any(
                      k.lower() in title_lower
                      for k in keywords
                  ):
                      continue

                  # Duplicate
                  key = re.sub(
                      r"\s+",
                      " ",
                      title_lower
                  ).strip()

                  if key in seen:
                      continue

                  seen.add(key)

                  # =================================================
                  # Link
                  # =================================================

                  href = a.get(
                      "href",
                      ""
                  )

                  if href.startswith("http"):
                      link = href

                  elif href.startswith("/"):
                      link = (
                          "https://www.pib.gov.in"
                          + href
                      )

                  elif href:
                      link = (
                          "https://www.pib.gov.in/"
                          + href.lstrip("./")
                      )

                  else:
                      link = pib_url

                  # =================================================
                  # Date खोजने की कोशिश
                  # =================================================

                  parent_text = ""

                  parent = a.parent

                  if parent:
                      parent_text = parent.get_text(
                          " ",
                          strip=True
                      )

                  # आसपास के element में भी date खोजो
                  container_text = parent_text

                  if parent and parent.parent:
                      container_text += " " + (
                          parent.parent.get_text(
                              " ",
                              strip=True
                          )
                      )

                  date_match = re.search(
                      r"(\d{1,2})[/-]"
                      r"(\d{1,2})[/-]"
                      r"(\d{4})",
                      container_text
                  )

                  item_date = None

                  if date_match:

                      try:
                          item_date = datetime(
                              int(
                                  date_match.group(3)
                              ),
                              int(
                                  date_match.group(2)
                              ),
                              int(
                                  date_match.group(1)
                              )
                          ).date()

                      except:
                          item_date = None

                  # अगर date नहीं मिली तो भी title दिखाओ
                  # ताकि extraction diagnose हो सके

                  if item_date:

                      days_old = (
                          today - item_date
                      ).days

                      if (
                          days_old < 0
                          or days_old > 3
                      ):
                          continue

                  print(
                      "\n📌 Title:",
                      title
                  )

                  if item_date:
                      print(
                          "📅 Date:",
                          item_date.strftime(
                              "%d-%m-%Y"
                          )
                      )
                  else:
                      print(
                          "📅 Date:",
                          "Not detected"
                      )

                  print(
                      "🔗 Link:",
                      link
                  )

                  pib_count += 1

                  if pib_count >= 15:
                      break

              print(
                  "\nPIB useful entries:",
                  pib_count
              )

          except Exception as e:

              print(
                  "PIB ERROR:",
                  str(e)
              )

          # =========================================================
          # FINISHED
          # =========================================================

          print("\n" + "=" * 70)
          print("EXTRACTION TEST FINISHED")
          print("=" * 70)

          PY
