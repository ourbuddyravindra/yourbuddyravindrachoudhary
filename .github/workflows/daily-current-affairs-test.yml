name: Official Sources Test

on:
  workflow_dispatch:

jobs:
  source-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Extract Official News
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date()

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          print("=" * 70)
          print("OFFICIAL CURRENT AFFAIRS SOURCE EXTRACTION")
          print("Today:", today)
          print("=" * 70)

          # =========================================================
          # 1. RAJASTHAN DST
          # =========================================================

          print("\n🏜️ RAJASTHAN SCIENCE & TECHNOLOGY — DST")
          print("-" * 70)

          dst_url = "https://dst.rajasthan.gov.in/news.aspx"

          try:
              r = requests.get(
                  dst_url,
                  headers=headers,
                  timeout=30
              )

              print("DST Status:", r.status_code)

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              dst_count = 0

              for row in soup.find_all("tr"):

                  cells = row.find_all(
                      ["td", "th"]
                  )

                  if len(cells) < 3:
                      continue

                  values = [
                      c.get_text(
                          " ",
                          strip=True
                      )
                      for c in cells
                  ]

                  text = " | ".join(values)

                  match = re.search(
                      r"\b(\d{2}/\d{2}/\d{4})\b",
                      text
                  )

                  if not match:
                      continue

                  date_text = match.group(1)

                  try:
                      item_date = datetime.strptime(
                          date_text,
                          "%d/%m/%Y"
                      ).date()
                  except:
                      continue

                  days_old = (
                      today - item_date
                  ).days

                  if days_old < 0 or days_old > 7:
                      continue

                  # Table format:
                  # S.No | Title | Date | Download
                  title = values[1]

                  if len(title) < 15:
                      continue

                  # Ignore administrative/tender notices
                  ignore_words = [
                      "tender",
                      "corrigendum",
                      "auction",
                      "निविदा",
                      "नीलामी"
                  ]

                  if any(
                      word.lower() in title.lower()
                      for word in ignore_words
                  ):
                      continue

                  print("\n📌 Title:", title)
                  print("📅 Date:", date_text)
                  print("🔗 Source:", dst_url)

                  dst_count += 1

              print(
                  "\nDST useful entries:",
                  dst_count
              )

          except Exception as e:
              print(
                  "DST ERROR:",
                  str(e)
              )

          # =========================================================
          # 2. PIB SCIENCE & TECHNOLOGY
          # =========================================================

          print("\n💻 PIB — SCIENCE & TECHNOLOGY")
          print("-" * 70)

          pib_url = (
              "https://www.pib.gov.in/"
              "Newsite/pmreleases.aspx?"
              "lang=1&mincode=3&reg=48"
          )

          try:
              r = requests.get(
                  pib_url,
                  headers=headers,
                  timeout=30
              )

              print(
                  "PIB Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              keywords = [
                  "ISRO",
                  "space",
                  "satellite",
                  "rocket",
                  "GSLV",
                  "PSLV",
                  "EOS",
                  "artificial intelligence",
                  "technology",
                  "science",
                  "quantum",
                  "semiconductor",
                  "cyber",
                  "digital",
                  "biotechnology",
                  "research",
                  "innovation",
                  "robotics",
                  "astronomy",
                  "nuclear"
              ]

              seen = set()
              pib_count = 0

              # PIB listing has actual release links
              for a in soup.find_all("a"):

                  title = a.get_text(
                      " ",
                      strip=True
                  )

                  if not title:
                      continue

                  if len(title) < 25:
                      continue

                  title_lower = title.lower()

                  # Technology/science relevance
                  if not any(
                      keyword.lower()
                      in title_lower
                      for keyword in keywords
                  ):
                      continue

                  # Extract date from the same listing block
                  parent = a.parent

                  block_text = ""

                  if parent:
                      block_text = parent.get_text(
                          " ",
                          strip=True
                      )

                  if parent and parent.parent:
                      block_text += " " + (
                          parent.parent.get_text(
                              " ",
                              strip=True
                          )
                      )

                  date_match = re.search(
                      r"\((\d{1,2})-"
                      r"([A-Za-z]+)-"
                      r"(\d{4})\)",
                      block_text
                  )

                  item_date = None

                  if date_match:

                      day = int(
                          date_match.group(1)
                      )

                      month_name = (
                          date_match.group(2)
                      )

                      year = int(
                          date_match.group(3)
                      )

                      try:
                          item_date = datetime.strptime(
                              f"{day}-{month_name}-{year}",
                              "%d-%B-%Y"
                          ).date()

                      except:
                          # Try abbreviated month
                          try:
                              item_date = datetime.strptime(
                                  f"{day}-{month_name}-{year}",
                                  "%d-%b-%Y"
                              ).date()

                          except:
                              item_date = None

                  # Only recent releases
                  if item_date:

                      days_old = (
                          today - item_date
                      ).days

                      if (
                          days_old < 0
                          or days_old > 3
                      ):
                          continue

                  # Duplicate protection
                  key = title.lower()

                  if key in seen:
                      continue

                  seen.add(key)

                  # Link
                  href = a.get(
                      "href",
                      ""
                  )

                  if href.startswith("http"):
                      link = href

                  elif href.startswith("/"):
                      link = (
                          "https://www.pib.gov.in"
                          + href
                      )

                  else:
                      link = (
                          "https://www.pib.gov.in/"
                          + href.lstrip("./")
                      )

                  print(
                      "\n📌 Title:",
                      title
                  )

                  if item_date:
                      print(
                          "📅 Date:",
                          item_date.strftime(
                              "%d-%m-%Y"
                          )
                      )
                  else:
                      print(
                          "📅 Date:",
                          "Not detected"
                      )

                  print(
                      "🔗 Link:",
                      link
                  )

                  pib_count += 1

                  if pib_count >= 15:
                      break

              print(
                  "\nPIB useful entries:",
                  pib_count
              )

          except Exception as e:
              print(
                  "PIB ERROR:",
                  str(e)
              )

          # =========================================================
          # FINISHED
          # =========================================================

          print("\n" + "=" * 70)
          print("EXTRACTION TEST FINISHED")
          print("=" * 70)

          PY
