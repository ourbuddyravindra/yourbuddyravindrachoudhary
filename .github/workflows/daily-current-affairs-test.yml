name: YouTube Current Affairs Test

on:
  workflow_dispatch:

jobs:
  youtube-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get YouTube video data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          video_id = "u8HlUeD7r0A"
          key = os.environ["YOUTUBE_API_KEY"]

          url = "https://www.googleapis.com/youtube/v3/videos"

          params = {
              "part": "snippet,contentDetails",
              "id": video_id,
              "key": key
          }

          r = requests.get(url, params=params, timeout=20)
          r.raise_for_status()

          data = r.json()

          if not data.get("items"):
              raise SystemExit("Video नहीं मिला")

          video = data["items"][0]

          snippet = video["snippet"]

          print("=" * 60)
          print("VIDEO TITLE")
          print(snippet.get("title", ""))

          print("\nPUBLISHED")
          print(snippet.get("publishedAt", ""))

          print("\nDESCRIPTION")
          print(snippet.get("description", ""))

          print("\nCHANNEL")
          print(snippet.get("channelTitle", ""))

          print("\nVIDEO URL")
          print(f"https://www.youtube.com/watch?v={video_id}")

          print("=" * 60)
          PY
