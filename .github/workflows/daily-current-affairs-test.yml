name: Rajasthan Sources Test

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Collect Official Rajasthan Sources
        run: |
          python - <<'PY'
          import requests
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urljoin

          TODAY = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date()

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          print("=" * 70)
          print("RAJASTHAN CURRENT AFFAIRS COLLECTOR")
          print("Today:", TODAY)
          print("=" * 70)

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  text or ""
              ).strip()

          def recent(date_value, days=7):
              if not date_value:
                  return False

              age = (TODAY - date_value).days
              return 0 <= age <= days

          def get(url, timeout=30):
              return requests.get(
                  url,
                  headers=headers,
                  timeout=timeout
              )

          # =========================================================
          # 1. DIPR
          # =========================================================

          print("\n📰 DIPR — RAJASTHAN")
          print("-" * 70)

          dipr_api = (
              "https://dipr.rajasthan.gov.in/"
              "webapi/api/OrderPortal/GetAll"
          )

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 50,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          try:
              r = requests.post(
                  dipr_api,
                  json=payload,
                  headers=headers,
                  timeout=30
              )

              print("DIPR Status:", r.status_code)

              data = r.json()
              records = []

              def find_records(obj):
                  if isinstance(obj, list):
                      for item in obj:
                          if isinstance(item, dict):
                              keys = {
                                  str(k).lower()
                                  for k in item.keys()
                              }

                              has_title = any(
                                  k in keys
                                  for k in [
                                      "title",
                                      "ordertitle",
                                      "name"
                                  ]
                              )

                              has_id = any(
                                  k in keys
                                  for k in [
                                      "id",
                                      "orderid"
                                  ]
                              )

                              if has_title and has_id:
                                  records.append(item)

                          find_records(item)

                  elif isinstance(obj, dict):
                      for value in obj.values():
                          find_records(value)

              find_records(data)

              seen = set()
              unique = []

              for item in records:
                  title = ""

                  for key in [
                      "Title",
                      "OrderTitle",
                      "title",
                      "ordertitle",
                      "Name",
                      "name"
                  ]:
                      if key in item:
                          title = clean(
                              str(item[key])
                          )
                          if title:
                              break

                  if not title:
                      continue

                  key = title.lower()

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(item)

              print(
                  "DIPR records found:",
                  len(unique)
              )

              for item in unique[:20]:

                  title = ""

                  for key in [
                      "Title",
                      "OrderTitle",
                      "title",
                      "ordertitle",
                      "Name",
                      "name"
                  ]:
                      if key in item:
                          title = clean(
                              str(item[key])
                          )
                          if title:
                              break

                  if not title:
                      continue

                  print("\n📌", title)

                  for key in item:
                      if "date" in str(key).lower():
                          if item[key]:
                              print(
                                  "📅",
                                  key,
                                  ":",
                                  item[key]
                              )

                  print(
                      "📦 ID:",
                      item.get(
                          "Id",
                          item.get(
                              "ID",
                              item.get(
                                  "OrderId",
                                  ""
                              )
                          )
                      )
                  )

          except Exception as e:
              print("DIPR ERROR:", e)

          # =========================================================
          # 2. FINANCE
          # =========================================================

          print("\n💰 FINANCE DEPARTMENT")
          print("-" * 70)

          finance_url = (
              "https://finance.rajasthan.gov.in/"
          )

          try:
              r = get(finance_url)

              print(
                  "Finance Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              count = 0
              seen = set()

              for a in soup.find_all("a"):

                  title = clean(
                      a.get_text(
                          " ",
                          strip=True
                      )
                  )

                  if len(title) < 15:
                      continue

                  # Skip menu/navigation
                  bad = [
                      "home",
                      "about us",
                      "contact us",
                      "login",
                      "sitemap",
                      "feedback"
                  ]

                  if title.lower() in bad:
                      continue

                  parent_text = clean(
                      a.parent.get_text(
                          " ",
                          strip=True
                      )
                      if a.parent
                      else ""
                  )

                  if a.parent and a.parent.parent:
                      parent_text += " " + clean(
                          a.parent.parent.get_text(
                              " ",
                              strip=True
                          )
                      )

                  date_match = re.search(
                      r"\b(\d{1,2})\s+"
                      r"(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|"
                      r"Sep|Oct|Nov|Dec)\b",
                      parent_text,
                      re.IGNORECASE
                  )

                  item_date = None

                  if date_match:
                      try:
                          item_date = datetime.strptime(
                              f"{date_match.group(1)} "
                              f"{date_match.group(2)} "
                              f"{TODAY.year}",
                              "%d %b %Y"
                          ).date()
                      except:
                          pass

                  if not recent(
                      item_date,
                      10
                  ):
                      continue

                  key = title.lower()

                  if key in seen:
                      continue

                  seen.add(key)

                  link = urljoin(
                      finance_url,
                      a.get("href", "")
                  )

                  print("\n📌", title)

                  if item_date:
                      print(
                          "📅",
                          item_date.strftime(
                              "%d-%m-%Y"
                          )
                      )

                  print("🔗", link)

                  count += 1

                  if count >= 20:
                      break

              print(
                  "\nFinance candidates:",
                  count
              )

          except Exception as e:
              print(
                  "Finance ERROR:",
                  e
              )

          # =========================================================
          # 3. RSSC SPORTS
          # =========================================================

          print("\n🏆 SPORTS — RSSC")
          print("-" * 70)

          sports_url = (
              "https://rssc.rajasthan.gov.in/"
          )

          try:
              r = get(sports_url)

              print(
                  "Sports Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              text = soup.get_text(
                  "\n",
                  strip=True
              )

              lines = [
                  clean(x)
                  for x in text.splitlines()
                  if clean(x)
              ]

              date_pattern = re.compile(
                  r"\b(\d{1,2})\s+"
                  r"(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|"
                  r"Sep|Oct|Nov|Dec)\s+"
                  r"(2026)\b",
                  re.IGNORECASE
              )

              count = 0
              seen = set()

              for i, line in enumerate(lines):

                  match = date_pattern.search(
                      line
                  )

                  if not match:
                      continue

                  try:
                      event_date = datetime.strptime(
                          f"{match.group(1)} "
                          f"{match.group(2)} "
                          f"{match.group(3)}",
                          "%d %b %Y"
                      ).date()
                  except:
                      continue

                  days_from_today = (
                      event_date - TODAY
                  ).days

                  if (
                      days_from_today < -3
                      or days_from_today > 30
                  ):
                      continue

                  title = ""

                  if i > 0:
                      title = lines[i - 1]

                  if len(title) < 5:
                      continue

                  key = title.lower()

                  if key in seen:
                      continue

                  seen.add(key)

                  print("\n📌", title)
                  print(
                      "📅",
                      line
                  )
                  print(
                      "🏷️ Category: Sports"
                  )
                  print(
                      "🔗",
                      sports_url
                  )

                  count += 1

                  if count >= 20:
                      break

              print(
                  "\nSports candidates:",
                  count
              )

          except Exception as e:
              print(
                  "Sports ERROR:",
                  e
              )

          # =========================================================
          # 4. DST
          # =========================================================

          print("\n🔬 SCIENCE & TECHNOLOGY — DST")
          print("-" * 70)

          dst_url = (
              "https://dst.rajasthan.gov.in/news.aspx"
          )

          try:
              r = get(dst_url)

              print(
                  "DST Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              count = 0

              for row in soup.find_all("tr"):

                  cells = row.find_all("td")

                  if len(cells) < 3:
                      continue

                  values = [
                      clean(
                          c.get_text(
                              " ",
                              strip=True
                          )
                      )
                      for c in cells
                  ]

                  date_match = re.search(
                      r"\b(\d{2}/\d{2}/\d{4})\b",
                      " ".join(values)
                  )

                  if not date_match:
                      continue

                  try:
                      item_date = datetime.strptime(
                          date_match.group(1),
                          "%d/%m/%Y"
                      ).date()
                  except:
                      continue

                  if not recent(
                      item_date,
                      10
                  ):
                      continue

                  title = values[1]

                  if len(title) < 15:
                      continue

                  # Only exclude obvious administrative notices
                  administrative = [
                      "tender",
                      "corrigendum",
                      "auction",
                      "निविदा",
                      "नीलामी"
                  ]

                  if any(
                      word in title.lower()
                      for word in administrative
                  ):
                      continue

                  link = dst_url

                  a = row.find("a")

                  if a and a.get("href"):
                      link = urljoin(
                          dst_url,
                          a["href"]
                      )

                  print("\n📌", title)
                  print(
                      "📅",
                      date_match.group(1)
                  )
                  print(
                      "🏷️ Category: Science & Technology"
                  )
                  print(
                      "🔗",
                      link
                  )

                  count += 1

              print(
                  "\nDST candidates:",
                  count
              )

          except Exception as e:
              print(
                  "DST ERROR:",
                  e
              )

          # =========================================================
          # 5. RECRUITMENT PORTAL
          # =========================================================

          print("\n👥 RECRUITMENT — RAJASTHAN")
          print("-" * 70)

          recruitment_url = (
              "https://recruitment.rajasthan.gov.in/"
          )

          try:
              r = get(recruitment_url)

              print(
                  "Recruitment Status:",
                  r.status_code
              )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              count = 0
              seen = set()

              for a in soup.find_all("a"):

                  title = clean(
                      a.get_text(
                          " ",
                          strip=True
                      )
                  )

                  if len(title) < 12:
                      continue

                  text_lower = title.lower()

                  keywords = [
                      "recruit",
                      "recruitment",
                      "vacancy",
                      "joint",
                      "jen",
                      "safai",
                      "भर्ती"
                  ]

                  if not any(
                      x in text_lower
                      for x in keywords
                  ):
                      continue

                  if title.lower() in seen:
                      continue

                  seen.add(
                      title.lower()
                  )

                  link = urljoin(
                      recruitment_url,
                      a.get("href", "")
                  )

                  print(
                      "\n📌",
                      title
                  )

                  print(
                      "🏷️ Category: Recruitment"
                  )

                  print(
                      "🔗",
                      link
                  )

                  count += 1

                  if count >= 20:
                      break

              print(
                  "\nRecruitment candidates:",
                  count
              )

          except Exception as e:
              print(
                  "Recruitment ERROR:",
                  e
              )

          # =========================================================
          # FINAL
          # =========================================================

          print("\n")
          print("=" * 70)
          print("SOURCE COLLECTION FINISHED")
          print("=" * 70)

          PY
