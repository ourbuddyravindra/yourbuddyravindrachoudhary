name: YouTube Caption Test

on:
  workflow_dispatch:

jobs:
  caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check captions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          video_id = "u8HlUeD7r0A"
          key = os.environ["YOUTUBE_API_KEY"]

          url = "https://www.googleapis.com/youtube/v3/captions"

          r = requests.get(
              url,
              params={
                  "part": "snippet",
                  "videoId": video_id,
                  "key": key
              },
              timeout=20
          )

          print("HTTP STATUS:", r.status_code)

          if r.status_code != 200:
              print(r.text)
              raise SystemExit(1)

          data = r.json()
          items = data.get("items", [])

          print("CAPTION TRACKS:", len(items))

          if not items:
              print("NO CAPTIONS AVAILABLE")
          else:
              for item in items:
                  s = item["snippet"]
                  print("LANGUAGE:", s.get("language"))
                  print("NAME:", s.get("name"))
                  print("TYPE:", s.get("trackKind"))
                  print("CAPTION ID:", item.get("id"))

          PY
