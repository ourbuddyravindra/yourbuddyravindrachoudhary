name: Meridian Rajasthan Video Detector

on:
  workflow_dispatch:

jobs:
  detect-rajasthan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Find latest Rajasthan Current Affairs video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          KEY = os.environ["YOUTUBE_API_KEY"]

          # Meridian Academy channel
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          channel = r.json()["items"][0]
          uploads = channel["contentDetails"]["relatedPlaylists"]["uploads"]

          # Latest uploads
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "snippet,contentDetails",
                  "playlistId": uploads,
                  "maxResults": 10,
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          items = r.json().get("items", [])

          # Rajasthan Current Affairs / SUJAS video खोजें
          selected = None

          for item in items:
              title = item["snippet"]["title"]
              title_lower = title.lower()

              if (
                  "rajasthan current affairs" in title_lower
                  or "rajasthan" in title_lower and "sujas" in title_lower
              ):
                  selected = item
                  break

          if selected is None:
              raise SystemExit(
                  "❌ Latest uploads में Rajasthan Current Affairs video नहीं मिला"
              )

          video_id = selected["contentDetails"]["videoId"]
          title = selected["snippet"]["title"]
          published = selected["contentDetails"].get(
              "videoPublishedAt",
              selected["snippet"]["publishedAt"]
          )

          print("========================================")
          print("✅ RAJASTHAN VIDEO FOUND")
          print("========================================")
          print("TITLE:", title)
          print("VIDEO ID:", video_id)
          print("PUBLISHED:", published)
          print("URL:", f"https://www.youtube.com/watch?v={video_id}")
          print("========================================")
          PY
