name: DIPR Sujas AI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sujas-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ==========================================================
      # 1. INSTALL OCR TOOLS
      # ==========================================================
      - name: Install OCR tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

          python -m pip install --upgrade pip
          pip install requests

          echo "======================================"
          echo "TESSERACT VERSION"
          echo "======================================"
          tesseract --version

          echo ""
          echo "======================================"
          echo "AVAILABLE LANGUAGES"
          echo "======================================"
          tesseract --list-langs


      # ==========================================================
      # 2. DOWNLOAD LATEST SUJAS PDF FROM DIPR
      # ==========================================================
      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          response = requests.post(
              API,
              json=payload,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()


          def find_records(obj):

              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):

                  for key in [
                      "Data",
                      "data",
                      "Result",
                      "result",
                      "Items",
                      "items"
                  ]:

                      value = obj.get(key)

                      if isinstance(value, list):
                          return value

                  for value in obj.values():

                      found = find_records(value)

                      if found:
                          return found

              return []


          records = find_records(data)

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:

              title = str(
                  item.get("Title", "")
              )

              if (
                  "सुजस" in title
                  and "बुलेटिन" in title
              ):
                  selected = item
                  break


          if not selected:
              raise SystemExit(
                  "LATEST SUJAS BULLETIN NOT FOUND"
              )


          title = selected.get(
              "Title",
              ""
          )

          order_id = selected.get(
              "Id",
              ""
          )

          date = selected.get(
              "HindiDate",
              ""
          )


          print("SELECTED:", title)
          print("ORDER ID:", order_id)
          print("DATE:", date)


          pdf_url = None

          attachments = selected.get(
              "AttachmentList",
              []
          )

          for attachment in attachments:

              path = attachment.get(
                  "Path",
                  ""
              )

              if ".pdf" in path.lower():

                  pdf_url = path
                  break


          if not pdf_url:
              raise SystemExit(
                  "PDF URL NOT FOUND"
              )


          print("PDF URL:")
          print(pdf_url)


          pdf_response = requests.get(
              pdf_url,
              timeout=120
          )

          pdf_response.raise_for_status()


          Path(
              "sujas_today.pdf"
          ).write_bytes(
              pdf_response.content
          )


          print(
              "PDF SIZE:",
              len(pdf_response.content),
              "bytes"
          )

          print(
              "DOWNLOAD SUCCESS"
          )

          PY


      # ==========================================================
      # 3. CONVERT PDF TO HIGH QUALITY JPG PAGES
      # ==========================================================
      - name: Convert PDF to images
        run: |
          rm -rf pages
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "======================================"
          echo "GENERATED PAGES"
          echo "======================================"

          ls -lh pages/

          echo ""
          echo "TOTAL PAGES:"
          find pages -name "*.jpg" | wc -l


      # ==========================================================
      # 4. HINDI + ENGLISH OCR
      # ==========================================================
      - name: Hindi OCR
        run: |
          rm -f sujas_ocr.txt

          for image in pages/page-*.jpg
          do

            PAGE=$(basename "$image" .jpg)
            PAGE_NUMBER=$(echo "$PAGE" | sed 's/page-//')

            echo ""
            echo "======================================"
            echo "OCR PAGE: $PAGE_NUMBER"
            echo "======================================"

            echo "===== PAGE $PAGE_NUMBER =====" \
              >> sujas_ocr.txt

            tesseract \
              "$image" \
              stdout \
              -l hin+eng \
              --psm 3 \
              2>/dev/null \
              >> sujas_ocr.txt

            echo "" >> sujas_ocr.txt
            echo "" >> sujas_ocr.txt

          done


          echo ""
          echo "======================================"
          echo "OCR COMPLETE"
          echo "======================================"

          echo "OCR CHARACTERS:"
          wc -m sujas_ocr.txt

          echo ""
          echo "========== OCR PREVIEW =========="

          head -c 15000 sujas_ocr.txt

          echo ""
          echo "================================="


      # ==========================================================
      # 5. PAGE-WISE GEMINI
      #    IMAGE + OCR TEXT
      # ==========================================================
      - name: Gemini Page Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python - <<'PY'

          import os
          import json
          import time
          import base64
          import requests

          from pathlib import Path


          API_KEY = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not API_KEY:
              raise SystemExit(
                  "GEMINI_API_KEY secret missing"
              )


          MODEL = "gemini-3.5-flash-lite"


          # ======================================================
          # JSON SCHEMA
          # ======================================================

          schema = {
              "type": "object",
              "properties": {

                  "items": {

                      "type": "array",

                      "items": {

                          "type": "object",

                          "properties": {

                              "title": {
                                  "type": "string"
                              },

                              "fact": {
                                  "type": "string"
                              },

                              "question": {
                                  "type": "string"
                              },

                              "option_a": {
                                  "type": "string"
                              },

                              "option_b": {
                                  "type": "string"
                              },

                              "option_c": {
                                  "type": "string"
                              },

                              "option_d": {
                                  "type": "string"
                              },

                              "answer": {
                                  "type": "string",
                                  "enum": [
                                      "A",
                                      "B",
                                      "C",
                                      "D"
                                  ]
                              },

                              "page": {
                                  "type": "integer"
                              }

                          },

                          "required": [
                              "title",
                              "fact",
                              "question",
                              "option_a",
                              "option_b",
                              "option_c",
                              "option_d",
                              "answer",
                              "page"
                          ]
                      }
                  }
              },

              "required": [
                  "items"
              ]
          }


          # ======================================================
          # READ OCR
          # ======================================================

          ocr_text = Path(
              "sujas_ocr.txt"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          )


          # ======================================================
          # SPLIT OCR BY PAGE
          # ======================================================

          pages = {}

          current_page = None
          current_lines = []


          for line in ocr_text.splitlines():

              if line.startswith(
                  "===== PAGE "
              ):

                  if current_page is not None:

                      pages[current_page] = (
                          "\n".join(
                              current_lines
                          )
                      )


                  try:

                      current_page = int(
                          line
                          .replace(
                              "===== PAGE ",
                              ""
                          )
                          .replace(
                              " =====",
                              ""
                          )
                      )

                  except:

                      current_page = None


                  current_lines = []

              else:

                  if current_page is not None:
                      current_lines.append(line)


          if current_page is not None:

              pages[current_page] = (
                  "\n".join(
                      current_lines
                  )
              )


          print(
              "OCR PAGES FOUND:",
              sorted(pages.keys())
          )


          # ======================================================
          # PROCESS EVERY PAGE
          # ======================================================

          all_items = []


          for page_no in sorted(
              pages.keys()
          ):

              image_path = (
                  f"pages/page-{page_no}.jpg"
              )


              if not Path(
                  image_path
              ).exists():

                  print(
                      "IMAGE NOT FOUND:",
                      image_path
                  )

                  continue


              print("")
              print(
                  "======================================"
              )
              print(
                  f"PROCESSING PAGE {page_no}"
              )
              print(
                  "======================================"
              )


              page_ocr = pages[
                  page_no
              ]


              # --------------------------------------------------
              # IMAGE BASE64
              # --------------------------------------------------

              image_bytes = Path(
                  image_path
              ).read_bytes()


              image_b64 = base64.b64encode(
                  image_bytes
              ).decode(
                  "utf-8"
              )


              # --------------------------------------------------
              # PROMPT
              # --------------------------------------------------

              prompt = f"""

              तुम RPSC और RSSB परीक्षाओं के लिए
              राजस्थान Current Affairs विशेषज्ञ हो।

              तुम्हें SUJAS e-Bulletin के PAGE {page_no}
              से महत्वपूर्ण exam-oriented MCQs बनाने हैं।

              तुम्हारे पास इस page की ORIGINAL IMAGE और
              उसी page का OCR TEXT दोनों हैं।

              ==================================================
              SOURCE PRIORITY
              ==================================================

              1. ORIGINAL IMAGE सबसे महत्वपूर्ण source है।

              2. OCR text केवल सहायता के लिए है।

              3. यदि OCR और image में अंतर हो,
                 तो image को सही मानो।

              ==================================================
              STRICT ACCURACY RULES
              ==================================================

              1. SOURCE के बाहर की कोई जानकारी मत जोड़ो।

              2. अपनी सामान्य knowledge का उपयोग मत करो।

              3. किसी नाम, पद, तारीख, संख्या,
                 स्थान या योजना का अनुमान मत लगाओ।

              4. यदि कोई शब्द image में साफ नहीं है,
                 उस fact से question मत बनाओ।

              5. OCR की गलती को image देखकर सुधारो।

              6. केवल इसी PAGE में दिखाई/लिखी हुई
                 जानकारी से प्रश्न बनाओ।

              7. दूसरे pages की जानकारी मत मिलाओ।

              8. एक ही fact से duplicate questions मत बनाओ।

              9. सामान्य शुभकामना, slogan,
                 decorative text और irrelevant content
                 को छोड़ दो।

              10. केवल महत्वपूर्ण exam-worthy facts लो।

              11. हर question का page number {page_no} ही होना चाहिए।

              12. यदि इस page से केवल 1-2 अच्छे questions
                  बनते हैं तो केवल वही दो।

              13. ज्यादा questions बनाने के लिए
                  facts invent मत करो।

              14. Options भी source-safe होने चाहिए।

              15. यदि किसी option की जानकारी source में
                  नहीं है तो उसे केवल distractor के रूप में
                  इस्तेमाल मत करो।

              16. Date और numerical figures को
                  ORIGINAL IMAGE से verify करो।

              ==================================================
              QUESTION QUALITY
              ==================================================

              प्रश्न RPSC/RSSB level के होने चाहिए।

              प्राथमिकता:

              - सरकारी योजनाएं
              - सरकारी कार्यक्रम
              - नियुक्तियां
              - महत्वपूर्ण व्यक्ति
              - बजट/अर्थव्यवस्था
              - कृषि
              - शिक्षा
              - स्वास्थ्य
              - खेल
              - पुरस्कार
              - infrastructure
              - investment
              - environment
              - elections
              - science & technology
              - AI/digital
              - महत्वपूर्ण स्थान
              - महत्वपूर्ण सरकारी निर्णय

              ==================================================
              OCR TEXT
              ==================================================

              {page_ocr}

              ==================================================
              OUTPUT
              ==================================================

              केवल JSON output दो।

              कोई explanation नहीं।
              कोई markdown नहीं।
              कोई अतिरिक्त text नहीं।

              यदि कोई useful fact नहीं है:

              {{
                "items": []
              }}

              """


              # --------------------------------------------------
              # REQUEST
              # --------------------------------------------------

              payload = {

                  "contents": [

                      {

                          "parts": [

                              {

                                  "inline_data": {

                                      "mime_type":
                                          "image/jpeg",

                                      "data":
                                          image_b64
                                  }

                              },

                              {

                                  "text":
                                      prompt
                              }

                          ]

                      }

                  ],

                  "generationConfig": {

                      "temperature": 0,

                      "responseMimeType":
                          "application/json",

                      "responseSchema":
                          schema
                  }

              }


              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{MODEL}:generateContent"
              )


              page_success = False


              # --------------------------------------------------
              # RETRY
              # --------------------------------------------------

              for attempt in range(3):

                  print(
                      f"ATTEMPT {attempt + 1}/3"
                  )


                  try:

                      response = requests.post(

                          url,

                          params={
                              "key": API_KEY
                          },

                          json=payload,

                          timeout=120
                      )


                      print(
                          "HTTP STATUS:",
                          response.status_code
                      )


                      if response.status_code == 200:

                          data = response.json()


                          candidates = data.get(
                              "candidates",
                              []
                          )


                          if not candidates:

                              print(
                                  "NO CANDIDATES"
                              )

                              break


                          parts = (
                              candidates[0]
                              .get("content", {})
                              .get("parts", [])
                          )


                          if not parts:

                              print(
                                  "NO RESPONSE PARTS"
                              )

                              break


                          output = parts[0].get(
                              "text",
                              ""
                          )


                          result = json.loads(
                              output
                          )


                          items = result.get(
                              "items",
                              []
                          )


                          print(
                              f"PAGE {page_no} QUESTIONS:",
                              len(items)
                          )


                          for item in items:

                              item["page"] = page_no

                              all_items.append(
                                  item
                              )


                          page_success = True

                          break


                      else:

                          print(
                              response.text[:2000]
                          )


                          if response.status_code in [
                              429,
                              500,
                              502,
                              503,
                              504
                          ]:

                              wait = (
                                  8 *
                                  (attempt + 1)
                              )

                              print(
                                  f"WAITING {wait}s..."
                              )

                              time.sleep(
                                  wait
                              )

                          else:

                              break


                  except Exception as error:

                      print(
                          "ERROR:",
                          repr(error)
                      )


                      if attempt < 2:

                          time.sleep(
                              8
                          )


              if not page_success:

                  print(
                      f"PAGE {page_no} FAILED"
                  )


          # ======================================================
          # REMOVE DUPLICATE QUESTIONS
          # ======================================================

          unique_items = []

          seen = set()


          for item in all_items:

              question = str(
                  item.get(
                      "question",
                      ""
                  )
              ).strip()


              normalized = (
                  question
                  .lower()
                  .replace(
                      " ",
                      ""
                  )
              )


              if not normalized:
                  continue


              if normalized in seen:
                  continue


              seen.add(
                  normalized
              )


              unique_items.append(
                  item
              )


          # ======================================================
          # FINAL JSON
          # ======================================================

          final_result = {

              "items":
                  unique_items
          }


          Path(
              "current_affairs.json"
          ).write_text(

              json.dumps(
                  final_result,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )


          # ======================================================
          # PRINT FINAL RESULT
          # ======================================================

          print("")
          print(
              "======================================"
          )
          print(
              "FINAL TOTAL QUESTIONS:",
              len(unique_items)
          )
          print(
              "======================================"
          )


          for index, item in enumerate(
              unique_items,
              1
          ):

              print("")
              print(
                  f"Q{index}. "
                  f"{item.get('question', '')}"
              )

              print(
                  f"A) {item.get('option_a', '')}"
              )

              print(
                  f"B) {item.get('option_b', '')}"
              )

              print(
                  f"C) {item.get('option_c', '')}"
              )

              print(
                  f"D) {item.get('option_d', '')}"
              )

              print(
                  "ANSWER:",
                  item.get(
                      "answer",
                      ""
                  )
              )

              print(
                  "PAGE:",
                  item.get(
                      "page",
                      ""
                  )
              )

              print(
                  "FACT:",
                  item.get(
                      "fact",
                      ""
                  )
              )


          print("")
          print(
              "JSON FILE CREATED:"
          )
          print(
              "current_affairs.json"
          )

          PY


      # ==========================================================
      # 6. SHOW GENERATED JSON
      # ==========================================================
      - name: Show final JSON
        run: |
          echo "======================================"
          echo "FINAL JSON"
          echo "======================================"

          cat current_affairs.json


      # ==========================================================
      # 7. SAVE JSON AS ARTIFACT
      # ==========================================================
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sujas-current-affairs-result
          path: |
            current_affairs.json
            sujas_ocr.txt
