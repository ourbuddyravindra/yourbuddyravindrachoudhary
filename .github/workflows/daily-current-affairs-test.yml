name: Rajasthan Sources Test

on:
  workflow_dispatch:

concurrency:
  group: rajasthan-current-affairs-test
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Collect Rajasthan Sources
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urljoin
          import re

          print("=" * 70)
          print("RAJASTHAN CURRENT AFFAIRS COLLECTOR")
          print("Today:", datetime.now(ZoneInfo("Asia/Kolkata")).date())
          print("=" * 70)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; RajasthanCurrentAffairsBot/1.0)"
          })

          def get(url, method="get", **kwargs):
              try:
                  kwargs.setdefault("timeout", (5, 10))

                  if method == "post":
                      r = session.post(url, **kwargs)
                  else:
                      r = session.get(url, **kwargs)

                  print(f"Status: {r.status_code} | {url}")
                  return r

              except Exception as e:
                  print(f"ERROR: {url}")
                  print("       ", e)
                  return None

          # ============================================================
          # 1. DIPR
          # ============================================================

          print("\n📰 DIPR — RAJASTHAN")
          print("-" * 70)

          dipr_url = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 50,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = get(
              dipr_url,
              method="post",
              json=payload,
              headers={"Content-Type": "application/json"}
          )

          if r:
              try:
                  data = r.json()

                  def find_records(obj):
                      if isinstance(obj, list):
                          for x in obj:
                              yield from find_records(x)

                      elif isinstance(obj, dict):
                          keys = {str(k).lower() for k in obj.keys()}

                          if (
                              ("title" in keys or "name" in keys)
                              and ("id" in keys or "orderid" in keys)
                          ):
                              yield obj

                          for v in obj.values():
                              yield from find_records(v)

                  records = list(find_records(data))

                  seen = set()
                  clean = []

                  for x in records:
                      title = str(
                          x.get("Title")
                          or x.get("title")
                          or x.get("Name")
                          or x.get("name")
                          or ""
                      ).strip()

                      rid = str(
                          x.get("Id")
                          or x.get("ID")
                          or x.get("id")
                          or x.get("OrderId")
                          or x.get("orderId")
                          or ""
                      ).strip()

                      date = str(
                          x.get("Date")
                          or x.get("date")
                          or x.get("EntryDate")
                          or ""
                      ).strip()

                      if not title:
                          continue

                      key = (title, rid, date)

                      if key in seen:
                          continue

                      seen.add(key)
                      clean.append((title, date, rid))

                  print("DIPR records found:", len(clean))

                  for title, date, rid in clean[:20]:
                      print(f"\n📌 {title}")
                      print(f"📅 Date : {date}")
                      print(f"📦 ID: {rid}")

              except Exception as e:
                  print("DIPR JSON ERROR:", e)

          # ============================================================
          # 2. FINANCE
          # ============================================================

          print("\n💰 FINANCE DEPARTMENT")
          print("-" * 70)

          finance_url = "https://finance.rajasthan.gov.in/"

          r = get(finance_url)

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              candidates = []
              seen = set()

              for a in soup.find_all("a", href=True):
                  text = " ".join(a.get_text(" ", strip=True).split())
                  href = urljoin(finance_url, a["href"])

                  if not text:
                      continue

                  low = text.lower()

                  # Noise
                  noise = [
                      "skip to main content",
                      "home",
                      "contact us",
                      "feedback",
                      "sitemap",
                      "login",
                      "english",
                      "हिंदी"
                  ]

                  if any(n in low for n in noise):
                      continue

                  # Keep likely official finance/news documents
                  if (
                      ".pdf" in href.lower()
                      or any(k in low for k in [
                          "amendment",
                          "report",
                          "order",
                          "guideline",
                          "notification",
                          "budget",
                          "cag",
                          "rule",
                          "scheme",
                          "rips"
                      ])
                  ):
                      key = (text, href)

                      if key not in seen:
                          seen.add(key)
                          candidates.append((text, href))

              print("Finance candidates:", len(candidates))

              for text, href in candidates[:20]:
                  print(f"\n📌 {text}")
                  print("🔗", href)

          # ============================================================
          # 3. RSSC SPORTS
          # ============================================================

          print("\n🏆 SPORTS — RSSC")
          print("-" * 70)

          sports_url = "https://rssc.rajasthan.gov.in/"

          r = get(sports_url)

          sports = []

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              # Look for headings containing sports/events/news
              headings = soup.find_all(
                  ["h1", "h2", "h3", "h4", "h5", "h6", "strong", "b"]
              )

              for h in headings:
                  heading = " ".join(h.get_text(" ", strip=True).split())

                  if not heading:
                      continue

                  low = heading.lower()

                  if any(k in low for k in [
                      "sports events",
                      "sports event",
                      "latest updates",
                      "latest news",
                      "news",
                      "event"
                  ]):

                      # Collect nearby links
                      parent = h.parent

                      if parent:
                          for a in parent.find_all("a", href=True):
                              text = " ".join(
                                  a.get_text(" ", strip=True).split()
                              )

                              href = urljoin(
                                  sports_url,
                                  a["href"]
                              )

                              if text:
                                  sports.append((text, href))

                      # Also inspect nearby elements
                      for el in h.find_all_next(limit=15):
                          if el.name == "a" and el.get("href"):
                              text = " ".join(
                                  el.get_text(" ", strip=True).split()
                              )

                              href = urljoin(
                                  sports_url,
                                  el["href"]
                              )

                              if text:
                                  sports.append((text, href))

              # Fallback: scan all links for sports/event terminology
              if not sports:
                  for a in soup.find_all("a", href=True):
                      text = " ".join(
                          a.get_text(" ", strip=True).split()
                      )

                      if not text:
                          continue

                      low = text.lower()

                      if any(k in low for k in [
                          "championship",
                          "league",
                          "sports",
                          "football",
                          "hockey",
                          "cricket",
                          "badminton",
                          "athletics",
                          "ranking",
                          "tournament",
                          "seminar",
                          "probables"
                      ]):
                          sports.append((
                              text,
                              urljoin(sports_url, a["href"])
                          ))

              # Deduplicate
              unique = []
              seen = set()

              for item in sports:
                  if item not in seen:
                      seen.add(item)
                      unique.append(item)

              sports = unique

              print("Sports candidates:", len(sports))

              for text, href in sports[:30]:
                  print(f"\n📌 {text}")
                  print("🔗", href)

          # ============================================================
          # 4. DST — SCIENCE & TECHNOLOGY
          # ============================================================

          print("\n🔬 SCIENCE & TECHNOLOGY — DST")
          print("-" * 70)

          dst_url = "https://dst.rajasthan.gov.in/news.aspx"

          r = get(dst_url)

          dst = []

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              # Primary: tables
              for table in soup.find_all("table"):

                  for tr in table.find_all("tr"):
                      cells = tr.find_all(["td", "th"])

                      if not cells:
                          continue

                      row_text = [
                          " ".join(c.get_text(" ", strip=True).split())
                          for c in cells
                      ]

                      row_text = [x for x in row_text if x]

                      if not row_text:
                          continue

                      joined = " | ".join(row_text)
                      low = joined.lower()

                      # Ignore obvious administrative noise
                      noise = [
                          "corrigendum",
                          "tender",
                          "auction",
                          "quotation",
                          "bid document"
                      ]

                      if any(n in low for n in noise):
                          continue

                      links = tr.find_all("a", href=True)

                      href = ""

                      if links:
                          href = urljoin(
                              dst_url,
                              links[0]["href"]
                          )

                      dst.append((joined, href))

              # Fallback: links
              if not dst:
                  for a in soup.find_all("a", href=True):
                      text = " ".join(
                          a.get_text(" ", strip=True).split()
                      )

                      if not text:
                          continue

                      low = text.lower()

                      if any(k in low for k in [
                          "science",
                          "technology",
                          "innovation",
                          "research",
                          "scientific",
                          "science club",
                          "karya",
                          "innovator"
                      ]):

                          if any(n in low for n in [
                              "corrigendum",
                              "tender",
                              "auction"
                          ]):
                              continue

                          dst.append((
                              text,
                              urljoin(dst_url, a["href"])
                          ))

              unique = []
              seen = set()

              for item in dst:
                  if item not in seen:
                      seen.add(item)
                      unique.append(item)

              dst = unique

              print("DST candidates:", len(dst))

              for text, href in dst[:30]:
                  print(f"\n📌 {text}")
                  if href:
                      print("🔗", href)

          # ============================================================
          # 5. RECRUITMENT
          # ============================================================

          print("\n👥 RECRUITMENT — RAJASTHAN")
          print("-" * 70)

          recruitment_url = "https://recruitment.rajasthan.gov.in/"

          r = get(recruitment_url)

          recruitment = []

          if r:
              soup = BeautifulSoup(r.text, "html.parser")

              for a in soup.find_all("a", href=True):

                  text = " ".join(
                      a.get_text(" ", strip=True).split()
                  )

                  if not text:
                      continue

                  low = text.lower()

                  # Remove portal/navigation noise
                  noise = [
                      "frequently asked questions",
                      "faq",
                      "click here",
                      "read more",
                      "login",
                      "register",
                      "home",
                      "contact",
                      "helpdesk",
                      "@rajasthan.gov.in",
                      "english",
                      "हिंदी"
                  ]

                  if any(n in low for n in noise):
                      continue

                  # Keep actual recruitment-related entries
                  keywords = [
                      "recruitment",
                      "advertisement",
                      "vacancy",
                      "jen",
                      "safai",
                      "teacher",
                      "lecturer",
                      "scientific officer",
                      "medical",
                      "selection",
                      "application",
                      "exam"
                  ]

                  if any(k in low for k in keywords):

                      href = urljoin(
                          recruitment_url,
                          a["href"]
                      )

                      recruitment.append((text, href))

              unique = []
              seen = set()

              for item in recruitment:
                  if item not in seen:
                      seen.add(item)
                      unique.append(item)

              recruitment = unique

              print("Recruitment candidates:", len(recruitment))

              for text, href in recruitment[:30]:
                  print(f"\n📌 {text}")
                  print("🔗", href)

          # ============================================================
          # FINISHED
          # ============================================================

          print("\n" + "=" * 70)
          print("SOURCE COLLECTION FINISHED")
          print("=" * 70)
