name: Gemini Current Affairs Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["GEMINI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.7-flash:generateContent"
          )

          prompt = """
          राजस्थान प्रतियोगी परीक्षाओं के लिए एक MCQ बनाओ।

          विषय: राजस्थान का वर्तमान घटनाक्रम

          प्रश्न हिंदी में हो।
          4 विकल्प A, B, C, D हों।
          सही उत्तर बताओ।
          छोटी व्याख्या दो।

          यह केवल API connection test है।
          """

          response = requests.post(
              url,
              headers={
                  "x-goog-api-key": key,
                  "Content-Type": "application/json"
              },
              json={
                  "contents": [
                      {
                          "parts": [
                              {"text": prompt}
                          ]
                      }
                  ]
              },
              timeout=60
          )

          print("HTTP STATUS:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          data = response.json()

          text = data["candidates"][0]["content"]["parts"][0]["text"]

          print()
          print("========================================")
          print("✅ GEMINI RESPONSE")
          print("========================================")
          print(text)
          print("========================================")
          PY
