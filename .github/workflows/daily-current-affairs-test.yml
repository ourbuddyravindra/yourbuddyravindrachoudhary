name: Meridian Rajasthan Content Test

on:
  workflow_dispatch:

jobs:
  content-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get Rajasthan video metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          KEY = os.environ["YOUTUBE_API_KEY"]

          # Latest confirmed Rajasthan video
          video_id = "x8IoUpU6ifs"

          response = requests.get(
              "https://www.googleapis.com/youtube/v3/videos",
              params={
                  "part": "snippet,contentDetails",
                  "id": video_id,
                  "key": KEY
              },
              timeout=20
          )

          response.raise_for_status()

          data = response.json()

          if not data.get("items"):
              raise SystemExit("❌ Video नहीं मिला")

          video = data["items"][0]

          snippet = video["snippet"]
          details = video["contentDetails"]

          print("========================================")
          print("✅ RAJASTHAN VIDEO CONTENT TEST")
          print("========================================")

          print("TITLE:")
          print(snippet.get("title", ""))

          print()
          print("PUBLISHED:")
          print(snippet.get("publishedAt", ""))

          print()
          print("DESCRIPTION:")
          print(snippet.get("description", ""))

          print()
          print("TAGS:")
          print(", ".join(snippet.get("tags", [])))

          print()
          print("DURATION:")
          print(details.get("duration", ""))

          print()
          print("CAPTIONS AVAILABLE:")
          print(details.get("caption", ""))

          print()
          print("VIDEO URL:")
          print(f"https://www.youtube.com/watch?v={video_id}")

          print()
          print("========================================")
          PY
