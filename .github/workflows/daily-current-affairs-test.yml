name: DIPR PDF AI Test

on:
  workflow_dispatch:

jobs:
  dipr-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          import json
          from pathlib import Path

          api = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(api, json=payload, timeout=30)
          r.raise_for_status()

          data = r.json()

          def find_records(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in ["Data", "data", "Result", "result", "Items", "items"]:
                      if key in obj and isinstance(obj[key], list):
                          return obj[key]

                  for value in obj.values():
                      found = find_records(value)
                      if found:
                          return found

              return []

          records = find_records(data)

          if not records:
              raise SystemExit("DIPR records नहीं मिले")

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:
              text = json.dumps(item, ensure_ascii=False).lower()

              if "सुजस" in text and "बुलेटिन" in text:
                  selected = item
                  break

          if selected is None:
              selected = records[0]

          print("\nSELECTED RECORD:")
          print(json.dumps(selected, ensure_ascii=False, indent=2))

          def find_pdf_urls(obj):
              urls = []

              if isinstance(obj, str):
                  if ".pdf" in obj.lower():
                      urls.append(obj)

              elif isinstance(obj, dict):
                  for value in obj.values():
                      urls.extend(find_pdf_urls(value))

              elif isinstance(obj, list):
                  for value in obj:
                      urls.extend(find_pdf_urls(value))

              return urls

          pdf_urls = find_pdf_urls(selected)

          if not pdf_urls:
              raise SystemExit("PDF URL नहीं मिला")

          pdf_url = pdf_urls[0]

          print("\nPDF URL:", pdf_url)

          pdf = requests.get(pdf_url, timeout=60)
          pdf.raise_for_status()

          Path("sujas_today.pdf").write_bytes(pdf.content)

          print("PDF SIZE:", len(pdf.content), "bytes")
          PY

      - name: Extract PDF text
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path

          reader = PdfReader("sujas_today.pdf")

          print("PAGES:", len(reader.pages))

          text = ""

          for page_no, page in enumerate(reader.pages, 1):
              page_text = page.extract_text() or ""
              text += f"\n\n--- PAGE {page_no} ---\n{page_text}"

          Path("sujas_text.txt").write_text(
              text,
              encoding="utf-8"
          )

          print("TEXT CHARACTERS:", len(text))

          print("\n========== TEXT PREVIEW ==========\n")
          print(text[:12000])
          print("\n===================================\n")
          PY

      - name: Process with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import requests
          from pathlib import Path

          text = Path("sujas_text.txt").read_text(
              encoding="utf-8"
          )

          # अभी testing के लिए limit
          text = text[:60000]

          prompt = f"""
          तुम RPSC और RSSB के लिए Current Affairs Editor हो।

          नीचे राजस्थान सरकार के DIPR द्वारा जारी SUJAS
          e-Bulletin का वास्तविक text दिया गया है।

          IMPORTANT RULES:

          1. केवल source में मौजूद facts का उपयोग करो।
          2. कोई नाम, तारीख, संख्या, पद या घटना अपनी तरफ से मत बनाओ।
          3. महत्वपूर्ण exam-oriented facts निकालो।
          4. एक ही fact को दोहराओ मत।
          5. प्रश्न और answer source के fact पर आधारित होने चाहिए।
          6. अगर कोई जानकारी अस्पष्ट है तो उसे छोड़ दो।

          Categories:
          - राजस्थान नियुक्तियां
          - योजनाएं/कार्यक्रम
          - नीतियां
          - पुरस्कार
          - खेल
          - व्यक्ति/स्थान/घटनाएं
          - बजट/अर्थव्यवस्था
          - कृषि
          - शिक्षा
          - स्वास्थ्य
          - पर्यावरण
          - उद्योग/निवेश
          - आधारभूत संरचना/विकास
          - रिपोर्ट/सूचकांक
          - विज्ञान एवं प्रौद्योगिकी
          - AI/डिजिटल

          प्रत्येक item में:
          title
          category
          fact
          question
          4 options
          correct answer

          भाषा: सरल और स्पष्ट हिंदी।
          स्तर: RPSC/RSSB.

          Output केवल valid JSON में दो।

          SOURCE TEXT:
          {text}
          """

          schema = {
              "type": "object",
              "properties": {
                  "items": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "title": {
                                  "type": "string"
                              },
                              "category": {
                                  "type": "string"
                              },
                              "fact": {
                                  "type": "string"
                              },
                              "question": {
                                  "type": "string"
                              },
                              "options": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "answer": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "title",
                              "category",
                              "fact",
                              "question",
                              "options",
                              "answer"
                          ]
                      }
                  }
              },
              "required": ["items"]
          }

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "responseMimeType": "application/json",
                  "responseJsonSchema": schema
              }
          }

          headers = {
              "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              "Content-Type": "application/json"
          }

          max_retries = 6
          response = None

          for attempt in range(max_retries):

              print(
                  f"\nGemini attempt "
                  f"{attempt + 1}/{max_retries}"
              )

              try:
                  response = requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=120
                  )

                  print(
                      "HTTP STATUS:",
                      response.status_code
                  )

                  if response.status_code == 200:
                      break

                  if response.status_code in (
                      429, 500, 502, 503, 504
                  ):
                      if attempt < max_retries - 1:

                          base_delay = min(
                              60,
                              5 * (2 ** attempt)
                          )

                          jitter = random.uniform(0, 3)

                          wait = base_delay + jitter

                          print(
                              f"Temporary Gemini error. "
                              f"Retrying in {wait:.1f} seconds..."
                          )

                          time.sleep(wait)
                          continue

                  print(response.text)
                  raise SystemExit(
                      "Gemini request failed"
                  )

              except requests.RequestException as e:

                  print(
                      "REQUEST ERROR:",
                      str(e)
                  )

                  if attempt < max_retries - 1:

                      wait = min(
                          60,
                          5 * (2 ** attempt)
                      )

                      print(
                          f"Retrying in {wait} seconds..."
                      )

                      time.sleep(wait)

                  else:
                      raise

          if response is None or response.status_code != 200:
              raise SystemExit(
                  "Gemini failed after all retries"
              )

          result = response.json()

          output = (
              result["candidates"][0]
              ["content"]["parts"][0]["text"]
          )

          print(
              "\n========== GEMINI RESULT ==========\n"
          )

          print(output)

          print(
              "\n===================================\n"
          )

          parsed = json.loads(output)

          print(
              "TOTAL CURRENT AFFAIRS:",
              len(parsed.get("items", []))
          )

          PY
