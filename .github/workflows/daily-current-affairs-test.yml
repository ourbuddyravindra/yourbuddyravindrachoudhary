name: Meridian Rajasthan Video Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Get video information
        run: |
          yt-dlp \
            --skip-download \
            --write-description \
            --print "%(title)s" \
            --print "%(description)s" \
            "https://www.youtube.com/watch?v=x8IoUpU6ifs"
