name: DIPR PDF AI Test

on:
  workflow_dispatch:

jobs:
  dipr-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. INSTALL
      # ============================================================
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      # ============================================================
      # 2. DOWNLOAD LATEST SUJAS PDF
      # ============================================================
      - name: Download latest Sujas PDF
        run: |
          python - <<'PY'
          import requests
          import json
          from pathlib import Path

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          r = requests.post(API, json=payload, timeout=30)
          r.raise_for_status()

          data = r.json()

          def find_records(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in [
                      "Data", "data",
                      "Result", "result",
                      "Items", "items"
                  ]:
                      if key in obj and isinstance(obj[key], list):
                          return obj[key]

                  for value in obj.values():
                      found = find_records(value)
                      if found:
                          return found

              return []

          records = find_records(data)

          if not records:
              raise SystemExit("DIPR records नहीं मिले")

          print("TOTAL RECORDS:", len(records))

          selected = None

          for item in records:
              title = str(item.get("Title", ""))

              if "सुजस" in title and "बुलेटिन" in title:
                  selected = item
                  break

          if selected is None:
              raise SystemExit("Latest Sujas bulletin नहीं मिला")

          print("\nSELECTED:")
          print(selected.get("Title"))
          print("ORDER ID:", selected.get("Id"))
          print("DATE:", selected.get("HindiDate"))

          attachments = selected.get("AttachmentList", [])

          pdf_url = None

          for attachment in attachments:
              path = attachment.get("Path", "")

              if ".pdf" in path.lower():
                  pdf_url = path
                  break

          if not pdf_url:
              raise SystemExit("Sujas PDF URL नहीं मिला")

          print("PDF URL:", pdf_url)

          pdf = requests.get(pdf_url, timeout=90)
          pdf.raise_for_status()

          Path("sujas_today.pdf").write_bytes(pdf.content)

          print("PDF SIZE:", len(pdf.content), "bytes")

          # Save metadata
          Path("sujas_meta.json").write_text(
              json.dumps(selected, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # 3. EXTRACT TEXT
      # ============================================================
      - name: Extract PDF text
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path

          reader = PdfReader("sujas_today.pdf")

          print("PAGES:", len(reader.pages))

          all_text = []

          for page_no, page in enumerate(reader.pages, 1):

              text = page.extract_text() or ""

              all_text.append(
                  f"\n--- PAGE {page_no} ---\n{text}"
              )

          final_text = "\n".join(all_text)

          Path("sujas_text.txt").write_text(
              final_text,
              encoding="utf-8"
          )

          print("TEXT CHARACTERS:", len(final_text))

          print("\n========== TEXT PREVIEW ==========\n")
          print(final_text[:10000])
          print("\n===================================\n")

          if len(final_text.strip()) < 500:
              print(
                  "WARNING: PDF text बहुत कम है। "
                  "यह scanned/image PDF हो सकती है।"
              )

          PY

      # ============================================================
      # 4. GEMINI AI PROCESSING
      # ============================================================
      - name: Process Sujas with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import requests
          from pathlib import Path

          API_KEY = os.environ["GEMINI_API_KEY"]

          source = Path("sujas_text.txt").read_text(
              encoding="utf-8"
          )

          # Test के लिए पर्याप्त text
          # बाद में chunking लगाएँगे ताकि पूरा PDF process हो।
          source = source[:50000]

          prompt = f"""
          तुम RPSC और RSSB के लिए professional Current Affairs editor हो।

          नीचे राजस्थान सरकार के DIPR द्वारा प्रकाशित
          SUJAS e-Bulletin का वास्तविक text दिया गया है।

          तुम्हारा काम source से महत्वपूर्ण CURRENT AFFAIRS निकालना है।

          IMPORTANT RULES:

          1. केवल source में मौजूद facts इस्तेमाल करो।
          2. कोई नाम, तारीख, संख्या, पद या घटना invent मत करो।
          3. एक fact को दोबारा मत दो।
          4. महत्वपूर्ण और परीक्षा उपयोगी जानकारी को प्राथमिकता दो।
          5. बहुत सामान्य या promotional content छोड़ दो।
          6. अगर source में किसी fact की जानकारी अधूरी है,
             तो उस fact को छोड़ दो।
          7. हर answer source text से verify होने योग्य होना चाहिए।

          Categories:

          राजस्थान:
          - नियुक्तियां
          - योजनाएं
          - कार्यक्रम
          - नीतियां
          - पुरस्कार
          - खेल
          - व्यक्ति
          - स्थान
          - महत्वपूर्ण घटनाएं
          - बजट
          - अर्थव्यवस्था
          - कृषि
          - शिक्षा
          - स्वास्थ्य
          - पर्यावरण
          - उद्योग
          - निवेश
          - infrastructure/development
          - reports/indices
          - science & technology
          - AI/digital

          National/International:
          - केवल तभी शामिल करो जब source में स्पष्ट रूप से
            महत्वपूर्ण exam-oriented information हो।
          - Science & Technology और महत्वपूर्ण international
            developments को शामिल किया जा सकता है।

          प्रत्येक Current Affair के लिए:

          title
          category
          fact
          question
          options
          answer

          options में exactly 4 विकल्प होने चाहिए।

          भाषा:
          सरल, साफ और प्रतियोगी परीक्षा के अनुकूल हिंदी।

          SOURCE TEXT:

          {source}
          """

          schema = {
              "type": "object",
              "properties": {
                  "items": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "title": {
                                  "type": "string"
                              },
                              "category": {
                                  "type": "string"
                              },
                              "fact": {
                                  "type": "string"
                              },
                              "question": {
                                  "type": "string"
                              },
                              "options": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "answer": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "title",
                              "category",
                              "fact",
                              "question",
                              "options",
                              "answer"
                          ]
                      }
                  }
              },
              "required": ["items"]
          }

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "responseJsonSchema": schema
              }
          }

          headers = {
              "x-goog-api-key": API_KEY,
              "Content-Type": "application/json"
          }

          # पहले Lite, फिर Flash fallback
          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          success = False
          response = None

          for model in models:

              print("\n================================")
              print("TRYING MODEL:", model)
              print("================================")

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model +
                  ":generateContent"
              )

              for attempt in range(3):

                  print(
                      f"Attempt {attempt + 1}/3"
                  )

                  try:

                      response = requests.post(
                          url,
                          headers=headers,
                          json=payload,
                          timeout=90
                      )

                      print(
                          "HTTP STATUS:",
                          response.status_code
                      )

                      if response.status_code == 200:
                          success = True
                          break

                      if response.status_code in (
                          429, 500, 502, 503, 504
                      ):

                          wait = 5 * (2 ** attempt)

                          print(
                              f"Temporary error. "
                              f"Waiting {wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                      print(response.text)
                      break

                  except requests.RequestException as e:

                      print(
                          "REQUEST ERROR:",
                          str(e)
                      )

                      if attempt < 2:
                          wait = 5 * (2 ** attempt)
                          time.sleep(wait)

              if success:
                  print(
                      "\nSUCCESS WITH MODEL:",
                      model
                  )
                  break

              print(
                  "\nModel failed:",
                  model
              )

          if not success:
              raise SystemExit(
                  "All Gemini models failed."
              )

          data = response.json()

          output = (
              data["candidates"][0]
              ["content"]["parts"][0]["text"]
          )

          print(
              "\n========== GEMINI RESULT ==========\n"
          )

          print(output)

          print(
              "\n===================================\n"
          )

          parsed = json.loads(output)

          items = parsed.get("items", [])

          print(
              "TOTAL CURRENT AFFAIRS:",
              len(items)
          )

          # Basic validation
          for i, item in enumerate(items, 1):

              if len(item.get("options", [])) != 4:
                  print(
                      "WARNING: Item",
                      i,
                      "has",
                      len(item.get("options", [])),
                      "options"
                  )

          PY
