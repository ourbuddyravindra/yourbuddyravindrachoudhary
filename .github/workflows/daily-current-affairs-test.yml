name: Daily Current Affairs Test

on:
  workflow_dispatch:

jobs:
  current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install -U google-genai

      - name: Generate Current Affairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d-%m-%Y")

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          prompt = f"""
          आज की तारीख {today} है।

          राजस्थान प्रतियोगी परीक्षाओं के लिए CURRENT AFFAIRS तैयार करो।

          केवल दो categories रखो:

          🏜️ राजस्थान करेंट अफेयर्स
          💻 विज्ञान एवं प्रौद्योगिकी

          STRICT RULES:

          1. केवल हाल की और परीक्षा-उपयोगी घटनाएँ शामिल करो।
          2. राजस्थान category की खबर का राजस्थान से स्पष्ट संबंध होना चाहिए।
          3. Technology में AI, Space, ISRO, Digital Technology,
             Cyber, Science और महत्वपूर्ण technological developments
             शामिल किए जा सकते हैं।
          4. सामान्य India politics/news शामिल मत करो।
          5. Entertainment, celebrity और सामान्य मौसम शामिल मत करो।
          6. कमजोर या filler खबरें मत जोड़ो।
          7. कोई fact invent मत करो।
          8. प्रत्येक खबर के साथ source और source date दो।
          9. Hindi में concise और exam-oriented भाषा रखो।
          10. महत्वपूर्ण facts के बाद MCQs बनाओ।
          11. MCQ का सही उत्तर स्पष्ट रूप से बताओ।
          12. पुरानी खबर को आज की current affair के रूप में प्रस्तुत मत करो।

          OUTPUT FORMAT:

          📅 करेंट अफेयर्स — {today}

          🏜️ राजस्थान करेंट अफेयर्स

          1. शीर्षक
          • मुख्य तथ्य:
          • परीक्षा उपयोगी तथ्य:
          • स्रोत:
          • स्रोत तारीख:

          💻 विज्ञान एवं प्रौद्योगिकी

          1. शीर्षक
          • मुख्य तथ्य:
          • परीक्षा उपयोगी तथ्य:
          • स्रोत:
          • स्रोत तारीख:

          📝 महत्वपूर्ण MCQs

          Q1. प्रश्न?
          A. विकल्प
          B. विकल्प
          C. विकल्प
          D. विकल्प

          उत्तर: B

          केवल verified और genuinely important information दो।
          """

          models = [
              "gemini-3.5-flash",
              "gemini-3.6-flash",
              "gemini-3.7-flash"
          ]

          for model in models:
              print(f"Trying model: {model}")

              for attempt in range(3):
                  try:
                      print(f"Attempt: {attempt + 1}")

                      response = client.models.generate_content(
                          model=model,
                          contents=prompt
                      )

                      print("")
                      print("==============================")
                      print(f"📅 करेंट अफेयर्स — {today}")
                      print(f"🤖 Model: {model}")
                      print("==============================")
                      print("")
                      print(response.text)

                      raise SystemExit(0)

                  except SystemExit:
                      raise

                  except Exception as e:
                      print(
                          f"Error: {type(e).__name__}: {e}"
                      )

                      if attempt < 2:
                          wait_time = 15 * (attempt + 1)
                          print(
                              f"Retrying after {wait_time} seconds..."
                          )
                          time.sleep(wait_time)

              print(f"Model failed: {model}")
              print("Trying next model...")

          raise RuntimeError(
              "All Gemini models failed after retries."
          )
          PY
