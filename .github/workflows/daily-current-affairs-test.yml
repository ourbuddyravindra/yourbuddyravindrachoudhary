name: Daily Current Affairs Test

on:
  workflow_dispatch:

jobs:
  current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          pip install -U google-genai

      - name: Generate Current Affairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d-%m-%Y")

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          prompt = f"""
          आज की तारीख {today} है।

          राजस्थान प्रतियोगी परीक्षाओं के लिए CURRENT AFFAIRS तैयार करो।

          केवल दो categories रखो:

          🏜️ राजस्थान करेंट अफेयर्स
          💻 विज्ञान एवं प्रौद्योगिकी

          STRICT RULES:

          1. आज की तारीख को ध्यान में रखो।
          2. केवल हाल की और परीक्षा-उपयोगी घटनाएँ शामिल करो।
          3. राजस्थान category की खबर का राजस्थान से स्पष्ट संबंध होना चाहिए।
          4. Technology category में AI, Space, ISRO,
             Digital Technology, Cyber, Science और महत्वपूर्ण
             technological developments शामिल किए जा सकते हैं।
          5. सामान्य India politics/news शामिल मत करो।
          6. Entertainment, celebrity, सामान्य मौसम आदि शामिल मत करो।
          7. सिर्फ संख्या बढ़ाने के लिए कमजोर खबरें मत जोड़ो।
          8. अगर कोई महत्वपूर्ण खबर नहीं है तो category खाली रखो।
          9. कोई fact invent मत करो।
          10. प्रत्येक खबर के साथ source और source date दो।
          11. Hindi में concise और exam-oriented भाषा रखो।
          12. महत्वपूर्ण facts के बाद MCQ बनाओ।
          13. MCQ का सही उत्तर स्पष्ट रूप से बताओ।
          14. आज की तारीख से असंगत पुरानी खबर को current
              affair के रूप में प्रस्तुत मत करो।

          OUTPUT FORMAT:

          📅 करेंट अफेयर्स — {today}

          🏜️ राजस्थान करेंट अफेयर्स

          1. शीर्षक
          • मुख्य तथ्य:
          • परीक्षा उपयोगी तथ्य:
          • स्रोत:
          • स्रोत तारीख:

          💻 विज्ञान एवं प्रौद्योगिकी

          1. शीर्षक
          • मुख्य तथ्य:
          • परीक्षा उपयोगी तथ्य:
          • स्रोत:
          • स्रोत तारीख:

          📝 महत्वपूर्ण MCQs

          Q1. प्रश्न?
          A. विकल्प
          B. विकल्प
          C. विकल्प
          D. विकल्प

          उत्तर: B

          केवल verified और genuinely important information दो।
          """

          models = [
    "gemini-3.5-flash"
]

          last_error = None

          for model in models:
              for attempt in range(3):
                  try:
                      print(
                          f"Trying {model}, attempt {attempt + 1}"
                      )

                      response = client.models.generate_content(
                          model=model,
                          contents=prompt
                      )

                      print("\n==============================")
                      print(f"📅 {today}")
                      print("==============================\n")
                      print(response.text)

                      raise SystemExit(0)

                  except Exception as e:
                      last_error = e
                      print(
                          f"Temporary error: {type(e).__name__}: {e}"
                      )

                      if attempt < 2:
                          time.sleep(10 * (attempt + 1))

              print(f"Switching from {model}...")

          print("All Gemini attempts failed.")
          raise last_error
          PY
