name: Meridian New Video Detector

on:
  workflow_dispatch:

jobs:
  detect-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Detect latest Meridian video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone

          KEY = os.environ["YOUTUBE_API_KEY"]

          # Meridian Academy channel
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          channel = r.json()["items"][0]
          uploads = channel["contentDetails"]["relatedPlaylists"]["uploads"]

          # Latest uploads
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "snippet,contentDetails",
                  "playlistId": uploads,
                  "maxResults": 5,
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          items = r.json().get("items", [])

          print("Meridian Academy latest videos:")
          print()

          for item in items:
              video_id = item["contentDetails"]["videoId"]
              title = item["snippet"]["title"]
              published = item["contentDetails"].get(
                  "videoPublishedAt",
                  item["snippet"]["publishedAt"]
              )

              print("TITLE:", title)
              print("VIDEO ID:", video_id)
              print("PUBLISHED:", published)
              print("URL:", f"https://www.youtube.com/watch?v={video_id}")
              print("-" * 60)

          if not items:
              raise SystemExit("❌ कोई video नहीं मिला")

          latest = items[0]
          latest_id = latest["contentDetails"]["videoId"]

          print()
          print("========================================")
          print("LATEST VIDEO ID:", latest_id)
          print("========================================")
          PY
