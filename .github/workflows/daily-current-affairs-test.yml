name: Current Affairs - Fact Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-facts:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ==========================================
      # 3. OCR software
      # ==========================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-eng

      # ==========================================
      # 4. Python packages
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pillow

      # ==========================================
      # 5. Download latest Sujas PDF
      # ==========================================
      - name: Download latest Sujas
        run: |
          python - <<'PY'
          import requests
          import json
          import sys
          import re

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          print("Calling DIPR API...")

          response = requests.post(
              API,
              json=payload,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          print("API response received")

          # ------------------------------------------
          # Recursively find all dictionaries
          # ------------------------------------------
          def walk(obj):

              if isinstance(obj, dict):
                  yield obj

                  for value in obj.values():
                      yield from walk(value)

              elif isinstance(obj, list):

                  for value in obj:
                      yield from walk(value)

          # ------------------------------------------
          # Find Sujas records
          # ------------------------------------------
          sujas_records = []

          for item in walk(data):

              if not isinstance(item, dict):
                  continue

              title = str(
                  item.get("Title") or ""
              ).strip()

              attachments = item.get(
                  "AttachmentList"
              )

              if not isinstance(
                  attachments,
                  list
              ):
                  continue

              if "सुजस" not in title:
                  continue

              for attachment in attachments:

                  if not isinstance(
                      attachment,
                      dict
                  ):
                      continue

                  path = (
                      attachment.get("Path")
                      or attachment.get("path")
                  )

                  if not path:
                      continue

                  sujas_records.append({
                      "id": item.get("Id"),
                      "title": title,
                      "date": item.get("Date"),
                      "path": path,
                      "attachment_name":
                          attachment.get(
                              "AttachmentsName"
                          )
                  })

          print(
              "Sujas records found:",
              len(sujas_records)
          )

          if not sujas_records:
              print(
                  "ERROR: No Sujas PDF found"
              )
              sys.exit(1)

          # ------------------------------------------
          # Sort by date / ID
          # ------------------------------------------
          def sort_key(x):

              return (
                  str(x.get("date") or ""),
                  int(x.get("id") or 0)
              )

          sujas_records.sort(
              key=sort_key,
              reverse=True
          )

          selected = sujas_records[0]

          print()
          print("==========================================")
          print("SELECTED SUJAS")
          print("==========================================")

          print(
              json.dumps(
                  selected,
                  ensure_ascii=False,
                  indent=2
              )
          )

          pdf_url = str(
              selected["path"]
          ).strip()

          # ------------------------------------------
          # Extract URL if API returns Markdown link
          # ------------------------------------------
          markdown_match = re.search(
              r"\]\((https?://[^)]+)\)",
              pdf_url
          )

          if markdown_match:
              pdf_url = markdown_match.group(1)

          # Remove accidental spaces
          pdf_url = pdf_url.strip()

          if not pdf_url.startswith(
              "http://"
          ) and not pdf_url.startswith(
              "https://"
          ):
              print(
                  "ERROR: Invalid PDF URL:"
              )
              print(pdf_url)
              sys.exit(1)

          print()
          print("PDF URL:")
          print(pdf_url)

          # ------------------------------------------
          # Download
          # ------------------------------------------
          print()
          print("Downloading PDF...")

          pdf_response = requests.get(
              pdf_url,
              timeout=180,
              headers={
                  "User-Agent":
                      "Mozilla/5.0"
              }
          )

          pdf_response.raise_for_status()

          content = pdf_response.content

          print(
              "Downloaded:",
              len(content),
              "bytes"
          )

          # ------------------------------------------
          # Validate PDF
          # ------------------------------------------
          if not content.startswith(
              b"%PDF"
          ):
              print(
                  "ERROR: Downloaded file "
                  "is not a valid PDF"
              )
              sys.exit(1)

          with open(
              "sujas_today.pdf",
              "wb"
          ) as f:
              f.write(content)

          selected["pdf_url"] = pdf_url

          with open(
              "sujas_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "SUCCESS: Sujas PDF downloaded"
          )
          PY

      # ==========================================
      # 6. Convert PDF → images
      # ==========================================
      - name: Convert PDF to images
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "Generated pages:"
          ls -lh pages/

      # ==========================================
      # 7. OCR
      # ==========================================
      - name: OCR pages
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          images = sorted(
              Path("pages").glob("page-*.jpg")
          )

          if not images:
              raise RuntimeError(
                  "No page images generated"
              )

          results = []

          for image in images:

              try:
                  page_number = int(
                      image.stem.split("-")[-1]
                  )
              except Exception:
                  continue

              print(
                  f"OCR page {page_number}..."
              )

              result = subprocess.run(
                  [
                      "tesseract",
                      str(image),
                      "stdout",
                      "-l",
                      "hin+eng",
                      "--psm",
                      "3"
                  ],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace"
              )

              text = result.stdout.strip()

              results.append({
                  "page": page_number,
                  "text": text
              })

              print(
                  f"Page {page_number}: "
                  f"{len(text)} characters"
              )

          with open(
              "ocr_pages.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "OCR complete."
          )

          print(
              "Pages:",
              len(results)
          )
          PY

      # ==========================================
      # 8. Extract facts using Gemini
      # ==========================================
      - name: Extract verified facts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python extract_facts.py

      # ==========================================
      # 9. Display result
      # ==========================================
      - name: Display verified facts
        run: |
          python - <<'PY'
          import json

          with open(
              "verified_facts.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          facts = data.get(
              "facts",
              []
          )

          print()
          print("=" * 70)
          print(
              "VERIFIED FACTS:",
              len(facts)
          )
          print("=" * 70)

          for i, item in enumerate(
              facts,
              1
          ):

              print()
              print(
                  f"{i}. {item.get('fact', '')}"
              )

              print(
                  "   Category:",
                  item.get(
                      "category",
                      ""
                  )
              )

              print(
                  "   Page:",
                  item.get(
                      "page",
                      ""
                  )
              )

              print(
                  "   Evidence:",
                  item.get(
                      "evidence",
                      ""
                  )
              )
          PY

      # ==========================================
      # 10. Upload results
      # ==========================================
      - name: Upload extraction results
        uses: actions/upload-artifact@v4
        with:
          name: sujas-fact-extraction
          path: |
            sujas_today.pdf
            sujas_metadata.json
            ocr_pages.json
            verified_facts.json
