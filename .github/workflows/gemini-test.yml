name: Gemini PDF Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U google-genai

      - name: Test Gemini PDF Processing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          from google import genai
          from google.genai import types

          API_KEY = os.environ["GEMINI_API_KEY"]

          # Current Sujas PDF
          PDF_FILE = "sujas_today.pdf"

          if not os.path.exists(PDF_FILE):
              raise FileNotFoundError(
                  f"{PDF_FILE} नहीं मिला। Repository/workflow में PDF उपलब्ध नहीं है."
              )

          client = genai.Client(api_key=API_KEY)

          # पहले तेज/current model, फिर fallbacks
          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-2.5-flash",
          ]

          prompt = r"""
          इस PDF को राजस्थान प्रतियोगी परीक्षाओं के Current Affairs के लिए पढ़ो।

          केवल PDF में दी गई जानकारी का उपयोग करना है।
          PDF के बाहर की कोई जानकारी मत जोड़ना।

          राजस्थान से संबंधित महत्वपूर्ण:
          - नियुक्तियाँ
          - योजनाएँ
          - नीतियाँ
          - सरकारी कार्यक्रम
          - पुरस्कार
          - खेल
          - महत्वपूर्ण व्यक्ति
          - स्थान/घटनाएँ
          - बजट/अर्थव्यवस्था
          - कृषि
          - शिक्षा
          - स्वास्थ्य
          - पर्यावरण
          - उद्योग/निवेश
          - infrastructure/development
          - reports/indices
          - science & technology
          - AI/digital
          - अन्य परीक्षा-उपयोगी तथ्य

          Technology/Science & Technology से संबंधित महत्वपूर्ण राष्ट्रीय तथ्य भी
          शामिल किए जा सकते हैं।

          सामान्य राष्ट्रीय समाचार तभी शामिल करो जब वे Science & Technology,
          AI, Digital, Space या किसी स्पष्ट exam-relevant technology topic से
          संबंधित हों।

          प्रत्येक महत्वपूर्ण तथ्य से एक MCQ बनाओ।

          JSON में केवल यह structure दो:

          {
            "questions": [
              {
                "question": "...",
                "options": {
                  "A": "...",
                  "B": "...",
                  "C": "...",
                  "D": "..."
                },
                "answer": "A",
                "explanation": "...",
                "category": "Rajasthan Current Affairs",
                "source_page": "..."
              }
            ]
          }

          नियम:
          1. सही उत्तर PDF से verify होना चाहिए।
          2. अनुमान लगाकर प्रश्न मत बनाना।
          3. Duplicate questions मत बनाना।
          4. जितने महत्वपूर्ण exam-oriented facts PDF में मिलें, उन्हें
             questions में cover करो।
          5. उत्तर केवल A/B/C/D में हो।
          6. source_page में PDF का page number दो।
          7. Output valid JSON होना चाहिए।
          """

          schema = {
              "type": "object",
              "properties": {
                  "questions": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "question": {"type": "string"},
                              "options": {
                                  "type": "object",
                                  "properties": {
                                      "A": {"type": "string"},
                                      "B": {"type": "string"},
                                      "C": {"type": "string"},
                                      "D": {"type": "string"},
                                  },
                                  "required": ["A", "B", "C", "D"],
                              },
                              "answer": {
                                  "type": "string",
                                  "enum": ["A", "B", "C", "D"],
                              },
                              "explanation": {"type": "string"},
                              "category": {"type": "string"},
                              "source_page": {"type": "string"},
                          },
                          "required": [
                              "question",
                              "options",
                              "answer",
                              "explanation",
                              "category",
                              "source_page",
                          ],
                      },
                  }
              },
              "required": ["questions"],
          }

          # PDF पढ़ो
          with open(PDF_FILE, "rb") as f:
              pdf_bytes = f.read()

          print(f"PDF SIZE: {len(pdf_bytes):,} bytes")
          print()

          last_error = None

          for model in MODELS:
              print("=" * 70)
              print(f"TRYING MODEL: {model}")
              print("=" * 70)

              # हर model पर अधिकतम 3 attempts
              for attempt in range(1, 4):
                  print(f"Attempt {attempt}/3")

                  try:
                      response = client.models.generate_content(
                          model=model,
                          contents=[
                              types.Part.from_bytes(
                                  data=pdf_bytes,
                                  mime_type="application/pdf",
                              ),
                              prompt,
                          ],
                          config=types.GenerateContentConfig(
                              temperature=0.1,
                              response_mime_type="application/json",
                              response_schema=schema,
                          ),
                      )

                      text = response.text

                      if not text:
                          raise RuntimeError("Gemini ने empty response दिया।")

                      # JSON validate
                      result = json.loads(text)

                      questions = result.get("questions", [])

                      if not isinstance(questions, list):
                          raise RuntimeError(
                              "Gemini response में questions list नहीं मिली।"
                          )

                      print()
                      print(f"SUCCESS: {model}")
                      print(f"QUESTIONS GENERATED: {len(questions)}")
                      print()

                      with open("gemini_result.json", "w", encoding="utf-8") as f:
                          json.dump(
                              result,
                              f,
                              ensure_ascii=False,
                              indent=2,
                          )

                      print("Saved: gemini_result.json")
                      print()
                      print(json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )[:5000])

                      raise SystemExit(0)

                  except Exception as e:
                      last_error = e
                      error_text = str(e)

                      print(f"FAILED: {error_text}")

                      # 503/429/5xx पर retry
                      retryable = any(
                          code in error_text
                          for code in [
                              "503",
                              "UNAVAILABLE",
                              "429",
                              "RESOURCE_EXHAUSTED",
                              "500",
                              "502",
                              "504",
                              "INTERNAL",
                              "DEADLINE",
                          ]
                      )

                      if retryable and attempt < 3:
                          wait_time = 10 * (2 ** (attempt - 1))
                          print(
                              f"Temporary Gemini error. "
                              f"Waiting {wait_time}s..."
                          )
                          time.sleep(wait_time)
                      else:
                          break

              print()
              print(f"Model {model} failed. Switching to next model...")
              print()

          print("=" * 70)
          print("ALL GEMINI MODELS FAILED")
          print("=" * 70)

          raise RuntimeError(
              f"Gemini processing failed on all fallback models. "
              f"Last error: {last_error}"
          )

      - name: Upload Gemini result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-result
          path: gemini_result.json
          retention-days: 7
