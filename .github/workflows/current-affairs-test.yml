name: Current Affairs Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          BOT_TOKEN: ${{ secrets.CURRENT_AFFAIRS_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = {
              "chat_id": "@yourbuddyravindrachoudhary",
              "text": "🤖 Current Affairs Bot\n\n✅ Bot successfully connected!\n\nअब Daily Current Affairs system बनाने के लिए तैयार है।"
          }

          response = requests.post(url, data=data, timeout=30)
          print(response.text)

          if not response.ok:
              raise SystemExit("Telegram message failed")
          PY
