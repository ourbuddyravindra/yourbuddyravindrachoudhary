name: Meridian Video Content Test

on:
  workflow_dispatch:

jobs:
  test-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest video content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["YOUTUBE_API_KEY"]

          # Meridian Academy channel
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": key
              },
              timeout=20
          )
          r.raise_for_status()

          channel = r.json()["items"][0]
          uploads = channel["contentDetails"]["relatedPlaylists"]["uploads"]

          # Latest uploaded video
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "contentDetails",
                  "playlistId": uploads,
                  "maxResults": 1,
                  "key": key
              },
              timeout=20
          )
          r.raise_for_status()

          video_id = r.json()["items"][0]["contentDetails"]["videoId"]

          # Full video metadata
          r = requests.get(
              "https://www.googleapis.com/youtube/v3/videos",
              params={
                  "part": "snippet,contentDetails",
                  "id": video_id,
                  "key": key
              },
              timeout=20
          )
          r.raise_for_status()

          video = r.json()["items"][0]
          snippet = video["snippet"]

          print("================================")
          print("VIDEO TITLE:")
          print(snippet["title"])
          print()
          print("PUBLISHED:")
          print(snippet["publishedAt"])
          print()
          print("DESCRIPTION:")
          print(snippet["description"])
          print()
          print("VIDEO URL:")
          print(f"https://www.youtube.com/watch?v={video_id}")
          print("================================")
          PY
