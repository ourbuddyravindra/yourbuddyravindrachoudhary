name: Rajasthan Sujas Auto Upload

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21,22,23 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '17 0 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

jobs:
  sujas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Check and upload latest Sujas
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from datetime import datetime
          from urllib.parse import urljoin
          import requests

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          CHANNEL = "@yourbuddyravindrachoudhary"
          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"
          STATE_FILE = "latest_sujas_key.txt"

          if not BOT_TOKEN:
              raise RuntimeError("BOT_TOKEN GitHub secret is missing or empty")

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 100,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (compatible; SujasAutoUpload/1.0)"})

          print("Fetching Sujas records from Rajasthan DIPR...")
          response = session.post(API, json=payload, timeout=(20, 90))
          response.raise_for_status()
          data = response.json()

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          def first_value(record, keys):
              for key in keys:
                  value = record.get(key)
                  if value not in (None, ""):
                      return value
              return ""

          def find_pdf_url(obj):
              found = []
              for item in walk(obj):
                  for key, value in item.items():
                      if not isinstance(value, str):
                          continue
                      value = value.strip()
                      if ".pdf" not in value.lower():
                          continue
                      if value.startswith("//"):
                          value = "https:" + value
                      elif value.startswith("/"):
                          value = urljoin("https://dipr.rajasthan.gov.in", value)
                      if value.lower().startswith(("http://", "https://")):
                          found.append(value)
              # Prefer the direct PDF attachment URL and remove duplicate URLs.
              return list(dict.fromkeys(found))

          records = []
          seen = set()
          for record in walk(data):
              title = str(first_value(record, ("Title", "title", "Subject", "subject", "Name", "name"))).strip()
              if not title or not ("sujas" in title.lower() or "सुजस" in title):
                  continue
              urls = find_pdf_url(record)
              if not urls:
                  continue
              ident = str(first_value(record, ("Id", "ID", "OrderId", "orderId", "id"))).strip()
              date_text = str(first_value(record, (
                  "PublishDate", "PublicationDate", "EntryDate", "CreatedDate",
                  "CreatedOn", "Date", "OrderDate", "UpdatedDate"
              ))).strip()
              signature = (ident, title, urls[0])
              if signature in seen:
                  continue
              seen.add(signature)
              records.append({
                  "id": ident,
                  "title": title,
                  "url": urls[0],
                  "date": date_text
              })

          if not records:
              print("Top-level response keys:", list(data.keys()) if isinstance(data, dict) else type(data).__name__)
              raise RuntimeError("No Sujas record with a PDF attachment was found in the DIPR API response")

          def sort_key(item):
              date_value = item["date"]
              parsed = 0.0
              if date_value:
                  try:
                      parsed = datetime.fromisoformat(date_value.replace("Z", "+00:00")).timestamp()
                  except Exception:
                      try:
                          parsed = datetime.strptime(date_value[:10], "%d/%m/%Y").timestamp()
                      except Exception:
                          pass
              numeric_id = int(item["id"]) if item["id"].isdigit() else 0
              return (parsed, numeric_id)

          records.sort(key=sort_key, reverse=True)
          latest = records[0]
          current_key = latest["id"] + "|" + latest["url"]

          print("Candidate Sujas PDFs:", len(records))
          print("Selected title:", latest["title"])
          print("Selected ID:", latest["id"] or "(not supplied by API)")
          print("Selected attachment:", latest["url"])

          old_key = ""
          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as state:
                  old_key = state.read().strip()

          if old_key == current_key:
              print("This Sujas PDF has already been uploaded. Nothing to do.")
              sys.exit(0)

          print("Downloading the selected PDF...")
          pdf_response = session.get(latest["url"], timeout=(20, 180), allow_redirects=True)
          pdf_response.raise_for_status()
          pdf_bytes = pdf_response.content
          if len(pdf_bytes) < 1000 or b"%PDF-" not in pdf_bytes[:1024]:
              content_type = pdf_response.headers.get("Content-Type", "unknown")
              raise RuntimeError(
                  f"Attachment is not a valid PDF (size={len(pdf_bytes)}, content-type={content_type})"
              )

          with open("sujas.pdf", "wb") as pdf_file:
              pdf_file.write(pdf_bytes)
          print("PDF downloaded:", len(pdf_bytes), "bytes")

          print("Uploading PDF to Telegram channel...")
          telegram_url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendDocument"
          with open("sujas.pdf", "rb") as pdf_file:
              telegram_response = session.post(
                  telegram_url,
                  data={"chat_id": CHANNEL, "caption": f"📚 {latest['title']}"},
                  files={"document": ("Sujas.pdf", pdf_file, "application/pdf")},
                  timeout=(30, 240)
              )

          telegram_response.raise_for_status()
          telegram_result = telegram_response.json()
          if not telegram_result.get("ok"):
              raise RuntimeError(f"Telegram upload failed: {telegram_result}")

          message_id = telegram_result.get("result", {}).get("message_id")
          print("Upload successful. Telegram message ID:", message_id)

          # Update deduplication state only after Telegram confirms success.
          with open(STATE_FILE, "w", encoding="utf-8") as state:
              state.write(current_key + "\\n")
          print("Saved latest Sujas upload state.")
          PY

      - name: Save upload state
        run: |
          if git diff --quiet -- latest_sujas_key.txt; then
            echo "No new upload state to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest_sujas_key.txt
            git commit -m "Save latest Sujas upload state"
            git push
          fi
