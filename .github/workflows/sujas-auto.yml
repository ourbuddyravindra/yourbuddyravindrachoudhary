name: Rajasthan Sujas Auto Upload

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21,22,23 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '17 0 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  sujas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Check and upload Sujas
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import re

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHANNEL = "@yourbuddyravindrachoudhary"

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 50,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          print("🔎 Sujas check ho raha hai...")

          r = requests.post(API, json=payload, timeout=60)
          r.raise_for_status()
          data = r.json()

          def find_pdf(obj):
              if isinstance(obj, dict):
                  for value in obj.values():
                      if isinstance(value, str):
                          if ".pdf" in value.lower() and value.startswith("http"):
                              return value
                      result = find_pdf(value)
                      if result:
                          return result

              elif isinstance(obj, list):
                  for item in obj:
                      result = find_pdf(item)
                      if result:
                          return result

              return None

          def find_records(obj):
              records = []

              if isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, dict):
                          records.append(item)
                      records.extend(find_records(item))

              elif isinstance(obj, dict):
                  for value in obj.values():
                      if isinstance(value, (dict, list)):
                          records.extend(find_records(value))

              return records

          records = find_records(data)

          print("📦 Records:", len(records))

          sujas = []

          for record in records:
              title = str(
                  record.get("Title")
                  or record.get("title")
                  or ""
              )

              pdf = find_pdf(record)

              if pdf and (
                  "sujas" in title.lower()
                  or "सुजस" in title
              ):
                  sujas.append((record, title, pdf))

          if not sujas:
              raise Exception("❌ Sujas PDF नहीं मिली")

          # API सामान्यतः newest पहले देता है
          latest, title, pdf_url = sujas[0]

          order_id = str(
              latest.get("Id")
              or latest.get("ID")
              or latest.get("OrderId")
              or latest.get("orderId")
              or ""
          )

          print("📰 Title:", title)
          print("🆔 ID:", order_id)
          print("📄 PDF:", pdf_url)

          current_key = order_id + "|" + pdf_url

          state_file = "latest_sujas_key.txt"

          old_key = ""

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  old_key = f.read().strip()

          if old_key == current_key:
              print("⏭️ यह Sujas पहले ही upload हो चुकी है.")
              raise SystemExit(0)

          print("⬇️ PDF download हो रही है...")

          pdf = requests.get(
              pdf_url,
              timeout=180,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          pdf.raise_for_status()

          with open("sujas.pdf", "wb") as f:
              f.write(pdf.content)

          print("📦 PDF size:", len(pdf.content), "bytes")

          print("📤 Telegram पर upload हो रही है...")

          telegram_url = (
              f"https://api.telegram.org/bot{BOT_TOKEN}/sendDocument"
          )

          with open("sujas.pdf", "rb") as f:
              response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHANNEL,
                      "caption": f"📚 {title}"
                  },
                  files={
                      "document": (
                          "sujas.pdf",
                          f,
                          "application/pdf"
                      )
                  },
                  timeout=240
              )

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise Exception(result)

          print("🎉 Sujas successfully Telegram पर upload हो गई!")

          with open(state_file, "w", encoding="utf-8") as f:
              f.write(current_key)

          PY

      - name: Save state
        run: |
          if git diff --quiet -- latest_sujas_key.txt; then
            echo "No new state."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest_sujas_key.txt
            git commit -m "Save latest Sujas state"
            git push
          fi
