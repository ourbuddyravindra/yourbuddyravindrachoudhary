name: Sujas YouTube Shorts

on:
  workflow_run:
    workflows:
      - "Sujas Current Affairs Bot V2"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sujas-youtube-shorts
  cancel-in-progress: false

env:
  TELEGRAM_CHANNEL: "https://t.me/yourbuddyravindrachoudhary"

jobs:
  youtube:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Build vertical Shorts video
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          state_path = Path("current_affairs_sujas_state.txt")
          json_path = Path("current_affairs.json")
          yt_state_path = Path("youtube_sujas_state.txt")
          telegram = "https://t.me/yourbuddyravindrachoudhary"

          if not state_path.exists():
              raise SystemExit("current_affairs_sujas_state.txt नहीं मिला")
          if not json_path.exists():
              raise SystemExit("current_affairs.json नहीं मिला")

          current_key = state_path.read_text(encoding="utf-8").strip()
          old_key = yt_state_path.read_text(encoding="utf-8").strip() if yt_state_path.exists() else ""
          if current_key and current_key == old_key:
              print("यह Sujas पहले YouTube पर process हो चुकी है — कुछ upload नहीं किया जाएगा।")
              raise SystemExit(0)

          data = json.loads(json_path.read_text(encoding="utf-8"))
          items = data.get("items", []) if isinstance(data, dict) else []
          if not isinstance(items, list) or not items:
              raise SystemExit("current_affairs.json में MCQs नहीं मिले")
          items = items[:10]

          # IMPORTANT: Devanagari-only fonts do not contain Latin glyphs.
          # Use Devanagari for Hindi runs and DejaVu Sans for English/numbers/URLs.
          hi_path = "/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf"
          hi_bold_path = "/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf"
          en_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          en_bold_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          for p in [hi_path, hi_bold_path, en_path, en_bold_path]:
              if not Path(p).exists():
                  raise SystemExit(f"Font नहीं मिला: {p}")

          W, H = 1080, 1920
          out = Path("youtube_frames")
          out.mkdir(exist_ok=True)

          def font(size, bold=False, hindi=True):
              if hindi:
                  return ImageFont.truetype(hi_bold_path if bold else hi_path, size)
              return ImageFont.truetype(en_bold_path if bold else en_path, size)

          def is_hi(ch):
              o = ord(ch)
              return 0x0900 <= o <= 0x097F

          def runs(text, size, bold):
              text = str(text or "")
              result = []
              if not text:
                  return result
              start = 0
              current = is_hi(text[0])
              for i, ch in enumerate(text[1:], 1):
                  kind = is_hi(ch)
                  if kind != current:
                      result.append((text[start:i], font(size, bold, current)))
                      start = i
                      current = kind
              result.append((text[start:], font(size, bold, current)))
              return result

          def text_width(text, size, bold):
              total = 0
              for part, fnt in runs(text, size, bold):
                  box = fnt.getbbox(part)
                  total += box[2] - box[0]
              return total

          def draw_mixed(draw, xy, text, size, bold, fill):
              x, y = xy
              for part, fnt in runs(text, size, bold):
                  draw.text((x, y), part, font=fnt, fill=fill)
                  box = fnt.getbbox(part)
                  x += box[2] - box[0]

          def wrap(draw, text, size, bold, max_width):
              words = str(text or "").replace("\n", " ").split()
              lines, cur = [], ""
              for word in words:
                  test = word if not cur else cur + " " + word
                  if text_width(test, size, bold) <= max_width:
                      cur = test
                  else:
                      if cur:
                          lines.append(cur)
                      cur = word
              if cur:
                  lines.append(cur)
              return lines

          def make_slide(path, heading, body_lines, footer="Source: Sujas"):
              img = Image.new("RGB", (W, H), (18, 22, 30))
              draw = ImageDraw.Draw(img)
              margin = 70
              y = 90
              draw.rounded_rectangle((45, 45, W-45, H-45), radius=35, outline=(90, 110, 145), width=4)

              for line in wrap(draw, heading, 52, True, W - 2*margin):
                  draw_mixed(draw, (margin, y), line, 52, True, (255, 215, 80))
                  y += 70
              y += 25

              for text, size, bold, fill in body_lines:
                  for line in wrap(draw, text, size, bold, W - 2*margin):
                      if y > H - 250:
                          break
                      draw_mixed(draw, (margin, y), line, size, bold, fill)
                      y += size + 18
                  y += 18

              fy = H - 150
              for line in wrap(draw, footer, 30, False, W - 2*margin)[:2]:
                  draw_mixed(draw, (margin, fy), line, 30, False, (190, 200, 215))
                  fy += 42
              img.save(path, quality=95)

          make_slide(
              out / "000.png",
              "Sujas Current Affairs",
              [("राजस्थान प्रतियोगी परीक्षाओं के लिए", 46, False, (235, 240, 250)),
               (f"आज के {len(items)} महत्वपूर्ण MCQs", 66, True, (255, 255, 255))]
          )

          for i, item in enumerate(items, start=1):
              body = [
                  (f"{i}. {item.get('question','')}", 45, True, (255,255,255)),
                  (f"A) {item.get('option_a','')}", 38, False, (225,230,240)),
                  (f"B) {item.get('option_b','')}", 38, False, (225,230,240)),
                  (f"C) {item.get('option_c','')}", 38, False, (225,230,240)),
                  (f"D) {item.get('option_d','')}", 38, False, (225,230,240)),
                  (f"सही उत्तर: {str(item.get('answer','')).upper()}", 42, True, (110,235,155)),
                  (f"व्याख्या: {item.get('explanation','')}", 32, False, (215,220,230)),
              ]
              make_slide(out / f"{i:03d}.png", str(item.get("category", "Current Affairs")), body)

          # Final promotion slide. No emoji here because the image fonts are intentionally controlled.
          make_slide(
              out / "999.png",
              "DAILY NOTES & CURRENT AFFAIRS",
              [("ऐसे ही रोज़ के Notes और MCQs के लिए", 44, False, (235,240,250)),
               ("Telegram Channel से जुड़ें", 62, True, (255,255,255)),
               (telegram, 34, True, (110,210,255))],
              telegram
          )

          concat = Path("concat.txt")
          with concat.open("w", encoding="utf-8") as f:
              f.write("file 'youtube_frames/000.png'\n")
              f.write("duration 3\n")
              for i in range(1, len(items) + 1):
                  f.write(f"file 'youtube_frames/{i:03d}.png'\n")
                  f.write("duration 5.5\n")
              f.write("file 'youtube_frames/999.png'\n")
              f.write("duration 4\n")
              f.write("file 'youtube_frames/999.png'\n")

          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(concat),
              "-vf", "format=yuv420p", "-r", "30", "-c:v", "libx264", "-preset", "veryfast",
              "-crf", "20", "-movflags", "+faststart", "sujas_silent.mp4"
          ], check=True)

          # Original low-volume instrumental bed, generated locally with FFmpeg.
          music_filter = (
              "sine=frequency=261.63:duration=90[s1];"
              "sine=frequency=329.63:duration=90[s2];"
              "sine=frequency=392.00:duration=90[s3];"
              "sine=frequency=523.25:duration=90[s4];"
              "[s1][s2][s3][s4]amix=inputs=4:duration=longest,"
              "volume=0.035,afade=t=in:st=0:d=1,afade=t=out:st=87:d=3[a]"
          )
          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi", "-i", "anullsrc=r=48000:cl=stereo",
              "-filter_complex", music_filter, "-map", "[a]", "-t", "90",
              "-c:a", "aac", "-b:a", "96k", "background_music.m4a"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-y", "-i", "sujas_silent.mp4", "-i", "background_music.m4a",
              "-filter_complex", "[1:a]volume=0.45[a]",
              "-map", "0:v:0", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", "-shortest",
              "-movflags", "+faststart", "sujas_current_affairs_short.mp4"
          ], check=True)
          PY

      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ.get("YOUTUBE_CLIENT_ID", "").strip()
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN", "").strip()
          if not client_id or not client_secret or not refresh_token:
              raise SystemExit("YouTube OAuth secrets missing: YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN")

          creds = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          creds.refresh(Request())
          youtube = build("youtube", "v3", credentials=creds)

          state = Path("current_affairs_sujas_state.txt").read_text(encoding="utf-8").strip()
          telegram = "https://t.me/yourbuddyravindrachoudhary"
          body = {
              "snippet": {
                  "title": "Sujas Current Affairs | 10 Important MCQs | Rajasthan #Shorts",
                  "description": (
                      "राजस्थान प्रतियोगी परीक्षाओं के लिए Sujas Current Affairs के महत्वपूर्ण MCQs।\n\n"
                      "📚 रोज़ के Notes और Current Affairs के लिए Telegram Channel:\n"
                      f"{telegram}\n\n"
                      "#Sujas #RajasthanCurrentAffairs #RajasthanGK #CurrentAffairs #RPSC #RSSB #Shorts"
                  ),
                  "tags": ["Sujas", "Rajasthan Current Affairs", "Rajasthan GK", "Current Affairs", "RPSC", "RSSB", "Shorts", "Telegram"],
                  "categoryId": "27",
                  "defaultLanguage": "hi"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False,
                  "license": "youtube",
                  "embeddable": True,
                  "publicStatsViewable": True
              }
          }

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload("sujas_current_affairs_short.mp4", mimetype="video/mp4", chunksize=-1, resumable=True),
              notifySubscribers=True
          )
          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress()*100)}%")

          video_id = response["id"]
          print("YouTube upload successful:", video_id)
          print("https://www.youtube.com/watch?v=" + video_id)
          Path("youtube_sujas_state.txt").write_text(state, encoding="utf-8")
          PY

      - name: Save YouTube state
        run: |
          if git diff --quiet -- youtube_sujas_state.txt; then
            echo "No YouTube state change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube_sujas_state.txt
            git commit -m "Save Sujas YouTube upload state"
            git push
          fi
