name: Meridian Rajasthan Video Monitor

on:
  schedule:
    - cron: '7,37 * * * *'
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meridian-rajasthan-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect new Rajasthan video
        id: detect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          KEY = os.environ["YOUTUBE_API_KEY"]
          STATE_FILE = Path("meridian_latest_video.txt")

          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          data = r.json()

          if not data.get("items"):
              raise SystemExit("❌ Meridian Academy channel नहीं मिला")

          uploads = data["items"][0]["contentDetails"][
              "relatedPlaylists"
          ]["uploads"]

          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "snippet,contentDetails",
                  "playlistId": uploads,
                  "maxResults": 10,
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          items = r.json().get("items", [])

          selected = None

          for item in items:
              title = item["snippet"]["title"]
              t = title.lower()

              if (
                  "rajasthan current affairs" in t
                  or ("rajasthan" in t and "sujas" in t)
              ):
                  selected = item
                  break

          if selected is None:
              raise SystemExit(
                  "❌ Rajasthan Current Affairs video नहीं मिला"
              )

          video_id = selected["contentDetails"]["videoId"]
          title = selected["snippet"]["title"]
          published = selected["contentDetails"].get(
              "videoPublishedAt",
              selected["snippet"]["publishedAt"]
          )

          old_id = ""

          if STATE_FILE.exists():
              old_id = STATE_FILE.read_text(
                  encoding="utf-8"
              ).strip()

          print("OLD VIDEO:", old_id or "NONE")
          print("NEW VIDEO:", video_id)
          print("TITLE:", title)
          print("PUBLISHED:", published)

          if old_id == video_id:
              print("⏭️ SAME VIDEO")
              print("NEW_VIDEO=false")
          else:
              print("🆕 NEW VIDEO")
              print("NEW_VIDEO=true")

              STATE_FILE.write_text(
                  video_id,
                  encoding="utf-8"
              )

              # GitHub Actions outputs
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("new_video=true\n")
                  f.write(f"video_id={video_id}\n")
                  f.write(f"title<<EOF\n{title}\nEOF\n")
                  f.write(f"published={published}\n")

          PY

      - name: Save new video state
        run: |
          git add meridian_latest_video.txt

          if git diff --cached --quiet; then
            echo "⏭️ No state change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Meridian Rajasthan video"
            git push

            echo "✅ State committed."
          fi
