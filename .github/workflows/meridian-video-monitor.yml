name: Meridian Rajasthan Video Monitor

on:
  schedule:
    - cron: '7,37 * * * *'
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meridian-rajasthan-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect latest Rajasthan video
        id: detect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          KEY = os.environ["YOUTUBE_API_KEY"]
          STATE_FILE = Path("meridian_latest_video.txt")

          r = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={
                  "part": "contentDetails",
                  "forHandle": "meridian.academy",
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          data = r.json()

          if not data.get("items"):
              raise SystemExit("❌ Meridian Academy channel नहीं मिला")

          uploads = data["items"][0]["contentDetails"][
              "relatedPlaylists"
          ]["uploads"]

          r = requests.get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              params={
                  "part": "snippet,contentDetails",
                  "playlistId": uploads,
                  "maxResults": 10,
                  "key": KEY
              },
              timeout=20
          )
          r.raise_for_status()

          items = r.json().get("items", [])

          selected = None

          for item in items:
              title = item["snippet"]["title"]
              title_lower = title.lower()

              if (
                  "rajasthan current affairs" in title_lower
                  or (
                      "rajasthan" in title_lower
                      and "sujas" in title_lower
                  )
              ):
                  selected = item
                  break

          if selected is None:
              raise SystemExit(
                  "❌ Rajasthan Current Affairs video नहीं मिला"
              )

          video_id = selected["contentDetails"]["videoId"]
          title = selected["snippet"]["title"]
          published = selected["contentDetails"].get(
              "videoPublishedAt",
              selected["snippet"]["publishedAt"]
          )

          video_url = f"https://www.youtube.com/watch?v={video_id}"

          old_id = ""

          if STATE_FILE.exists():
              old_id = STATE_FILE.read_text(
                  encoding="utf-8"
              ).strip()

          print("========================================")
          print("MERIDIAN RAJASTHAN VIDEO MONITOR")
          print("========================================")
          print("OLD VIDEO ID:", old_id or "NONE")
          print("NEW VIDEO ID:", video_id)
          print("TITLE:", title)
          print("PUBLISHED:", published)
          print("========================================")

          if old_id == video_id:
              print("⏭️ SAME VIDEO — NOTHING TO DO")
              print("NEW_VIDEO=false")

          else:
              print("🆕 NEW RAJASTHAN VIDEO FOUND")

              STATE_FILE.write_text(
                  video_id,
                  encoding="utf-8"
              )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("new_video=true\n")
                  f.write(f"video_id={video_id}\n")
                  f.write(f"video_url={video_url}\n")
                  f.write(f"published={published}\n")
                  f.write("title<<EOF\n")
                  f.write(title + "\n")
                  f.write("EOF\n")

          PY

      - name: Save video state
        run: |
          git add meridian_latest_video.txt

          if git diff --cached --quiet; then
            echo "⏭️ No state change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Meridian Rajasthan video"
            git push

            echo "✅ State committed."
          fi

      - name: Send Telegram notification
        if: steps.detect.outputs.new_video == 'true'
        env:
          CURRENT_AFFAIRS_BOT_TOKEN: ${{ secrets.CURRENT_AFFAIRS_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@yourbuddyravindrachoudhary"
          VIDEO_TITLE: ${{ steps.detect.outputs.title }}
          VIDEO_URL: ${{ steps.detect.outputs.video_url }}
          PUBLISHED: ${{ steps.detect.outputs.published }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["CURRENT_AFFAIRS_BOT_TOKEN"]
          channel = os.environ["TELEGRAM_CHANNEL"]
          title = os.environ["VIDEO_TITLE"]
          video_url = os.environ["VIDEO_URL"]

          message = (
              "🆕 <b>नई Rajasthan Current Affairs Video</b>\n\n"
              f"📚 <b>{title}</b>\n\n"
              f"▶️ <a href=\"{video_url}\">YouTube Video देखें</a>\n\n"
              "🤖 Meridian Academy Monitor"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              json={
                  "chat_id": channel,
                  "text": message,
                  "parse_mode": "HTML"
              },
              timeout=20
          )

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise SystemExit(
                  f"❌ Telegram error: {result}"
              )

          print("✅ Telegram notification sent successfully")
          PY
