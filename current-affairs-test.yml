name: Current Affairs - Fact Extraction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-facts:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Setup Python
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ============================================
      # 3. Install OCR tools
      # ============================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng

      # ============================================
      # 4. Install Python packages
      # ============================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      # ============================================
      # 5. Download latest Sujas PDF
      # ============================================
      - name: Download latest Sujas
        shell: python
        run: |
          import requests
          import json
          import sys
          import re
          from datetime import datetime

          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          print("Calling DIPR API...")

          response = requests.post(
              API,
              json=payload,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          print("DIPR API response received.")

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          sujas = []

          for item in walk(data):

              if not isinstance(item, dict):
                  continue

              title = str(
                  item.get("Title") or ""
              ).strip()

              if "सुजस" not in title:
                  continue

              attachments = item.get(
                  "AttachmentList"
              )

              if not isinstance(
                  attachments,
                  list
              ):
                  continue

              for attachment in attachments:

                  if not isinstance(
                      attachment,
                      dict
                  ):
                      continue

                  path = (
                      attachment.get("Path")
                      or attachment.get("path")
                  )

                  if not path:
                      continue

                  sujas.append({
                      "id": item.get("Id"),
                      "title": title,
                      "date": item.get("Date"),
                      "path": path,
                      "attachment_name": attachment.get(
                          "AttachmentsName"
                      )
                  })

          print(
              "Sujas candidates:",
              len(sujas)
          )

          if not sujas:
              print("ERROR: Sujas PDF not found.")
              sys.exit(1)

          def sort_key(item):

              date_value = str(
                  item.get("date") or ""
              )

              try:
                  parsed = datetime.fromisoformat(
                      date_value.replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  timestamp = parsed.timestamp()

              except Exception:
                  timestamp = 0

              try:
                  item_id = int(
                      item.get("id") or 0
                  )

              except Exception:
                  item_id = 0

              return (
                  timestamp,
                  item_id
              )

          sujas.sort(
              key=sort_key,
              reverse=True
          )

          selected = sujas[0]

          pdf_url = str(
              selected["path"]
          ).strip()

          match = re.search(
              r"\]\((https?://[^)]+)\)",
              pdf_url
          )

          if match:
              pdf_url = match.group(1)

          if not (
              pdf_url.startswith("http://")
              or
              pdf_url.startswith("https://")
          ):
              print(
                  "ERROR: Invalid PDF URL:"
              )
              print(pdf_url)
              sys.exit(1)

          selected["pdf_url"] = pdf_url

          print()
          print("========================================")
          print("SELECTED SUJAS")
          print("========================================")
          print(
              json.dumps(
                  selected,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()
          print("Downloading PDF...")

          pdf_response = requests.get(
              pdf_url,
              timeout=180,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          pdf_response.raise_for_status()

          content = pdf_response.content

          print(
              "Downloaded bytes:",
              len(content)
          )

          if not content.startswith(
              b"%PDF"
          ):
              print(
                  "ERROR: Downloaded file is not a PDF."
              )
              sys.exit(1)

          with open(
              "sujas_today.pdf",
              "wb"
          ) as f:
              f.write(content)

          with open(
              "sujas_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "SUCCESS: Sujas PDF downloaded."
          )

      # ============================================
      # 6. PDF → JPG
      # ============================================
      - name: Convert PDF to images
        run: |
          rm -rf pages
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 250 \
            -jpegopt quality=95 \
            sujas_today.pdf \
            pages/page

          echo "Pages generated:"
          ls -lh pages/

      # ============================================
      # 7. OCR
      # ============================================
      - name: OCR pages
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          images = sorted(
              Path("pages").glob("page-*.jpg")
          )

          if not images:
              print("ERROR: No page images found.")
              sys.exit(1)

          results = []

          for image in images:

              try:
                  page_number = int(
                      image.stem.split("-")[-1]
                  )

              except Exception:
                  continue

              print(
                  f"OCR page {page_number}..."
              )

              result = subprocess.run(
                  [
                      "tesseract",
                      str(image),
                      "stdout",
                      "-l",
                      "hin+eng",
                      "--psm",
                      "3"
                  ],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace"
              )

              text = result.stdout.strip()

              results.append({
                  "page": page_number,
                  "text": text
              })

              print(
                  f"Page {page_number}: "
                  f"{len(text)} characters"
              )

          with open(
              "ocr_pages.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("OCR completed.")
          print(
              "Total pages:",
              len(results)
          )

      # ============================================
      # 8. Gemini FACT EXTRACTION
      # ============================================
      - name: Extract verified facts
        shell: python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          import os
          import json
          import time
          import sys
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get(
              "GEMINI_API_KEY"
          )

          MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.5-flash-lite"
          )

          if not API_KEY:
              print(
                  "ERROR: GEMINI_API_KEY secret is missing."
              )
              sys.exit(1)

          print(
              "Gemini model:",
              MODEL
          )

          client = genai.Client(
              api_key=API_KEY
          )

          schema = {
              "type": "object",
              "properties": {
                  "facts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "fact": {
                                  "type": "string"
                              },
                              "category": {
                                  "type": "string"
                              },
                              "page": {
                                  "type": "integer"
                              },
                              "evidence": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "fact",
                              "category",
                              "page",
                              "evidence"
                          ]
                      }
                  }
              },
              "required": [
                  "facts"
              ]
          }

          with open(
              "ocr_pages.json",
              "r",
              encoding="utf-8"
          ) as f:
              pages = json.load(f)

          all_facts = []

          for page_data in pages:

              page_number = int(
                  page_data["page"]
              )

              text = str(
                  page_data.get(
                      "text",
                      ""
                  )
              ).strip()

              if not text:
                  print(
                      f"Page {page_number}: empty OCR."
                  )
                  continue

              print()
              print(
                  "========================================"
              )
              print(
                  f"Processing page {page_number}"
              )
              print(
                  "========================================"
              )

              prompt = (
                  "You are a CURRENT AFFAIRS FACT EXTRACTOR "
                  "for Rajasthan competitive examinations. "
                  "The supplied text is page "
                  + str(page_number)
                  + " of a Rajasthan Government DIPR Sujas e-Bulletin. "
                  "Extract only important exam-oriented facts from this "
                  "OCR text. Use ONLY the supplied OCR text. "
                  "Do NOT use internet, general knowledge, memory, "
                  "assumptions or outside information. "
                  "Do NOT invent unclear names, numbers or words. "
                  "Every fact must belong to page "
                  + str(page_number)
                  + ". Every fact must include short supporting evidence "
                  "from the supplied OCR text. "
                  "Do not create MCQs, options or answers. "
                  "Avoid generic news sentences. "
                  "Prioritize appointments, important persons, schemes, "
                  "programmes, policies, administrative decisions, "
                  "elections, education, health, agriculture, sports, "
                  "awards, economy, budget, environment, science and "
                  "technology, infrastructure, districts, places, "
                  "institutions, important statistics and dates. "
                  "Return facts in Hindi when the source is Hindi. "
                  "Each object must contain fact, category, page and evidence. "
                  "PAGE NUMBER: "
                  + str(page_number)
                  + ". OCR TEXT: "
                  + text
              )

              success = False

              for attempt in range(4):

                  try:

                      print(
                          f"Gemini attempt {attempt + 1}..."
                      )

                      response = client.models.generate_content(
                          model=MODEL,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema=schema,
                              temperature=0.1
                          )
                      )

                      raw = response.text

                      if not raw:
                          raise RuntimeError(
                              "Gemini returned empty response."
                          )

                      data = json.loads(
                          raw
                      )

                      facts = data.get(
                          "facts",
                          []
                      )

                      valid = []

                      for item in facts:

                          if not isinstance(
                              item,
                              dict
                          ):
                              continue

                          fact = str(
                              item.get(
                                  "fact",
                                  ""
                              )
                          ).strip()

                          category = str(
                              item.get(
                                  "category",
                                  ""
                              )
                          ).strip()

                          evidence = str(
                              item.get(
                                  "evidence",
                                  ""
                              )
                          ).strip()

                          try:
                              page = int(
                                  item.get(
                                      "page",
                                      page_number
                                  )
                              )

                          except Exception:
                              page = page_number

                          if not fact:
                              continue

                          if not evidence:
                              continue

                          if page != page_number:
                              continue

                          valid.append({
                              "fact": fact,
                              "category": category,
                              "page": page,
                              "evidence": evidence
                          })

                      print(
                          f"Page {page_number}: "
                          f"{len(valid)} valid facts"
                      )

                      all_facts.extend(
                          valid
                      )

                      success = True
                      break

                  except Exception as error:

                      print(
                          f"Attempt {attempt + 1} failed:"
                      )

                      print(
                          str(error)
                      )

                      if attempt < 3:
                          wait_seconds = 2 ** attempt

                          print(
                              f"Waiting {wait_seconds} seconds..."
                          )

                          time.sleep(
                              wait_seconds
                          )

              if not success:

                  print(
                      f"Page {page_number}: "
                      "Gemini failed after all retries."
                  )

          # ==========================================
          # Remove duplicate facts
          # ==========================================
          unique = []
          seen = set()

          for item in all_facts:

              key = (
                  item["fact"]
                  .strip()
                  .lower()
              )

              if key in seen:
                  continue

              seen.add(key)

              unique.append(
                  item
              )

          output = {
              "source": "Rajasthan Sujas",
              "facts_count": len(unique),
              "facts": unique
          }

          with open(
              "verified_facts.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "============================================================"
          )
          print(
              "TOTAL VERIFIED FACTS:",
              len(unique)
          )
          print(
              "============================================================"
          )

          for index, item in enumerate(
              unique,
              1
          ):

              print()
              print(
                  f"{index}. {item['fact']}"
              )

              print(
                  f"   Category: {item['category']}"
              )

              print(
                  f"   Page: {item['page']}"
              )

              print(
                  f"   Evidence: {item['evidence']}"
              )

      # ============================================
      # 9. Upload all results
      # ============================================
      - name: Upload extraction results
        uses: actions/upload-artifact@v4
        with:
          name: sujas-fact-extraction
          path: |
            sujas_today.pdf
            sujas_metadata.json
            ocr_pages.json
            verified_facts.json
