name: Daily Current Affairs - Fact Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-facts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Create processing script
        shell: bash
        run: |
          cat > process_sujas.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import subprocess
          from pathlib import Path
          from datetime import datetime

          import requests
          from google import genai
          from google.genai import types


          API = "https://dipr.rajasthan.gov.in/webapi/api/OrderPortal/GetAll"

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
          MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.5-flash-lite"
          )

          if not GEMINI_API_KEY:
              raise RuntimeError("GEMINI_API_KEY is missing")


          # =========================================================
          # 1. DOWNLOAD LATEST SUJAS
          # =========================================================

          payload = {
              "AdmDepartmentCode": 0,
              "AttachmentList": [],
              "BeneficiaryCategory": 0,
              "Date": "",
              "DepartmentCode": 85,
              "DeptSectionCode": 0,
              "EntryFromDate": "",
              "EntryToDate": "",
              "FromDate": "",
              "Id": 0,
              "IndexModel": {
                  "AdvanceSearchModel": {},
                  "PageSize": 15,
                  "IsPostBack": False,
                  "OrderByAsc": 0,
                  "Search": None,
                  "OrderBy": None
              },
              "IndividualBeneficiaryScheme": "",
              "IsImagesRequired": True,
              "IsLatest": -1,
              "IsNotJankalyan": -1,
              "OrderNo": "",
              "SchemeCode": 0,
              "Search": "",
              "SectorIds": 0,
              "Status": 1,
              "SubTypeCode": "2583",
              "Title": "",
              "ToDate": "",
              "Type": "10"
          }

          print("Calling DIPR API...")

          response = requests.post(
              API,
              json=payload,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          print("API response received")


          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)


          candidates = []

          for item in walk(data):

              if not isinstance(item, dict):
                  continue

              title = str(
                  item.get("Title") or ""
              ).strip()

              if "सुजस" not in title:
                  continue

              attachments = item.get(
                  "AttachmentList"
              )

              if not isinstance(
                  attachments,
                  list
              ):
                  continue

              for attachment in attachments:

                  if not isinstance(
                      attachment,
                      dict
                  ):
                      continue

                  path = (
                      attachment.get("Path")
                      or attachment.get("path")
                  )

                  if not path:
                      continue

                  candidates.append({
                      "id": item.get("Id"),
                      "title": title,
                      "date": item.get("Date"),
                      "path": path,
                      "attachment_name":
                          attachment.get(
                              "AttachmentsName"
                          )
                  })


          print(
              "Sujas candidates:",
              len(candidates)
          )


          if not candidates:
              raise RuntimeError(
                  "Sujas PDF not found"
              )


          def sort_key(item):

              date_text = str(
                  item.get("date") or ""
              )

              try:
                  dt = datetime.fromisoformat(
                      date_text.replace(
                          "Z",
                          "+00:00"
                      )
                  )
                  timestamp = dt.timestamp()
              except Exception:
                  timestamp = 0

              try:
                  item_id = int(
                      item.get("id") or 0
                  )
              except Exception:
                  item_id = 0

              return timestamp, item_id


          candidates.sort(
              key=sort_key,
              reverse=True
          )

          selected = candidates[0]

          pdf_url = str(
              selected["path"]
          ).strip()


          # Convert markdown URL to normal URL
          match = re.search(
              r"\]\((https?://[^)]+)\)",
              pdf_url
          )

          if match:
              pdf_url = match.group(1)


          if not pdf_url.startswith(
              "http://"
          ) and not pdf_url.startswith(
              "https://"
          ):
              raise RuntimeError(
                  f"Invalid PDF URL: {pdf_url}"
              )


          print()
          print("========================================")
          print("SELECTED SUJAS")
          print("========================================")

          print(
              json.dumps(
                  selected,
                  ensure_ascii=False,
                  indent=2
              )
          )


          print()
          print("Downloading PDF...")


          pdf_response = requests.get(
              pdf_url,
              timeout=180,
              headers={
                  "User-Agent":
                      "Mozilla/5.0"
              }
          )

          pdf_response.raise_for_status()

          pdf_bytes = pdf_response.content


          if not pdf_bytes.startswith(
              b"%PDF"
          ):
              raise RuntimeError(
                  "Downloaded file is not a valid PDF"
              )


          with open(
              "sujas_today.pdf",
              "wb"
          ) as f:
              f.write(pdf_bytes)


          metadata = {
              "id": selected.get("id"),
              "title": selected.get("title"),
              "date": selected.get("date"),
              "pdf_url": pdf_url,
              "attachment_name":
                  selected.get(
                      "attachment_name"
                  )
          }


          with open(
              "sujas_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Downloaded PDF:",
              len(pdf_bytes),
              "bytes"
          )


          # =========================================================
          # 2. PDF → PAGE IMAGES
          # =========================================================

          Path("pages").mkdir(
              exist_ok=True
          )

          print()
          print("Converting PDF to images...")


          subprocess.run(
              [
                  "pdftoppm",
                  "-jpeg",
                  "-r",
                  "250",
                  "-jpegopt",
                  "quality=95",
                  "sujas_today.pdf",
                  "pages/page"
              ],
              check=True
          )


          images = sorted(
              Path("pages").glob(
                  "page-*.jpg"
              )
          )


          if not images:
              raise RuntimeError(
                  "No PDF pages generated"
              )


          print(
              "Total pages:",
              len(images)
          )


          # =========================================================
          # 3. OCR
          # =========================================================

          ocr_pages = []


          for image in images:

              try:
                  page_number = int(
                      image.stem.split("-")[-1]
                  )
              except Exception:
                  continue

              print(
                  f"OCR page {page_number}..."
              )


              result = subprocess.run(
                  [
                      "tesseract",
                      str(image),
                      "stdout",
                      "-l",
                      "hin+eng",
                      "--psm",
                      "3"
                  ],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace"
              )


              text = result.stdout.strip()


              ocr_pages.append({
                  "page": page_number,
                  "text": text
              })


              print(
                  f"Page {page_number}: "
                  f"{len(text)} characters"
              )


          with open(
              "ocr_pages.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  ocr_pages,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "OCR completed:",
              len(ocr_pages),
              "pages"
          )


          # =========================================================
          # 4. GEMINI FACT EXTRACTION
          # =========================================================

          client = genai.Client(
              api_key=GEMINI_API_KEY
          )


          schema = {
              "type": "object",
              "properties": {
                  "facts": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "fact": {
                                  "type": "string"
                              },
                              "category": {
                                  "type": "string"
                              },
                              "page": {
                                  "type": "integer"
                              },
                              "evidence": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "fact",
                              "category",
                              "page",
                              "evidence"
                          ]
                      }
                  }
              },
              "required": [
                  "facts"
              ]
          }


          all_facts = []


          for page_data in ocr_pages:

              page_number = int(
                  page_data["page"]
              )

              text = str(
                  page_data.get(
                      "text",
                      ""
                  )
              ).strip()


              if not text:
                  print(
                      f"Page {page_number}: "
                      "empty OCR"
                  )
                  continue


              print()
              print(
                  f"Gemini processing page "
                  f"{page_number}..."
              )


              prompt = f"""
          तुम राजस्थान प्रतियोगी परीक्षाओं के लिए
          FACT EXTRACTION SYSTEM हो।

          यह राजस्थान सरकार के DIPR द्वारा जारी
          Sujas e-Bulletin का Page {page_number} है।

          केवल इसी page के OCR text से facts निकालो।

          STRICT RULES:

          1. अपनी तरफ से कोई जानकारी मत जोड़ो।
          2. इंटरनेट या सामान्य ज्ञान का उपयोग मत करो।
          3. OCR में अस्पष्ट जानकारी हो तो अनुमान मत लगाओ।
          4. नाम, पद, संख्या, तारीख, स्थान और संस्था
             source के अनुसार ही रखो।
          5. हर fact का page {page_number} होना चाहिए।
          6. हर fact के साथ evidence देना अनिवार्य है।
          7. Evidence इसी page के OCR text से होना चाहिए।
          8. सामान्य/महत्वहीन वाक्य छोड़ दो।
          9. केवल exam-oriented महत्वपूर्ण facts निकालो।
          10. Duplicate facts मत निकालो।
          11. MCQ मत बनाओ।
          12. Options मत बनाओ।
          13. Answer मत बनाओ।
          14. अगर किसी बात का source evidence स्पष्ट नहीं है,
              उसे fact मत बनाओ।

          Categories:
          नियुक्ति
          योजना
          नीति
          कार्यक्रम
          प्रशासन
          शिक्षा
          स्वास्थ्य
          कृषि
          खेल
          पुरस्कार
          अर्थव्यवस्था
          बजट
          पर्यावरण
          विज्ञान एवं तकनीक
          आधारभूत संरचना
          चुनाव
          व्यक्ति
          स्थान
          अन्य

          Output:
          fact = साफ exam-oriented fact
          category = उपयुक्त category
          page = {page_number}
          evidence = source OCR में मौजूद supporting text

          PAGE {page_number} OCR:

          {text}
          """


              success = False


              for attempt in range(4):

                  try:

                      result = client.models.generate_content(
                          model=MODEL,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema=schema,
                              temperature=0.1
                          )
                      )


                      parsed = json.loads(
                          result.text
                      )


                      facts = parsed.get(
                          "facts",
                          []
                      )


                      valid_facts = []


                      for item in facts:

                          if not isinstance(
                              item,
                              dict
                          ):
                              continue


                          fact = str(
                              item.get(
                                  "fact",
                                  ""
                              )
                          ).strip()


                          category = str(
                              item.get(
                                  "category",
                                  ""
                              )
                          ).strip()


                          evidence = str(
                              item.get(
                                  "evidence",
                                  ""
                              )
                          ).strip()


                          try:
                              page = int(
                                  item.get(
                                      "page",
                                      page_number
                                  )
                              )
                          except Exception:
                              page = page_number


                          if not fact:
                              continue

                          if not evidence:
                              continue

                          if page != page_number:
                              continue


                          valid_facts.append({
                              "fact": fact,
                              "category": category,
                              "page": page,
                              "evidence": evidence
                          })


                      print(
                          f"Page {page_number}: "
                          f"{len(valid_facts)} facts"
                      )


                      all_facts.extend(
                          valid_facts
                      )


                      success = True
                      break


                  except Exception as error:

                      print(
                          f"Attempt {attempt + 1} "
                          f"failed for page "
                          f"{page_number}: "
                          f"{error}"
                      )


                      if attempt < 3:
                          time.sleep(
                              2 ** attempt
                          )


              if not success:

                  print(
                      f"Page {page_number}: "
                      "Gemini failed after retries"
                  )


          # =========================================================
          # 5. REMOVE DUPLICATES
          # =========================================================

          unique_facts = []
          seen = set()


          for item in all_facts:

              key = (
                  item["fact"]
                  .strip()
                  .lower()
              )


              if key in seen:
                  continue


              seen.add(key)
              unique_facts.append(
                  item
              )


          output = {
              "source": "Rajasthan Sujas",
              "source_date": metadata.get(
                  "date"
              ),
              "source_title": metadata.get(
                  "title"
              ),
              "pdf_url": metadata.get(
                  "pdf_url"
              ),
              "facts_count": len(
                  unique_facts
              ),
              "facts": unique_facts
          }


          with open(
              "verified_facts.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # 6. PRINT RESULT
          # =========================================================

          print()
          print("=" * 70)
          print(
              "TOTAL VERIFIED FACTS:",
              len(unique_facts)
          )
          print("=" * 70)


          for index, item in enumerate(
              unique_facts,
              1
          ):

              print()
              print(
                  f"{index}. {item['fact']}"
              )

              print(
                  f"   Category: "
                  f"{item['category']}"
              )

              print(
                  f"   Page: "
                  f"{item['page']}"
              )

              print(
                  f"   Evidence: "
                  f"{item['evidence']}"
              )


          print()
          print(
              "FACT EXTRACTION COMPLETED"
          )

          PYTHON

      - name: Run Sujas processing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python process_sujas.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sujas-fact-extraction
          path: |
            sujas_today.pdf
            sujas_metadata.json
            ocr_pages.json
            verified_facts.json
