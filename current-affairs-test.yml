name: Meridian Caption Test

on:
  workflow_dispatch:

jobs:
  caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check captions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["YOUTUBE_API_KEY"]
          video_id = "u8HlUeD7r0A"

          r = requests.get(
              "https://www.googleapis.com/youtube/v3/captions",
              params={
                  "part": "id,snippet",
                  "videoId": video_id,
                  "key": key
              },
              timeout=20
          )

          print("HTTP STATUS:", r.status_code)

          if r.status_code != 200:
              print("API RESPONSE:")
              print(r.text)
              raise SystemExit(1)

          data = r.json()
          tracks = data.get("items", [])

          print()
          print("CAPTION TRACKS:", len(tracks))
          print()

          if not tracks:
              print("❌ इस video के लिए कोई caption track नहीं मिला।")
          else:
              print("✅ Caption tracks मिले:")
              for track in tracks:
                  s = track["snippet"]
                  print("Language:", s.get("language"))
                  print("Name:", s.get("name"))
                  print("Kind:", s.get("trackKind"))
                  print()
          PY
